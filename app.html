          duration: (st.duration || 0) * 60,   // 텐센트는 '분' 단위
          name: st.road_name || '',
          maneuver: { type, modifier: mod, location: loc },
        };
      });
      steps.push({
        distance: 0, duration: 0, name: '',
        maneuver: { type: 'arrive', modifier: '', location: pts[pts.length - 1] },
      });

      return {
        distance: r.distance,
        duration: (r.duration || 0) * 60,     // 분 → 초
        geometry: { coordinates: pts },
        legs: [{ steps }],
      };
    });
  }

  // ══════════════════════════════════════════
  //  국내 도보 경로 (TMAP 보행자 경로안내)
  //  OSRM은 오픈스트리트맵 기반이라 국내 보도 데이터가 부실하다.
  //  TMAP은 횡단보도·육교·지하보도까지 반영된 실제 보행 경로를 준다.
  // ══════════════════════════════════════════

  // TMAP 회전 코드 → OSRM 형식
  //  ★ TMAP 회전 코드 → 우리 표현.
  //    보행자와 자동차가 코드 체계를 공유하지만 자동차에만 있는 것이 많다
  //    (고속도로 입출구·P턴). 규격서에서 확인한 것만 적는다.
  const TMAP_TURN = {
    11: ['turn', 'straight'],     12: ['turn', 'left'],         13: ['turn', 'right'],
    14: ['turn', 'uturn'],        15: ['turn', 'pturn'],
    16: ['turn', 'sharp left'],   17: ['turn', 'slight left'],
    18: ['turn', 'slight right'], 19: ['turn', 'sharp right'],
    43: ['turn', 'right'],        44: ['turn', 'left'],
    // 고속도로·도시고속도로 입구
    101: ['ramp', 'right'], 102: ['ramp', 'left'], 103: ['ramp', 'straight'],
    111: ['ramp', 'right'], 112: ['ramp', 'left'], 113: ['ramp', 'straight'],
    // 고속도로·도시고속도로 출구
    104: ['exit', 'right'], 105: ['exit', 'left'], 106: ['exit', 'straight'],
    114: ['exit', 'right'], 115: ['exit', 'left'], 116: ['exit', 'straight'],
    117: ['turn', 'slight right'], 118: ['turn', 'slight left'],
    200: ['depart', ''],
    201: ['arrive', ''], 182: ['arrive', 'left'], 183: ['arrive', 'right'],
    203: ['arrive', 'across'],
  };

  //  ══════════════════════════════════════════
  //   TMAP 경로 — 걸을 때와 탈 때는 다른 API 다
  //  ══════════════════════════════════════════
  //  ★★ 전에는 자동차 모드면 TMAP 을 아예 안 쓰고 OSRM 공개 서버로 넘겼다.
  //    그 서버는 한국 도로 정확도가 떨어지고 실시간 교통도, 한국어 안내도 없다.
  //    차에서 써보니 "도보랑 똑같다" 고 느껴진 이유의 절반이 이것이었다.
  //  ★ TMAP 에 자동차 경로안내가 따로 있다 (규격서 확인).
  //    응답이 보행자와 **같은 GeoJSON 구조**라 해석기를 그대로 쓴다.
  //    다른 건 주소와 보내는 값뿐이다.
  function fetchTmapRoute(from, dest) {
    const car = (navProfile === 'driving');

    const url = car
      ? 'https://apis.openapi.sk.com/tmap/routes?version=1&format=json'
      : 'https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&format=json';

    const body = {
      startX: from.lng, startY: from.lat,
      endX: dest.lng,   endY: dest.lat,
      reqCoordType: 'WGS84GEO', resCoordType: 'WGS84GEO',
      startName: '출발', endName: '도착',
      sort: 'index',
    };
    if (car) {
      body.searchOption = '00';   // 교통최적 + 추천 (티맵 기본값)
      body.carType = 0;           // 승용차
      body.trafficInfo = 'Y';     // 혼잡도도 함께 받는다
    }

    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'appKey': TMAP_KEY },
      body: JSON.stringify(body),
    }).then(async r => {
      const t = await r.text();
      if (!r.ok) throw new Error(`TMAP ${r.status}` + (t ? ' · ' + t.slice(0, 80) : ''));
      if (!t.trim()) throw new Error('TMAP 이 빈 응답을 줌');
      return JSON.parse(t);
    }).then(parseTmapRoute);
  }

  /// TMAP 응답(보행자·자동차 공통 GeoJSON)을 우리 경로 형태로 옮긴다
  function parseTmapRoute(d) {
    const feats = d.features || [];
    if (!feats.length) throw new Error(d.error && d.error.message || 'TMAP 경로 없음');

    const head = (feats[0] && feats[0].properties) || {};
    const pts = [];
    const steps = [];

    for (const f of feats) {
      const pr = f.properties || {}, g = f.geometry || {};
      if (g.type === 'LineString') {
        // 경로선 — 중복 좌표는 건너뛴다
        for (const c of g.coordinates) {
          const last = pts[pts.length - 1];
          if (!last || last[0] !== c[0] || last[1] !== c[1]) pts.push(c);
        }
      } else if (g.type === 'Point') {
        const [type, mod] = TMAP_TURN[pr.turnType] || ['turn', 'straight'];
        // ★ 자동차는 nextRoadName 이 훨씬 쓸모 있다 ("소공로" 처럼).
        //   description 은 "…방면으로 좌회전 후 …190m 이동" 처럼 길어서
        //   600×600 안경 화면에 안 들어간다.
        const label = (pr.nextRoadName || pr.description || '')
          .replace(/^,\s*/, '').trim();
        steps.push({
          distance: 0,        // 아래에서 다음 지점까지 거리로 채운다
          duration: 0,
          name: label,
          maneuver: { type, modifier: mod, location: g.coordinates },
        });
      }
    }
    if (pts.length < 2) throw new Error('TMAP 경로 좌표 부족');

    for (let i = 0; i < steps.length - 1; i++) {
      const a = steps[i].maneuver.location, b = steps[i + 1].maneuver.location;
      steps[i].distance = Math.round(
        Math.hypot((b[1] - a[1]) * 111320, (b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180))
      );
    }
    if (!steps.length || steps[steps.length - 1].maneuver.type !== 'arrive') {
      steps.push({ distance: 0, duration: 0, name: '',
        maneuver: { type: 'arrive', modifier: '', location: pts[pts.length - 1] } });
    }

    return {
      distance: head.totalDistance || 0,
      duration: head.totalTime || 0,      // TMAP 은 초 단위
      fare: head.totalFare || 0,          // 통행료 (자동차만 온다)
      geometry: { coordinates: pts },
      legs: [{ steps }],
    };
  }

  // 나라에 따라 경로 엔진을 고른다. 실패하면 OSRM으로 넘어간다.
  function fetchRoute(from, dest) {
    if (currentCountry() === 'cn') {
      return fetchTencentRoute(from, dest).catch(e => {
        console.warn('텐센트 경로 실패, OSRM으로 대체:', e && e.message);
        return fetchOSRMRoute(from, dest);
      });
    }
    return fetchTmapRoute(from, dest).catch(e => {
      console.warn('TMAP 경로 실패, OSRM으로 대체:', e && e.message);
      return fetchOSRMRoute(from, dest);
    });
  }

  // ── OSRM (한국·그 외 / 텐센트 실패 시 대체) ──
  //  ★★ 공개 OSRM 데모 서버는 **자동차 프로파일만** 호스팅한다.
  //    'foot' 로 부르면 오류가 온다. 그런데 전에는 실패를 null 로 조용히
  //    돌려줘서, 화면은 로딩만 사라지고 "경로 계산 중..." 이 영원히 남았다.
  //    ※ 없는 것을 있는 척하지 않는다. 못 하면 못 한다고 던진다.
  function fetchOSRMRoute(from, dest) {
    const profile = 'driving';   // 이 서버가 가진 건 이것뿐이다
    const url = `https://router.project-osrm.org/route/v1/${profile}/${from.lng},${from.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson&steps=true`;
    return getJson(url).then(d => {
      const r0 = d && d.routes && d.routes[0];
      if (!r0) throw new Error('OSRM 경로 없음');
      return r0;
    });
  }

  // ── 이동 수단 선택 ──
  function setProfile(mode) {
    navProfile = mode;
    //  ★ 색만으로 알리지 않는다. 밝은 데서는 색이 씻긴다.
    //    선택된 쪽에 ● 를 붙여 글자로도 남긴다.
    const foot = document.getElementById('btn-foot');
    const drive = document.getElementById('btn-drive');
    if (foot)  foot.textContent  = (mode === 'foot'    ? '● ' : '') + '🚶 도보';
    if (drive) drive.textContent = (mode === 'driving' ? '● ' : '') + '🚗 드라이브';
    // ★ 모드를 바꾸면 안내 상태를 비운다.
    //   문턱·안내거리·소요시간 계산이 전부 달라지므로 옛 값이 남으면 안 된다.
    spokenDistBucket = null; spokenBucketVal = null;
    document.getElementById('btn-foot').classList.toggle('active-mode', mode === 'foot');
    document.getElementById('btn-drive').classList.toggle('active-mode', mode === 'driving');
    // 네비 카드 아이콘 업데이트
    const icon = document.querySelector('.nav-card-row span');
    if (icon) icon.textContent = mode === 'foot' ? '🚶' : '🚗';
  }
  document.getElementById('btn-foot').addEventListener('click', () => setProfile('foot'));
  document.getElementById('btn-drive').addEventListener('click', () => setProfile('driving'));

  // ── 타일 수학 ──
  // ★ 지도 타일은 정수 줌에만 존재한다.
  //   줌을 부드럽게 만들면서 소수(17.5)를 그대로 넘겼더니
  //   없는 타일을 부르게 되어 도로가 통째로 사라졌다.
  //   타일 계산은 정수로 하고, 소수부는 캔버스를 확대해 표현한다.
  function tileZ() { return Math.round(mapView.zoom); }
  function zoomScale() { return Math.pow(2, mapView.zoom - tileZ()); }

  function latLngToTilePixel(lat, lng, z) {
    const n = Math.pow(2, z);
    const tx = (lng + 180) / 360 * n;
    const latRad = lat * Math.PI / 180;
    const ty = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
    return { tx, ty };
  }

  // ══════════════════════════════════════════
  //  지도를 진행 방향으로 돌린다
  // ══════════════════════════════════════════
  //  ★★ 전에는 **북쪽 고정**이었다. 나침반 값은 현재 위치의 부채꼴을
  //    돌리는 데만 썼다. 그런데 화면을 쿼터뷰로 기울여 놓았으므로
  //    '화면 위쪽 = 앞' 으로 읽히는데, 실제로는 북쪽이었다.
  //    남쪽으로 가면 경로선이 발밑으로 뻗는다.
  //    안경이 머리에 붙어 있는 만큼 이건 바로 방향 착각이 된다.
  //
  //  ★ 진행 방향이 화면 위로 오게 돌린다 (티맵·네이버와 같은 방식).
  //  ※ 갑자기 홱 돌면 멀미가 난다. 매 프레임 조금씩 따라가게 한다.
  //  ※ 방향을 모를 때는 돌리지 않는다 — 엉뚱하게 돌아간 지도는
  //    안 돌아간 지도보다 나쁘다.
  let viewRot = 0;        // 지금 화면이 돌아간 각(라디안)

  //  ══════════════════════════════════════════
  //   ★★ 여기가 "목적지가 좌우로 계속 움직인다" 의 범인이었다
  //  ══════════════════════════════════════════
  //   지도 회전을 facingDeg() 에 걸었다. 그런데 그 값은 **나침반이 우선**이고,
  //   안경 나침반은 **머리가 향한 방향**이다.
  //   즉 고개를 조금만 돌려도 지도가 통째로 돌았다.
  //   목적지 핀도, 경로선도 같이 흔들린다.
  //
  //   ★ 지도를 돌리는 기준은 **가는 방향(GPS course)** 이어야 한다.
  //     티맵도 네이버도 차가 가는 방향으로 돌지, 운전자가 보는 쪽으로 안 돈다.
  //   ※ 현재 위치 부채꼴은 그대로 나침반을 쓴다 — 그건 '내가 어디를 보는가' 라서
  //     머리 방향이 맞다. 두 값의 쓰임이 다르다.
  //   ※ 가는 방향을 모르면(서 있으면) **안 돌린다.** 서 있을 때 도는 지도는
  //     방향을 알려주는 게 아니라 어지럽게 만들 뿐이다.
  function travelDeg() {
    if (currentHeading == null) return null;
    if (Date.now() - lastGpsHeadingAt > 5000) return null;
    return currentHeading;
  }

  function updateViewRot() {
    const deg = travelDeg();
    if (deg == null) return;                 // 서 있으면 그대로 둔다
    const target = -deg * Math.PI / 180;
    let d = target - viewRot;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    //  ★ 잔떨림은 무시한다. GPS 방향은 3~5도씩 흔들린다 —
    //    그대로 따라가면 지도가 미세하게 계속 떤다.
    if (Math.abs(d) < 0.09) return;           // 약 5도
    viewRot += d * 0.06;                      // 천천히 (전에는 0.12 라 홱 돌았다)
  }

  // ── 원근 투영 (탑뷰 → 쿼터뷰) ──
  // 현재 위치(POS_X, POS_Y)를 기준점으로, 앞쪽(위)일수록 압축·수렴
  function proj(x, y) {
    const p = mapView.pitch;
    if (p < 0.005) return { x, y, ok: true };
    const d = POS_Y - y;                  // 앞쪽 거리 (양수 = 전방)
    const denom = 1 + d * PITCH_K * p;
    if (denom < 0.15) return { x, y, ok: false };  // 지평선 너머 = 클립
    return {
      x: POS_X + (x - POS_X) / denom,
      y: POS_Y - d / denom,
      ok: true,
    };
  }

  function latLngToPixel(lat, lng) {
    const { tx: cx, ty: cy } = latLngToTilePixel(mapView.centerLat, mapView.centerLng, tileZ());
    const { tx, ty } = latLngToTilePixel(lat, lng, tileZ());
    // 현재위치가 POS_X, POS_Y (하단 1/3)에 오도록 오프셋
    let fx = (tx - cx) * TILE_SIZE + POS_X;
    let fy = (ty - cy) * TILE_SIZE + POS_Y;
    // ★ 내 자리를 중심으로 돌린다. 기울이기(proj)는 그 뒤에 한다 —
    //   순서가 바뀌면 원근이 엉뚱한 축으로 걸린다.
    if (viewRot) {
      const dx = fx - POS_X, dy = fy - POS_Y;
      const c = Math.cos(viewRot), sn = Math.sin(viewRot);
      fx = POS_X + dx * c - dy * sn;
      fy = POS_Y + dx * sn + dy * c;
    }
    return proj(fx, fy);
  }

  // ── 렌더 루프 ──
  function startRenderLoop() {
    if (animFrame) cancelAnimationFrame(animFrame);
    //  ★ 60fps 로 다시 그릴 이유가 없다.
    //    위치는 1~5초에 한 번 오고, 사람이 보는 화면이지 게임이 아니다.
    //    ※ 안경은 발열에 민감하다. 뜨거워지면 화면 밝기부터 떨어지고,
    //      그러면 오늘 한 가시성 작업이 통째로 무의미해진다.
    let lastDrawAt = 0;
    const DRAW_MS = 50;                 // 초당 20번
    function loop() {
      animFrame = requestAnimationFrame(loop);
      const now = performance.now();
      //  카메라가 움직이는 중(줌·기울이기 전환)에는 부드럽게 보여야 하므로 다 그린다
      const moving = Math.abs(mapView.zoom - zoomTarget) > 0.002
                  || Math.abs(mapView.pitch - pitchTarget) > 0.001;
      if (!moving && now - lastDrawAt < DRAW_MS) return;
      lastDrawAt = now;

      pulsePhase = (pulsePhase + 0.025) % 1;
      updateViewRot();
      // 카메라 각도 부드럽게 전환 (탑뷰 → 쿼터뷰)
      // 줌도 부드럽게 따라간다
      //  ★ 20fps 로 낮춘 뒤 줌이 굼떠졌다. 프레임이 줄었으면 한 프레임에
      //    더 많이 움직여야 같은 시간에 도착한다. (0.18 × 60fps ≒ 0.4 × 20fps)
      if (Math.abs(mapView.zoom - zoomTarget) > 0.002) {
        mapView.zoom += (zoomTarget - mapView.zoom) * 0.4;
      } else {
        mapView.zoom = zoomTarget;
      }
      if (Math.abs(mapView.pitch - pitchTarget) > 0.001) {
        mapView.pitch += (pitchTarget - mapView.pitch) * 0.12;
      } else {
        mapView.pitch = pitchTarget;
      }
      renderMap();
    }
    loop();
  }
  function stopRenderLoop() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  }

  // ── Canvas 렌더링 ──
  function renderMap() {
    ctx.clearRect(0, 0, 600, 600);

    const z = tileZ();
    const { tx: cx, ty: cy } = latLngToTilePixel(mapView.centerLat, mapView.centerLng, z);

    // 소수 줌은 화면을 확대해서 표현한다 (타일은 정수 줌만 있다)
    ctx.save();
    const sc = zoomScale();
    if (Math.abs(sc - 1) > 0.001) {
      ctx.translate(POS_X, POS_Y);
      ctx.scale(sc, sc);
      ctx.translate(-POS_X, -POS_Y);
    }

    //  ★ 도로 이름을 고르려면 경로가 화면 어디에 있는지 먼저 알아야 한다.
    //    도로를 그리기 전에 만들어 둔다.
    //  ※ 경로점을 다 쓰지 않고 띄엄띄엄(최대 80개) 쓴다 —
    //    이름 고르는 데에는 그 정도 정밀도면 충분하고, 매 프레임 도는 계산이다.
    routeScreen = [];
    if (routeCoords.length > 1) {
      const step = Math.max(1, Math.ceil(routeCoords.length / 80));
      for (let i = 0; i < routeCoords.length; i += step) {
        const p = latLngToPixel(routeCoords[i].lat, routeCoords[i].lng);
        if (p.ok !== false) routeScreen.push(p);
      }
    }

    // 배경 지도 — 칼라 타일이 우선, 안 되면 예전 벡터 흰 선
    if (USE_RASTER) drawRasterMap(cx, cy);
    else drawRoads(cx, cy);

    // 경로선 (Meta 스타일 - 얇고 선명한 파란선)
    //  ══════════════════════════════════════════
    //   ★ 지나온 길은 지운다
    //  ══════════════════════════════════════════
    //   전에는 출발점부터 도착점까지 통째로 그렸다. 그래서 이미 지나온 구간이
    //   내 뒤에 그대로 남아 있었다.
    //   ※ 좁은 화면(20°)에서 **이미 끝난 정보는 방해**다. 앞으로 갈 길과
    //     뒤에 남은 선이 같은 굵기·같은 색이면 어느 쪽이 앞인지 헷갈린다.
    //   ※ alongNow(경로 위 내 자리)는 이미 재고 있었다. 그 뒤쪽만 안 그리면 된다.
    const drawCoords = remainingRouteCoords();
    if (drawCoords.length > 1) {
      // ★ 경로선은 화면에서 가장 중요한 선이다. 도로보다 확실히 위에 보여야 한다.
      //   외곽 번짐 (넓게, 그러나 도로와 섞이지 않게 색을 확실히)
      ctx.beginPath();
      //  ★ 바깥 띠는 '경로가 지나가는 폭' 을 알려주는 몸통이다.
      //    도로가 밝아진 만큼 이것도 같이 올린다 (0.40 → 0.60 ≈ 3,000 nit).
      ctx.strokeStyle = 'rgba(60,255,140,0.60)';
      ctx.lineWidth = 22; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      let started = false;
      drawCoords.forEach(pt => {
        const p = latLngToPixel(pt.lat, pt.lng);
        if (!p.ok) { started = false; return; }
        started ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
        started = true;
      });
      ctx.stroke();

      // 메인선 (굵고 선명)
      ctx.beginPath();
      // ★ 파랑은 흰 도로 위에 얹히면 빛이 섞여 묻혔다 (더하기 화면).
      //   초록은 흰색과 가장 멀리 떨어져 있어 겹쳐도 구분된다.
      ctx.strokeStyle = '#3cff8c';
      ctx.lineWidth = 13; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      //  ★ 글로우(shadowBlur)를 뺐다.
      //    불투명 화면에서는 강조지만 **더하기 화면에서는 빛을 주변에 퍼뜨려
      //    경계를 흐린다.** 밝아 보이지만 덜 또렷해진다.
      //    강조는 번짐이 아니라 굵기로 한다 (11 → 13px).
      started = false;
      drawCoords.forEach(pt => {
        const p = latLngToPixel(pt.lat, pt.lng);
        if (!p.ok) { started = false; return; }
        started ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
        started = true;
      });
      ctx.stroke();
    }

    //  ── 도로 가장자리 (경로 주변 도로의 실제 폭) ──
    //  ※ 경로선보다 **먼저** 그린다. 경로가 위에 얹혀야 어느 게 갈 길인지 읽힌다.
    if (roadEdges.length) {
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      //  ※ 점선으로 그려봤다가 되돌렸다. 어림값이라는 걸 모양으로 알리려 했는데,
      //    더하기 화면에서 촘촘한 점선은 번져서 **흐린 실선**으로 보인다 —
      //    뜻은 전달 안 되고 선명함만 잃는다.
      //    게다가 접근 구간이 이미 노란 점선이라 점선이 둘이면 헷갈린다.
      //  ★ 어림값이라는 사실은 화면에서 알릴 게 아니라 값을 잘 잡아서 줄인다.
      ctx.beginPath();
      for (const e of roadEdges) {
        const p = latLngToPixel(e.a.lat, e.a.lng);
        const q = latLngToPixel(e.b.lat, e.b.lng);
        if (p.ok === false || q.ok === false) continue;
        if (p.x < -200 && q.x < -200) continue;
        ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
      }
      ctx.stroke();
      ctx.restore();
    }

    //  ── 접근 구간 점선 ──
    //  ※ 경로선 **다음에** 그린다. 경로선 아래로 깔면 겹치는 부분에서
    //    초록에 묻혀 안 보인다. 다만 현재 위치보다는 먼저 그린다.
    if (linkTarget && currentPos) {
      const a = latLngToPixel(currentPos.lat, currentPos.lng);
      const b = latLngToPixel(linkTarget.lat, linkTarget.lng);
      if (a.ok !== false && b.ok !== false) {
        ctx.save();
        //  ★ 점선 간격을 넉넉히 (12/10). 더하기 화면에서 촘촘한 점선은
        //    번져서 실선으로 보인다 — 그러면 '길' 로 오해한다.
        ctx.setLineDash([12, 10]);
        ctx.lineCap = 'butt';
        //  경로선(초록)과 다른 색이어야 '길이 아니다' 가 읽힌다.
        ctx.strokeStyle = '#ffd27a';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.stroke();
        //  붙어야 할 지점에 작은 고리를 찍는다 — 선만 있으면 어디까지인지 모른다
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, Math.PI * 2);
        ctx.lineWidth = 4; ctx.stroke();
        ctx.restore();
      }
    }

    // 목적지 핀 or 화면 밖이면 가장자리 방향 인디케이터
    if (selectedDest) {
      const { x, y } = latLngToPixel(selectedDest.lat, selectedDest.lng);
      const margin = 24;
      const onScreen = x > margin && x < 600-margin && y > margin && y < 600-margin;
      if (onScreen) {
        drawDestPin(x, y);
      } else {
        drawDestEdgeIndicator(x, y);
      }
    }

    //  ══════════════════════════════════════════
    //   현재 위치 — 경로에 붙어 있으면 경로 위에 그린다
    //  ══════════════════════════════════════════
    //  ★★ "경로에서 내 아이콘이 1~2cm 우측으로 벗어난다" 의 원인.
    //    GPS 는 도심에서 몇 미터씩 튄다. 그 값을 그대로 찍으니
    //    선 옆에 나란히 떠 있게 된다.
    //  ★ 이미 '경로 위 내 자리(alongNow)' 를 재고 있다. 붙어 있을 때는
    //    그 자리에 그린다. GPS 원값이 아니라 **경로 위로 맞춰 그리는 것**이다.
    //  ※ 이건 경로를 도로에 끌어다 붙이는 것(스냅)과 다르다.
    //    남의 데이터를 건드리는 게 아니라, **내 위치를 내 경로 위에** 놓는 것이다.
    //    차량 내비가 전부 이렇게 한다.
    //  ※ 벗어났으면 맞추지 않는다. 벗어난 것을 감추면 '내가 지금 경로 밖' 이라는
    //    사실 자체가 안 보인다 — 그게 훨씬 나쁘다. 노란 점선이 그때 나온다.
    if (currentPos) {
      let showAt = currentPos;
      if (!linkTarget && routeCoords.length > 1 && routeCum.length) {
        const onLine = pointAlongRoute(alongNow);
        if (onLine) showAt = onLine;
      }
      const { x, y } = latLngToPixel(showAt.lat, showAt.lng);
      drawCurrentPos(x, y);
    }

    ctx.restore();   // 소수 줌 확대 해제
  }

  function drawDestPin(x, y) {
    // 물방울 핀 (구글맵 스타일)
    ctx.save();
    ctx.translate(x, y);
    // 그림자
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
    // 핀 몸통 (원)
    ctx.beginPath(); ctx.arc(0, -14, 11, 0, Math.PI*2);
    ctx.fillStyle = '#e8333a'; ctx.fill();
    // 핀 꼭지
    ctx.beginPath();
    ctx.moveTo(-7, -5); ctx.lineTo(7, -5); ctx.lineTo(0, 6);
    ctx.closePath(); ctx.fillStyle = '#e8333a'; ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    // 핀 내부 흰 원
    ctx.beginPath(); ctx.arc(0, -14, 5, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
  }

  // 목적지가 화면 밖일 때 가장자리 방향 인디케이터
  function drawDestEdgeIndicator(destX, destY) {
    const cx = 300, cy = 300; // 화면 중심
    const pad = 20; // 가장자리 여백
    const W = 600, H = 600;

    // 화면 중심 → 목적지 방향 각도
    const angle = Math.atan2(destY - cy, destX - cx);
    const cos = Math.cos(angle), sin = Math.sin(angle);

    // 화면 가장자리 교차점 계산
    let ex, ey;
    const tx = cos > 0 ? (W - pad - cx) / cos : cos < 0 ? -(cx - pad) / cos : Infinity;
    const ty = sin > 0 ? (H - pad - cy) / sin : sin < 0 ? -(cy - pad) / sin : Infinity;
    const t = Math.min(Math.abs(tx), Math.abs(ty));
    ex = cx + cos * t;
    ey = cy + sin * t;

    // 클램프
    ex = Math.max(pad, Math.min(W - pad, ex));
    ey = Math.max(pad, Math.min(H - pad, ey));

    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(angle);

    // 삼각형 화살표
    const sz = 11;
    ctx.beginPath();
    ctx.moveTo(sz, 0);
    ctx.lineTo(-sz * 0.7, -sz * 0.6);
    ctx.lineTo(-sz * 0.7,  sz * 0.6);
    ctx.closePath();
    ctx.fillStyle = '#e8333a';
    ctx.shadowColor = 'rgba(232,51,58,0.7)';
    ctx.shadowBlur = 8;
    ctx.fill();

    // 흰 테두리
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  function drawCurrentPos(x, y) {
    // ★ 방향 부채꼴 — 내가 어느 쪽을 보고 있는지.
    //   이게 없으면 점만 찍혀서 어느 쪽으로 첫걸음을 떼야 할지 알 수 없다.
    //  ══════════════════════════════════════════
    //   ★ 드라이브 모드에서는 **항상 화면 위**를 가리킨다
    //  ══════════════════════════════════════════
    //   지도는 이미 가는 방향으로 돌아가 있다. 그러면 '내가 가는 쪽' = 화면 위다.
    //   그런데 부채꼴은 나침반(=머리 방향)을 따라가고 있었다.
    //   차에서 옆을 흘깃 보면 화살표만 옆으로 돌아간다 — 지도와 따로 논다.
    //   차량 내비는 전부 이렇게 하지 않는다. 차는 앞으로 가고, 화살표도 위다.
    //
    //   ※ 걷기는 다르다. 걸을 때는 서서 두리번거리며 '어느 쪽으로 첫걸음을
    //     뗄까' 를 정한다. 그때는 머리 방향이 진짜 정보다. 그래서 남겨둔다.
    //     같은 부품이지만 두 모드에서 쓰임이 다르다 — 지도(무엇을 그리나)는
    //     같아야 하지만, 이건 '내가 어디를 보는가' 라 성격이 다르다.
    if (navProfile === 'driving') {
      drawFacingFan(x, y, -Math.PI / 2);   // 화면 위쪽 고정
      drawPosDot(x, y);
      return;
    }

    const deg = facingDeg();
    if (deg == null) {
      // ★ 방향을 못 얻었으면 그렇다고 보여준다.
      //   아무것도 안 그리면 '방향이 없는 것' 과 '고장난 것' 을 구분할 수 없다.
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2);
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = '#9ad8ff';   // 더하기 화면에서 반투명은 '연하게' 가 아니라 '지우기' 다
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }
    if (deg != null) {
      // ★ 지도가 진행 방향으로 돌아갔으므로, 부채꼴도 같은 만큼 돌려야
      //   화면에서 위를 가리킨다. (안 돌리면 지도와 부채꼴이 따로 논다)
      const rad = (deg - 90) * Math.PI / 180 + viewRot;
      drawFacingFan(x, y, rad);
    }
    drawPosDot(x, y);
  }

  /// 방향 부채꼴 하나만 그린다 (각도는 화면 기준 라디안)
  function drawFacingFan(x, y, rad) {
    {
      const spread = 0.42;                       // 부채꼴 폭 (약 48도)
      const R = 46;
      const g = ctx.createRadialGradient(x, y, 8, x, y, R);
      g.addColorStop(0, 'rgba(150,215,255,0.95)');
      g.addColorStop(1, 'rgba(106,77,255,0)');
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, R, rad - spread, rad + spread);
      ctx.closePath();
      ctx.fillStyle = g;
      ctx.fill();

      // 끝에 화살촉 하나 — 부채꼴만으로는 방향이 덜 또렷하다
      const ax = x + Math.cos(rad) * (R - 6);
      const ay = y + Math.sin(rad) * (R - 6);
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(rad);
      ctx.beginPath();
      ctx.moveTo(9, 0); ctx.lineTo(-6, -6); ctx.lineTo(-6, 6);
      ctx.closePath();
      ctx.fillStyle = '#dff2ff';     // 화살촉은 가장 밝게 — 방향이 먼저 읽혀야 한다
      ctx.fill();
      ctx.restore();
    }

  }

  /// 현재 위치 점 (펄스 + 흰 링 + 안쪽 원)
  function drawPosDot(x, y) {
    //  ★★ 경로선(초록) 위에 파란 점이 겹치면 둘 다 안 보인다.
    //    더하기 화면에서는 색이 겹치면 밝기가 더해져 뭉개진다.
    //  ★ 밑을 **지우고** 그린다. destination-out 은 이미 그린 것을 지운다 —
    //    더하기 화면에서 지워진 곳은 '검정 = 투명' 이라 완전히 비어 보인다.
    //    그래서 점 둘레에 진짜 빈 고리가 생기고, 점이 선에서 확실히 떨어진다.
    //  ※ 반투명으로 덮는 방법은 안 된다 (밝기가 더해질 뿐이다).
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(x, y, 17, 0, Math.PI * 2);
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.restore();

    //  ★★ "글로우된 파란색이 뭐냐" — 이것이었다. 계속 커졌다 사라지는 펄스 링.
    //    불투명 화면에서는 '여기 내가 있다' 는 표시지만,
    //    더하기 화면에서는 **움직이는 파란 안개**다. 지도를 가리고 시선을 뺏는다.
    //  ※ 내 위치는 화면에서 늘 같은 자리(아래 1/3)에 있다. 찾을 필요가 없다.
    //    찾을 필요가 없는 것을 깜빡여서 알릴 이유도 없다.

    //  ══════════════════════════════════════════
    //   내 위치 — 흰 링 + 안쪽 그라데이션
    //  ══════════════════════════════════════════
    //  ★ 흰색만 쓰면 도로(회색·흰색)에 묻히고, 색만 쓰면 경로(초록)와 겨룬다.
    //    그래서 **둘을 나눈다** — 바깥은 흰 링(어디서나 보인다),
    //    안쪽은 파랑→보라 그라데이션(무엇인지 알린다).
    //  ※ 예전에 파랑이 초록에 묻혔던 건 밑을 안 지웠기 때문이다.
    //    지금은 둘레를 실제로 지우므로(destination-out) 색이 섞이지 않는다.
    //    구조로 해결됐으니 색은 자유롭게 고를 수 있다.
    //  ※ 링은 흰색 하나로 충분하다. 더 두르면 그만큼 빛이 퍼진다.
    ctx.beginPath(); ctx.arc(x, y, 12.5, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();

    const core = ctx.createRadialGradient(x - 3.5, y - 3.5, 1, x, y, 11);
    core.addColorStop(0, '#bff4ff');     // 밝은 하늘 — 위쪽에서 빛이 드는 느낌
    core.addColorStop(0.55, '#4aa8ff');
    core.addColorStop(1, '#6a4dff');     // 보라 — 가장자리로 갈수록 깊게
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2);
    ctx.fillStyle = core; ctx.fill();
  }

  // ── 줌 (키보드 전용) ──
  // 0.5 단계로 목표만 바꾸고, 실제 줌은 매 프레임 그리로 다가간다
  //  ★ 0.5 단계로는 두 번 눌러야 타일이 바뀐다 — '눌렀는데 반응이 없다' 로 느껴진다.
  //    한 단계씩 움직이게 해서 한 번 누르면 눈에 띄게 바뀌도록 한다.
  function zoomIn()  { zoomTarget = Math.min(ZOOM_MAX, Math.round(zoomTarget) + 1); }
  function zoomOut() { zoomTarget = Math.max(ZOOM_MIN, Math.round(zoomTarget) - 1); }

  // ── 경로 이탈 감지 ──
  function distToRoute(lat, lng) {
    if (routeCoords.length < 2) return Infinity;
    let minD = Infinity;
    for (let i = 0; i < routeCoords.length - 1; i++) {
      const d = pointToSegmentDist(lat, lng, routeCoords[i], routeCoords[i+1]);
      if (d < minD) minD = d;
    }
    return minD;
  }
  // ══════════════════════════════════════════
  //  경로 위 어디까지 왔는가 — 진행률
  // ══════════════════════════════════════════
  //  ★★ 차에서 써보고 알았다. 전에는 '다음 회전점까지 직선거리' 만 봤다.
  //
  //    시속 60km 면 초당 17m 다. 위치가 5초마다 오면 한 번에 83m 를 건너뛴다.
  //    그런데 스텝 전진 조건이 '25m 안에 들어오면' 이었다 —
  //    회전점을 지나가도 그 창에 한 번도 안 걸려서 안내가 영영 안 넘어갔다.
  //    남은 거리도 직선이라 화면의 경로선과 눈에 띄게 어긋났다.
  //
  //  ★ 그래서 현재 위치를 **경로선에 투영**한다.
  //    '경로의 몇 미터 지점에 있는가' 하나를 알면
  //    지나쳤는지 · 다음 회전까지 몇 m · 총 몇 m 남았는지가 전부 나온다.
  //    창을 통과했는지에 기대지 않으므로 속도와 무관하다.
  let routeCum = [];      // 각 경로점까지의 누적 거리(m)
  let stepAlong = [];     // 각 안내지점이 경로의 몇 m 지점인가
  let alongNow = 0;       // 지금 내가 있는 지점(m)
  let projHint = 0;       // 지난번에 붙었던 자리 (여기 근처부터 찾는다)
  let routeTotalM = 0;
  let routeDurationS = 0; // 경로가 알려준 총 소요(초)

  function metersBetween(a, b) {
    const dy = (b.lat - a.lat) * 111320;
    const dx = (b.lng - a.lng) * 111320 * Math.cos(a.lat * Math.PI / 180);
    return Math.hypot(dx, dy);
  }

  /// 경로가 새로 들어오면 한 번 계산해 둔다
  function buildRouteIndex(durationSec) {
    routeCum = [0];
    for (let i = 1; i < routeCoords.length; i++) {
      routeCum[i] = routeCum[i - 1] + metersBetween(routeCoords[i - 1], routeCoords[i]);
    }
    routeTotalM = routeCum.length ? routeCum[routeCum.length - 1] : 0;
    routeDurationS = durationSec || 0;
    projHint = 0;
    alongNow = 0;
    // 안내지점을 '경로 위 거리' 로 옮겨둔다. 여기서는 전체를 훑어야 한다.
    stepAlong = routeSteps.map(st => {
      //  ★ 스텝에 회전 지점이 없을 수 있다 (옛 버전이 남긴 캐시 경로 등).
      //    여기서 터지면 **안내가 통째로 죽는다** — 화면은 '경로 계산 중' 에서
      //    영영 멈춘다. 한 스텝 못 읽는 것보다 그게 훨씬 나쁘다.
      const loc = st && st.maneuver && st.maneuver.location;
      if (!loc) return 0;
      return projectOnRoute(loc[1], loc[0], 0, routeCoords.length - 1).along;
    });
  }

  /// 한 점을 경로선에 투영한다 → { along(m), offset(m), idx }
  //  ※ 전체를 매번 훑지 않는다. 지난 자리 근처만 본다 —
  //    회차로처럼 경로가 자기 위로 겹칠 때 엉뚱한 곳에 붙는 것도 이걸로 막는다.
  //  ※ 거리는 그 점 기준 평면 근사로 잰다. 경도에 cos(위도) 를 곱해야
  //    가로세로 자가 같아진다 (전에는 안 곱해서 투영점이 치우쳤다).
  function projectOnRoute(lat, lng, from, to) {
    if (routeCoords.length < 2) return { along: 0, offset: Infinity, idx: 0 };
    const lo = (from != null) ? from : Math.max(0, projHint - 30);
    const hi = (to != null) ? to : Math.min(routeCoords.length - 1, projHint + 600);
    const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 111320;

    let best = { along: routeCum[lo] || 0, offset: Infinity, idx: lo };
    for (let i = lo; i < hi; i++) {
      const a = routeCoords[i], b = routeCoords[i + 1];
      const ax = (a.lng - lng) * kx, ay = (a.lat - lat) * ky;
      const bx = (b.lng - lng) * kx, by = (b.lat - lat) * ky;
      const dx = bx - ax, dy = by - ay;
      const len2 = dx * dx + dy * dy;
      let t = 0;
      if (len2 > 0) t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2));
      const px = ax + t * dx, py = ay + t * dy;
      const off = Math.hypot(px, py);
      if (off < best.offset) {
        best = { along: (routeCum[i] || 0) + Math.sqrt(len2) * t, offset: off, idx: i };
      }
    }
    return best;
  }

  /// 거리를 사람이 읽는 꼴로
  //  ══════════════════════════════════════════
  //   경로까지 데려다주는 점선 (접근 구간)
  //  ══════════════════════════════════════════
  //  ★★ 왜 필요한가
  //    건물 안이나 주차장에서 안내를 켜면 나는 도로 위에 있지 않다.
  //    그러면 화면에 **경로선은 저 멀리 떠 있고 나는 아무 데나 찍혀** 있다.
  //    "어느 쪽으로 나가야 하나" 를 화면이 말해주지 않는다.
  //    티맵·네이버가 이 구간을 점선으로 이어주는 게 그래서다.
  //
  //  ※ 실선으로 긋지 않는다. 이 구간은 **길이 아니다** —
  //    건물을 통과하거나 담을 넘는 직선일 수 있다.
  //    실선으로 그으면 "이리로 가라" 로 읽힌다. 점선은 "저기로 붙어라" 다.
  //    모양이 곧 뜻이므로 여기서 아끼면 안 된다.
  let linkTarget = null;    // {lat,lng} — 경로 위 붙어야 할 지점
  let linkDistM  = 0;       // 거기까지 직선 거리

  /// 아직 안 지난 구간만 돌려준다. 지나온 뒤쪽은 버린다.
  /// ※ 안내를 시작하기 전(alongNow=0)에는 경로 전체가 그대로 나온다.
  function remainingRouteCoords() {
    if (routeCoords.length < 2) return routeCoords;
    if (!routeCum.length || alongNow <= 0) return routeCoords;
    //  내가 있는 지점을 첫 점으로 삼는다 — 안 그러면 선이 저만치서 시작해
    //  '경로가 끊겼나' 로 보인다.
    const head = pointAlongRoute(alongNow);
    const out = head ? [head] : [];
    for (let i = 0; i < routeCoords.length; i++) {
      if (routeCum[i] > alongNow) out.push(routeCoords[i]);
    }
    return out.length > 1 ? out : routeCoords;
  }

  /// 경로를 따라 mAlong 미터 지점의 좌표. 없으면 null.
  function pointAlongRoute(mAlong) {
    if (routeCoords.length < 2 || !routeCum.length) return null;
    const m = Math.max(0, Math.min(mAlong, routeTotalM));
    let i = 1;
    while (i < routeCum.length - 1 && routeCum[i] < m) i++;
    const segLen = routeCum[i] - routeCum[i-1];
    const t = segLen > 0 ? (m - routeCum[i-1]) / segLen : 0;
    const a = routeCoords[i-1], b = routeCoords[i];
    return { lat: a.lat + (b.lat - a.lat) * t, lng: a.lng + (b.lng - a.lng) * t };
  }

  function fmtDist(m) {
    if (m >= 1000) return (m / 1000).toFixed(1) + 'km';
    // ★ 차에서는 1m 단위가 의미 없다. 10m 로 끊는다.
    if (navProfile === 'driving') return Math.round(m / 10) * 10 + 'm';
    return Math.round(m) + 'm';
  }

  // ══════════════════════════════════════════
  //  걸을 때와 탈 때의 차이는 여기서만 정한다
  // ══════════════════════════════════════════
  //  ※ 전에는 도보 값 하나로 둘 다 돌렸다. 그래서 '모드가 있으나 마나' 였다.
  function trackOpts() {
    return navProfile === 'driving'
      // 차는 초당 17m 다. 5초 묵은 위치는 83m 뒤의 이야기다.
      ? { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      : { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 };
  }
  function offRouteLimitM() { return navProfile === 'driving' ? 60 : 30; }
  function arriveLimitM()   { return navProfile === 'driving' ? 60 : 30; }

  function pointToSegmentDist(lat, lng, a, b) {
    // 단순 거리 근사 (km)
    const dx = b.lng - a.lng, dy = b.lat - a.lat;
    if (dx === 0 && dy === 0) return getDistanceKm(lat, lng, a.lat, a.lng);
    const t = Math.max(0, Math.min(1, ((lng - a.lng)*dx + (lat - a.lat)*dy) / (dx*dx + dy*dy)));
    return getDistanceKm(lat, lng, a.lat + t*dy, a.lng + t*dx);
  }

  // ── GPS 추적 ──
  //  ★ 위치가 올 때마다 하는 일은 하나뿐이다: **경로 위 내 자리를 갱신한다.**
  //    나머지(도착·ETA·다음 회전·이탈)는 전부 그 값에서 나온다.
  let offStreak = 0;        // 연달아 경로 밖으로 나온 횟수
  let lastRerouteAt = 0;

  function startTracking(dest) {
    //  ★ 시험 위치일 때는 GPS 를 켜지 않는다. 켜면 진짜 내 자리로 튀어
    //    청두를 보려던 게 서울로 돌아온다.
    if (testPos) {
      setNavFlag('routeLoading', false);
      return;
    }
    //  ※ 여기서 미리 켜두지 않는다. 첫 위치가 올 때까지는
    //    '경로 계산 중' 이 이미 떠 있으므로 두 번 말할 필요가 없다.
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    offStreak = 0;
    lastRerouteAt = 0;

    watchId = navigator.geolocation.watchPosition(pos => {
      currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (pos.coords.heading != null) { currentHeading = pos.coords.heading; lastGpsHeadingAt = Date.now(); }
      mapView.centerLat = currentPos.lat;
      mapView.centerLng = currentPos.lng;
      try { localStorage.setItem('ko_navi_last_pos', JSON.stringify(currentPos)); } catch {}
      //  ★ 위치가 다시 왔으면 경고를 **반드시 내린다.**
      //    안 내리면 지나간 오류가 계속 떠 있어 '늑대다' 가 된다
      //    (번역 앱에서 똑같은 걸 겪었다).
      setNavFlag('gpsLost', false);
      setOffline(false);

      if (routeCoords.length < 2) return;

      // ── 경로 위 내 자리 ──
      const pr = projectOnRoute(currentPos.lat, currentPos.lng);

      //  ★★ 여기 구멍이 있었다.
      //    경로에서 아무리 멀리 떨어져 있어도 진행률을 그대로 올렸다.
      //    건물 안에서 켰는데 경로가 그 건물 근처를 두 번 지나가면,
      //    가장 가까운 점이 **뒤쪽 구간이 아니라 앞쪽 구간**으로 잡혀
      //    진행이 통째로 앞으로 튄다 — 회전 안내가 몇 개씩 건너뛴다.
      //  ★ 경로에 붙어 있을 때만 진행으로 친다.
      const ONROUTE_M = 25;
      const onRoute = pr.offset <= ONROUTE_M;
      if (onRoute && pr.along > alongNow) { alongNow = pr.along; projHint = pr.idx; }

      //  ★ 떨어져 있으면 '경로 위 지금 자리' 까지 점선으로 잇는다.
      //    처음엔 alongNow 가 0 이므로 자연히 **출발 지점**을 가리킨다.
      //    가다가 벗어나면 그 시점의 자리를 가리킨다 — 규칙 하나로 둘 다 된다.
      //  ★★ 여기 순서가 뒤집혀 있었다 — "점선 따라 0m" 의 원인.
      //    거리를 재기 **전에** 안내 문구를 만들고 있었다. 그래서 늘 0m 였다.
      //    ※ 값을 쓰는 쪽보다 값을 만드는 쪽이 먼저다. 당연한데 놓쳤다.
      if (onRoute) {
        linkTarget = null; linkDistM = 0;
      } else {
        linkTarget = pointAlongRoute(alongNow);
        linkDistM  = linkTarget ? metersBetween(currentPos, linkTarget) : 0;
      }

      //  ※ 접근 구간에 글로 안내하던 것을 뺐다.
      //    **노란 점선이 이미 같은 말을 하고 있다.** 글까지 띄우면
      //    위쪽이 시끄러워지기만 한다. 그림으로 되는 건 글로 또 말하지 않는다.

      //  ★ 남은 거리에 접근 구간을 더한다.
      //    안 더하면 건물 안에서 '200m' 라고 떠 있다가
      //    밖에 나오는 순간 '250m' 로 늘어난다. 늘어나는 남은 거리는
      //    고장으로 보인다.
      const remainM = Math.max(0, routeTotalM - alongNow) + linkDistM;

      // ── 도착 ──
      if (remainM < arriveLimitM()) {
        navigator.geolocation.clearWatch(watchId); watchId = null;
        // ★ 도착했으면 이어갈 것이 없다. 안 지우면 다시 열 때 또 안내한다.
        try { localStorage.removeItem('navi.active'); } catch (e) {}
        letScreenSleep();
        speak('목적지에 도착했습니다');
        document.getElementById('turn-arrow').textContent = '🏁';
        document.getElementById('turn-dist').textContent = '도착!';
        setTurnText(dest.name);
        document.getElementById('nav-eta').textContent = '도착';
        document.getElementById('nav-dist').textContent = '0.0';
        return;
      }

      // ── 남은 거리·시간 ──
      //  ★ 전에는 목적지까지 직선거리와 4km/h 고정이었다.
      //    드라이브에서 5km 가 75분으로 떴다. 경로가 알려준 소요시간을
      //    남은 비율로 환산한다. (교통정보가 반영된 값이다)
      document.getElementById('nav-dist').textContent = (remainM / 1000).toFixed(1);
      let etaSec;
      if (routeDurationS > 0 && routeTotalM > 0) {
        etaSec = routeDurationS * (remainM / routeTotalM);
      } else {
        etaSec = remainM / (navProfile === 'driving' ? 11.1 : 1.1);  // 40km/h · 4km/h
      }
      document.getElementById('nav-eta').textContent = Math.max(1, Math.round(etaSec / 60));

      // ── 다음 회전 ──
      //  ★ '창을 통과했는가' 로 판단하지 않는다. 지났으면 지난 것이다.
      //    여러 개를 한 번에 지나쳤어도 while 이 따라잡는다.
      let idx = currentStepIndex;
      while (idx < routeSteps.length - 1 && stepAlong[idx + 1] <= alongNow + 5) idx++;
      if (idx !== currentStepIndex) { currentStepIndex = idx; updateStepUI(routeSteps[idx]); }

      const next = routeSteps[currentStepIndex + 1];
      if (next) {
        const dM = Math.max(0, (stepAlong[currentStepIndex + 1] || 0) - alongNow);
        document.getElementById('turn-dist').textContent = fmtDist(dM);
        announceTurn(next, dM / 1000);
      }

      // ── 경로 이탈 ──
      //  ★ 문턱을 넘었다고 바로 다시 잡지 않는다.
      //    도심 GPS 는 30~60m 씩 튄다. 전에는 스로틀이 없어서
      //    고층 빌딩 아래를 지나면 재탐색이 계속 돌 수 있었다.
      //    (rerouteTimer 변수가 있었지만 어디에서도 값을 넣지 않는 죽은 코드였다)
      if (pr.offset > offRouteLimitM()) offStreak++; else offStreak = 0;
      const sinceReroute = Date.now() - lastRerouteAt;
      if (offStreak >= 2 && !isRerouting && sinceReroute > 15000) {
        isRerouting = true;
        lastRerouteAt = Date.now();
        offStreak = 0;
        document.getElementById('turn-dist').textContent = '재경로...';
        speak('경로를 다시 탐색합니다');
        fetchRoute(currentPos, dest).then(route => {
          if (route && route.geometry && route.geometry.coordinates.length > 1) {
            routeCoords = route.geometry.coordinates.map(([lng, lat]) => ({ lat, lng }));
            routeSteps = route.legs[0].steps;
            currentStepIndex = 0;
            spokenDistBucket = null; spokenBucketVal = null;
            buildRouteIndex(route.duration);
            updateStepUI(routeSteps[0]);
          }
          isRerouting = false;
        }).catch(() => { isRerouting = false; });
      }
    }, err => {
      // ★ 조용히 멈추지 않는다. 화면이 얼어붙었는지 내가 멈춘 건지
      //   사용자가 구분할 수 있어야 한다.
      //  ★ 위치를 못 잡은 것과 '오프라인' 은 다른 일이다.
      //    전에는 위치 오류에 setOffline(true) 를 걸어서
      //    "캐시 경로 사용 중" 이 같이 떴다 — 사실이 아니었다.
      console.warn(err.message);
      setNavFlag('gpsLost', true);
    }, trackOpts());
  }

  function stopNav() {
    // 안내를 끝냈으면 이어갈 것이 없다
    try { localStorage.removeItem('navi.active'); } catch (e) {}
    letScreenSleep();
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    stopRenderLoop();
    isRerouting = false; spokenDistBucket = null; spokenBucketVal = null;
    routeCum = []; stepAlong = []; alongNow = 0; projHint = 0;
    routeTotalM = 0; routeDurationS = 0; offStreak = 0;
    roadEdges = []; edgesFor = '';
    navFlags = { gpsLost: false, routeLoading: false, routeFailed: false, offline: false };
    linkTarget = null; linkDistM = 0;
    renderNavStatus();
    mapView.pitch = 0; pitchTarget = 0;
    viewRot = 0;
    routeCoords = []; routeSteps = []; selectedDest = null; currentHeading = null;
  }

  // ── 턴 안내 ──
  //  ★ 칸을 넘어가면 우 → 좌로 흐르게 한다. 안 넘으면 가만히 둔다.
  //    ※ 움직이는 것은 시선을 뺏는다. 필요할 때만 움직여야 한다.
  //    ※ 속도를 글 길이에 맞춘다 — 길수록 오래. 고정 속도로 하면
  //      짧은 글은 굼뜨고 긴 글은 놓친다.
  function setTurnText(txt) {
    const el = document.getElementById('turn-text');
    if (!el) return;
    el.classList.remove('run');
    el.style.removeProperty('--shift');
    el.style.removeProperty('animation-duration');
    el.textContent = txt;
    //  레이아웃이 잡힌 뒤에 재야 넘치는지 알 수 있다
    requestAnimationFrame(() => {
      const box = el.parentElement;
      if (!box) return;
      const over = el.scrollWidth - box.clientWidth;
      if (over > 4) {
        el.style.setProperty('--shift', (-over - 8) + 'px');
        el.style.animationDuration = Math.max(4, (over + 8) / 28 + 3).toFixed(1) + 's';
        el.classList.add('run');
      }
    });
  }

  function updateStepUI(step) {
    if (!step) return;
    document.getElementById('turn-arrow').textContent = getStepArrow(step);
    setTurnText(getStepText(step));
    document.getElementById('turn-dist').textContent = '--';
    spokenDistBucket = null;   // 새 스텝 → 안내 버킷 초기화
    spokenBucketVal = null;
  }

  // ── 음성 안내 (TTS) ──
  function speak(text) {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 1.05;
      u.volume = 1;
      speechSynthesis.speak(u);
    } catch(e) {}
  }

  // 회전 동작을 음성용 문구로
  function getStepVoice(step) {
    const m = (step && step.maneuver) || {};
    const type = m.type, mod = m.modifier || '';
    if (type === 'arrive') return '목적지에 도착했습니다';
    if (type === 'depart') return '안내를 시작합니다';
    // ★ 자동차에만 나오는 것들 (TMAP 자동차 회전코드 101~116)
    if (type === 'ramp') {
      if (mod === 'left')  return '왼쪽 고속도로 입구로 진입하세요';
      if (mod === 'right') return '오른쪽 고속도로 입구로 진입하세요';
      return '고속도로로 진입하세요';
    }
    if (type === 'exit') {
      if (mod === 'left')  return '왼쪽 출구로 나가세요';
      if (mod === 'right') return '오른쪽 출구로 나가세요';
      return '출구로 나가세요';
    }
    if (mod === 'pturn') return 'P턴 하세요';
    if (mod === 'left') return '좌회전하세요';
    if (mod === 'right') return '우회전하세요';
    if (mod === 'slight left') return '좌측 방향입니다';
    if (mod === 'slight right') return '우측 방향입니다';
    if (mod === 'sharp left') return '왼쪽으로 크게 도세요';
    if (mod === 'sharp right') return '오른쪽으로 크게 도세요';
    if (mod === 'uturn') return '유턴하세요';
    return '직진하세요';
  }

  //  ══════════════════════════════════════════
  //   거리별 사전 안내 — 차와 걸음은 필요한 거리가 다르다
  //  ══════════════════════════════════════════
  //  ★★ 전에는 둘 다 200m / 50m / 즉시였다.
  //    시속 60km 면 200m 는 **12초**다. 차선을 바꿀 시간이 안 된다.
  //    티맵·네이버가 1km 부터 알려주는 이유가 이것이다.
  //  ★ 그리고 한 번 지나간 단계로 되돌아가지 않는다.
  //    전에는 신호등에서 GPS 가 앞뒤로 흔들리면
  //    "200미터 앞 좌회전" 이 다시 나왔다.
  let spokenBucketVal = null;

  function announceTurn(step, distKm) {
    if (!step) return;
    const m = distKm * 1000;
    const car = navProfile === 'driving';
    const marks = car ? [1000, 500, 300, 100, 40] : [200, 50, 20];

    let n = null;
    for (const mk of marks) if (m <= mk) n = mk;   // 가장 작은 해당 칸
    if (n == null) return;
    if (spokenBucketVal != null && n >= spokenBucketVal) return;  // 뒤로 안 간다
    spokenBucketVal = n;
    spokenDistBucket = String(n);

    const action = getStepVoice(step);
    const nowMark = car ? 40 : 20;
    if (n <= nowMark)        speak(action);
    else if (n >= 1000)      speak('1킬로미터 앞 ' + action);
    else                     speak(n + '미터 앞 ' + action);
  }

  function getStepText(step) {
    const m = (step && step.maneuver) || {};
    const type = m.type, mod = m.modifier || '', name = step.name || '';
    if (type === 'depart') return '출발';
    if (type === 'arrive') return '목적지 도착';
    if (type === 'ramp') return `고속도로 진입${name ? ' · '+name : ''}`;
    if (type === 'exit') return `출구${name ? ' · '+name : ''}`;
    if (mod === 'pturn') return 'P턴';
    if (mod === 'left') return `좌회전${name ? ' · '+name : ''}`;
    if (mod === 'right') return `우회전${name ? ' · '+name : ''}`;
    if (mod === 'slight left') return `좌측 방향${name ? ' · '+name : ''}`;
    if (mod === 'slight right') return `우측 방향${name ? ' · '+name : ''}`;
    if (mod === 'uturn') return 'U턴';
    return name || '직진';
  }
  function getStepArrow(step) {
    const m = (step && step.maneuver) || {};
    const type = m.type, mod = m.modifier || '';
    if (type === 'arrive') return '🏁';
    if (type === 'ramp')   return mod === 'left' ? '↰' : '↱';
    if (type === 'exit')   return mod === 'left' ? '↖' : '↗';
    if (mod === 'pturn')   return '↺';
    if (mod === 'left') return '←'; if (mod === 'right') return '→';
    if (mod === 'slight left') return '↖'; if (mod === 'slight right') return '↗';
    if (mod === 'uturn') return '↩';
    return '↑';
  }

  // ── 로딩 ──
  function showLoading(t) { document.getElementById('loading-text').textContent = t; document.getElementById('loading-overlay').classList.remove('hidden'); }
  function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

  // ── 유틸 ──
  function getDistanceKm(lat1, lng1, lat2, lng2) {
    const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // ── 키보드 ──
  document.addEventListener('keydown', e => {
    startCompass();   // 첫 조작에서 나침반 권한을 얻는다 (자동 호출은 막혀 있다)
    const active = document.querySelector('.screen.active')?.id;

    //  ★ 묻는 창이 떠 있으면 그것부터. 뒤에 있는 화면이 반응하면 안 된다.
    if (!document.getElementById('confirm-back').classList.contains('hidden')) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        confirmPick = e.key === 'ArrowRight' ? 1 : 0; paintConfirm();
      } else if (e.key === 'Enter') { doConfirm(); }
      else if (e.key === 'Escape') { closeConfirm(); }
      e.preventDefault();
      return;
    }

    if (active === 'screen-home') {
      //  ★★ "네 번 내려갔다가 올라오려면 또 네 번" — 말이 안 되는 조작이었다.
      //    끝에서 멈추지 말고 반대편으로 넘어가게 한다.
      //    맨 아래에서 ↓ 하면 맨 위로, 맨 위에서 ↑ 하면 맨 아래로.
      //    ※ 목록이 길수록 되돌아오는 길이 짧아야 한다.
      if (e.key === 'ArrowDown') {
        const n = homeFocusables.length;
        focusHome(n ? (focusIndex + 1) % n : 0); e.preventDefault();
      }
      else if (e.key === 'ArrowUp') {
        const n = homeFocusables.length;
        focusHome(n ? (focusIndex - 1 + n) % n : 0); e.preventDefault();
      }
      //  ★ → 하나로 담고 지운다.
      //    담은 것이면 지울지 묻고, 아니면 담는다. 최근이든 기본이든 같다.
      //    ※ 조작이 자리마다 다르면 외울 게 늘어난다. 뜻이 같으면 키도 같아야 한다.
      //  ★ 탭 줄에 커서가 있으면 ←→ 는 나라 바꾸기다.
      //    담을 것도 지울 것도 없는 자리라 뜻이 겹치지 않는다.
      //    ※ 아래 두 가지(담기·최근 지우기)보다 **먼저** 걸러야 한다.
      //      순서가 뒤바뀌면 탭에서 → 를 눌렀을 때 엉뚱한 것이 담긴다.
      else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft')
               && homeFocusables[focusIndex]
               && homeFocusables[focusIndex].id === 'fav-tabs') {
        favTab = (e.key === 'ArrowRight') ? 'cn' : 'kr';
        buildHome();
        //  ※ 다시 그린 뒤 커서를 탭 줄에 그대로 둔다. 목록 길이가 바뀌어
        //    번호로 되찾으면 딴 데로 튄다. 무엇인지로 찾는다.
        const back = homeFocusables.findIndex(x => x && x.id === 'fav-tabs');
        focusHome(back >= 0 ? back : focusIndex);
        e.preventDefault();
      }
      else if (e.key === 'ArrowRight') {
        const el = homeFocusables[focusIndex];
        if (el && el.dataset && el.dataset.dest) {
          if (el.dataset.mine === '1') {
            askRemove(el.dataset.name, 'fav');
          } else {
            let d = null;
            try { d = JSON.parse(el.dataset.dest); } catch (err) {}
            if (d) {
              addFav(d);
              buildHome();
              const idx = homeFocusables.findIndex(x => x.dataset && x.dataset.name === d.name);
              focusHome(idx >= 0 ? idx : focusIndex);
            }
          }
        }
        e.preventDefault();
      }
      //  ★ ← 는 최근 목록에서 지우기. 한 키에 한 가지 뜻만 준다.
      //      → 즐겨찾기 담기/지우기 · ← 최근 목록에서 지우기
      else if (e.key === 'ArrowLeft') {
        const el = homeFocusables[focusIndex];
        if (el && el.dataset && el.dataset.recent === '1') {
          askRemove(el.dataset.name, 'recent');
        }
        e.preventDefault();
      }
      else if (e.key === 'Enter') {
        //  ★ 전에는 여기서 setProfile 을 직접 부르고, 버튼에는 click 처리기도
        //    따로 달려 있었다. **같은 일을 두 갈래로** 하고 있었던 것이다.
        //    focusIndex 와 실제 DOM 포커스가 어긋나면 서로 다른 모드를 눌러
        //    결과가 오락가락한다.
        //  ※ 길이 하나면 어긋날 수가 없다. 클릭 한 갈래로 모은다.
        if (homeFocusables[focusIndex]) homeFocusables[focusIndex].click();
        e.preventDefault();
      }
    }

    if (active === 'screen-search-input') {
      const items = document.querySelectorAll('.search-result-item');
      if (e.key === 'ArrowDown') { focusSearchResult(Math.min(searchFocusIndex+1, items.length-1)); e.preventDefault(); }
      else if (e.key === 'ArrowUp') {
        if (searchFocusIndex === 0) document.getElementById('search-input').focus();
        else focusSearchResult(searchFocusIndex-1);
        e.preventDefault();
      }
      else if (e.key === 'Enter' && searchResults[searchFocusIndex]) {
        selectSearchResult(searchResults[searchFocusIndex]); e.preventDefault();
      }
      //  ★ → 로 즐겨찾기에 담는다. 담는 건 되돌리기 쉬우니 확인을 묻지 않는다.
      //    (지울 때는 두 번 눌러야 한다 — 그건 되돌릴 길이 없으니까)
      else if (e.key === 'ArrowRight' && searchResults[searchFocusIndex]) {
        const d = searchResults[searchFocusIndex];
        addFav(d);
        const el = document.getElementById('search-status');
        el.className = 'search-empty';
        el.textContent = `★ ${d.name} — 즐겨찾기에 담았습니다`;
        e.preventDefault();
      }
      else if (e.key === 'Escape') { closeSearch(); e.preventDefault(); }
    }

    if (active === 'screen-nav') {
      if (e.key === 'Escape' || e.key === 'ArrowLeft') { stopNav(); showScreen('screen-home'); focusHome(focusIndex); e.preventDefault(); }
      // ★ 안경에는 키보드가 없다. 방향키와 Enter 만 들어온다.
      //   전에는 줌이 +/- 에 걸려 있어서 안경에서는 아예 못 썼다.
      //   걸을 때 시점보다 줌이 훨씬 자주 필요하므로 위/아래를 줌에 준다.
      else if (e.key === 'ArrowUp')   { zoomIn();  e.preventDefault(); }
      else if (e.key === 'ArrowDown') { zoomOut(); e.preventDefault(); }
      // 시점 전환(위에서 보기 ↔ 비스듬히)은 핀치로
      else if (e.key === 'Enter') {
        pitchTarget = pitchTarget > 0.5 ? 0 : 1;
        e.preventDefault();
      }
      else if (e.key === '+' || e.key === '=') { zoomIn(); e.preventDefault(); }
      else if (e.key === '-') { zoomOut(); e.preventDefault(); }
      // 음성 안내 on/off
      else if (e.key === 'ArrowRight') {
        voiceOn = !voiceOn;
        if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
        setTurnText(voiceOn ? '🔊 음성 안내 켜짐' : '🔇 음성 안내 꺼짐');
        if (voiceOn) speak('음성 안내를 켭니다');
        setTimeout(() => {
          if (routeSteps[currentStepIndex]) updateStepUI(routeSteps[currentStepIndex]);
        }, 1500);
        e.preventDefault();
      }
    }
  });

  // ── 검색 화면 ──
  function openSearch() {
    showScreen('screen-search-input');
    setTimeout(() => document.getElementById('search-input').focus(), 50);
  }
  function closeSearch() {
    //  ★★ 여기서 목록을 다시 만들지 않아서, 검색 화면에서 담은 즐겨찾기가
    //    홈에 안 나왔다. 화면만 바꾸고 내용은 예전 것 그대로였던 것이다.
    //  ※ 화면을 되돌릴 때는 그 사이 바뀐 것이 있는지 생각한다.
    showScreen('screen-home');
    buildHome();
    focusHome(0);
  }

  //  ★ 지금 서 있는 자리를 담는다.
  //    이름은 좌표를 되짚어(역지오코딩) 주소로 만든다 —
  //    '현재 위치 3' 같은 이름은 나중에 어디였는지 알 수가 없다.
  //  ※ 되짚기에 실패해도 담는 것 자체는 성공시킨다. 이름만 좌표가 된다.
  //    이름을 못 얻었다고 저장을 포기하면 정작 필요한 걸 잃는다.
  async function reverseName(lat, lng) {
    try {
      if (currentCountry() === 'cn') {
        const g = wgs84ToGcj02(lat, lng);
        const d = await jsonp(`https://apis.map.qq.com/ws/geocoder/v1/?location=${g.lat},${g.lng}&key=${TENCENT_KEY}`);
        if (d.status === 0 && d.result) {
          const f = d.result.formatted_addresses || {};
          return { name: f.recommend || d.result.address || '', addr: d.result.address || '' };
        }
      } else {
        const u = 'https://apis.openapi.sk.com/tmap/geo/reversegeocoding?version=1&format=json'
                + `&coordType=WGS84GEO&addressType=A10&lat=${lat}&lon=${lng}`;
        const r = await fetch(u, { headers: { appKey: TMAP_KEY } });
        const t = await r.text();
        if (r.ok && t.trim()) {
          const d = JSON.parse(t);
          const a = d.addressInfo || {};
          const road = [a.city_do, a.gu_gun, a.roadName, a.buildingIndex].filter(Boolean).join(' ');
          return { name: a.buildingName || road || '', addr: a.fullAddress || road || '' };
        }
      }
    } catch (e) {}
    return null;
  }

  //  ══════════════════════════════════════════
  //   지울지 묻는 창
  //  ══════════════════════════════════════════
  //  ★ 되돌릴 수 없는 일은 반드시 한 번 묻는다.
  //    처음엔 '→ 두 번 누르기' 로 했는데, 무엇을 지우는지 안 보이고
  //    실수로 두 번 눌릴 수도 있다. 이름을 보여주고 명확히 고르게 한다.
  //  ※ 기본 선택은 '취소' 다. 잘못 눌렀을 때 아무 일도 안 일어나는 쪽이 기본이어야 한다.
  let confirmTarget = null;
  let confirmKind = 'fav';                // 'fav' = 즐겨찾기, 'recent' = 최근 목록
  let confirmPick = 0;                    // 0 = 취소, 1 = 지우기

  function paintConfirm() {
    const no = document.getElementById('confirm-no');
    const yes = document.getElementById('confirm-yes');
    no.classList.toggle('focused', confirmPick === 0);
    yes.classList.toggle('focused', confirmPick === 1);
    (confirmPick === 0 ? no : yes).focus();
  }
  function askRemove(name, kind) {
    confirmTarget = name;
    confirmKind = kind;
    confirmPick = 0;
    const where = kind === 'recent' ? '최근 목록' : '즐겨찾기';
    document.getElementById('confirm-msg').textContent = `${name}\n${where}에서 지울까요?`;
    document.getElementById('confirm-msg').style.whiteSpace = 'pre-line';
    document.getElementById('confirm-back').classList.remove('hidden');
    paintConfirm();
  }
  function closeConfirm() {
    confirmTarget = null;
    document.getElementById('confirm-back').classList.add('hidden');
    focusHome(Math.min(focusIndex, homeFocusables.length - 1));
  }
  function doConfirm() {
    if (confirmPick === 1 && confirmTarget) {
      if (confirmKind === 'recent') removeRecent(confirmTarget);
      else removeFav(confirmTarget);
      const keep = focusIndex;
      confirmTarget = null;
      document.getElementById('confirm-back').classList.add('hidden');
      buildHome();
      focusHome(Math.min(keep, homeFocusables.length - 1));
      return;
    }
    closeConfirm();
  }

  async function saveHereAsFav() {
    const box = document.getElementById('here-box');
    const label = box && box.querySelector('.label');
    if (!currentPos) {
      if (label) label.innerHTML = '현재 위치 <span style="color:#ffd27a">· 위치를 아직 못 잡았습니다</span>';
      return;
    }
    const got = await reverseName(currentPos.lat, currentPos.lng);
    const stamp = new Date().toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const name = (got && got.name) ? got.name : `현재 위치 ${stamp}`;
    addFav({ name, addr: (got && got.addr) || `${currentPos.lat.toFixed(5)}, ${currentPos.lng.toFixed(5)}`,
             lat: currentPos.lat, lng: currentPos.lng });
    buildHome();
    focusHome(0);
    const b2 = document.getElementById('here-box');
    const l2 = b2 && b2.querySelector('.label');
    if (l2) {
      l2.innerHTML = `현재 위치 <span style="color:#8dffab">· ★ ${name} 담았습니다</span>`;
      setTimeout(() => {
        const l3 = document.getElementById('here-box');
        if (l3) l3.querySelector('.label').innerHTML = '현재 위치 <span style="color:#7dd8ff">· Enter 로 즐겨찾기</span>';
      }, 2500);
    }
  }
  document.getElementById('here-box').addEventListener('click', saveHereAsFav);

  document.getElementById('search-back-btn').addEventListener('click', closeSearch);
  document.getElementById('back-btn').addEventListener('click', () => { stopNav(); showScreen('screen-home'); buildHome(); focusHome(0); });

  // ══════════════════════════════════════════
  //  폰에서 보낸 목적지 받기
  //  · 앱이 켜질 때 한 번 확인하고, 대기 중에는 5초마다 다시 본다.
  //  · 안내 중에는 확인하지 않는다 (경로가 중간에 바뀌면 곤란하다).
  //  · 같은 목적지를 두 번 시작하지 않도록 보낸 시각으로 구분한다.
  // ══════════════════════════════════════════
  let lastDestAt = 0;
  try { lastDestAt = parseInt(localStorage.getItem('navi.destAt')) || 0; } catch (e) {}

  function checkRelay() {
    // ★ 안내 중에도 새 목적지가 오면 바로 그리로 바꾼다.
    //   전에는 홈 화면일 때만 봤다. 그러면 안내가 한 번 시작된 뒤로는
    //   폰에서 공유해도 안경이 통째로 무시했다 — 목적지를 바꾸려면
    //   왼쪽 스와이프로 홈에 나갔다 와야 했다.
    //   목적지를 보내는 것 자체가 "여기로 가겠다" 는 뜻이므로 바로 따른다.
    //
    //   다만 검색 화면에서는 건드리지 않는다. 사용자가 지금 직접
    //   고르는 중인데 화면이 튀면 곤란하다.
    const search = document.getElementById('screen-search-input');
    if (search && search.classList.contains('active')) return;

    getJson(DEST_RELAY + '/dest', { cache: 'no-store' })
      .then(d => {
        const dest = d && d.dest;
        if (!dest || !dest.at || dest.at <= lastDestAt) return;
        lastDestAt = dest.at;
        try { localStorage.setItem('navi.destAt', String(dest.at)); } catch (e) {}
        startNav({
          name: dest.name || '목적지',
          addr: dest.addr || '',
          lat: dest.lat, lng: dest.lng,
          icon: '📲',
        });
      })
      .catch(() => {});   // 릴레이가 없어도 앱은 평소대로 동작해야 한다
  }

  // ── 시작 ──
  seedFavsOnce();
  buildHome();
  getLocation();
  startCompass();

  // ★ 안내 중에 앱이 닫혔다면 그대로 이어간다.
  //   30분이 지났으면 이어가지 않는다 — 그때는 이미 다른 곳에 있을 것이다.
  //   ※ 위치를 먼저 잡아야 경로를 계산할 수 있어서 조금 기다린다.
  (function resumeNav() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('navi.active') || 'null'); } catch (e) {}
    if (!saved || !saved.dest || !saved.at) return;
    if (Date.now() - saved.at > 30 * 60 * 1000) {
      try { localStorage.removeItem('navi.active'); } catch (e) {}
      return;
    }
    let waited = 0;
    const t = setInterval(() => {
      waited += 300;
      if (currentPos) { clearInterval(t); startNav(saved.dest); }
      else if (waited >= 9000) { clearInterval(t); startNav(saved.dest); }  // 위치가 늦어도 시도한다
    }, 300);
  })();

  checkRelay();
  setInterval(checkRelay, 5000);
</script>
</body>
</html>
