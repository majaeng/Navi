  // ── 인라인 MVT 파서 (Protocol Buffer, 외부 라이브러리 없음) ──
  function parseMVT(buffer) {
    const buf = new Uint8Array(buffer);
    const dec = new TextDecoder();

    function varint(p) {
      let shift = 0, val = 0, b;
      do { b = buf[p++]; val += (b & 0x7f) * (2 ** shift); shift += 7; } while (b & 0x80);
      return { val, pos: p };
    }
    function packedU32(s, e) {
      const a = []; let p = s;
      while (p < e) { const r = varint(p); a.push(r.val); p = r.pos; }
      return a;
    }
    function zz(n) { return (n >>> 1) ^ -(n & 1); }

    function decodeGeom(ints) {
      const rings = []; let ring, x = 0, y = 0, i = 0;
      while (i < ints.length) {
        const cl = ints[i++], cmd = cl & 7, cnt = cl >> 3;
        if (cmd === 1) {
          for (let j = 0; j < cnt; j++) {
            x += zz(ints[i++]); y += zz(ints[i++]);
            ring = [{x, y}]; rings.push(ring);
          }
        } else if (cmd === 2) {
          for (let j = 0; j < cnt; j++) {
            x += zz(ints[i++]); y += zz(ints[i++]);
            ring && ring.push({x, y});
          }
        }
        // cmd 7 = ClosePath, params 없음
      }
      return rings;
    }

    function layerVal(s, e) {
      let p = s, v = null;
      while (p < e) {
        const r = varint(p); p = r.pos;
        const fn = r.val >> 3, wt = r.val & 7;
        const dv = new DataView(buf.buffer);
        if (wt === 2) { const l = varint(p); p = l.pos; if (fn===1) v = dec.decode(buf.slice(p, p+l.val)); p += l.val; }
        else if (wt === 0) { const l = varint(p); p = l.pos; if (fn===6) v = zz(l.val); else if (fn===4||fn===5) v = l.val; else if (fn===7) v = !!l.val; }
        else if (wt === 5) { if (fn===2) v = dv.getFloat32(p,true); p+=4; }
        else if (wt === 1) { if (fn===3) v = dv.getFloat64(p,true); p+=8; }
      }
      return v;
    }

    function readLayer(s, e) {
      let p = s, name = '';
      const keys = [], vals = [], rawFeats = [];
      while (p < e) {
        const r = varint(p); p = r.pos;
        const fn = r.val >> 3, wt = r.val & 7;
        if (wt === 0) { const l = varint(p); p = l.pos; } // extent 등 무시해도 됨 (기본 4096)
        else if (wt === 2) {
          const l = varint(p); p = l.pos;
          const ds = p, de = p + l.val; p = de;
          if (fn===1) name = dec.decode(buf.slice(ds, de));
          else if (fn===3) keys.push(dec.decode(buf.slice(ds, de)));
          else if (fn===4) vals.push(layerVal(ds, de));
          else if (fn===2) rawFeats.push([ds, de]);
        } else if (wt===1) p+=8; else if (wt===5) p+=4;
      }
      const features = rawFeats.map(([fs, fe]) => {
        let fp = fs, type = 0, tags = [], geomInts = [];
        while (fp < fe) {
          const r = varint(fp); fp = r.pos;
          const fn = r.val >> 3, wt = r.val & 7;
          if (wt===0) { const l = varint(fp); fp = l.pos; if (fn===3) type = l.val; }
          else if (wt===2) { const l = varint(fp); fp = l.pos; if (fn===2) tags = packedU32(fp, fp+l.val); else if (fn===4) geomInts = packedU32(fp, fp+l.val); fp += l.val; }
          else if (wt===1) fp+=8; else if (wt===5) fp+=4;
        }
        if (type !== 2) return null; // LineString만 (도로)
        const props = {};
        for (let i = 0; i < tags.length-1; i+=2) props[keys[tags[i]]] = vals[tags[i+1]];
        return { props, geom: decodeGeom(geomInts) };
      }).filter(Boolean);
      return { name, features };
    }

    const layers = {}; let pos = 0;
    while (pos < buf.length) {
      const r = varint(pos); pos = r.pos;
      const fn = r.val >> 3, wt = r.val & 7;
      if (wt===2) { const l = varint(pos); pos = l.pos; const e = pos + l.val; if (fn===3) { const lay = readLayer(pos, e); if (lay.name) layers[lay.name] = lay; } pos = e; }
      else if (wt===0) { const l = varint(pos); pos = l.pos; }
      else if (wt===1) pos+=8; else if (wt===5) pos+=4;
    }
    return layers;
  }

  // ── 벡터 타일 로드 ──
  async function loadVectorTile(z, tx, ty) {
    const key = `${z}/${tx}/${ty}`;
    if (key in vtCache || vtLoading.has(key)) return;
    vtLoading.add(key);
    try {
      const url = `https://api.mapbox.com/v4/mapbox.mapbox-streets-v8/${z}/${tx}/${ty}.mvt?access_token=${MAPBOX_TOKEN}`;
      const resp = await fetch(url);
      if (!resp.ok) throw 0;
      const layers = parseMVT(await resp.arrayBuffer());
      vtCache[key] = (layers['road'] || { features: [] }).features;
    } catch { vtCache[key] = []; }
    vtLoading.delete(key);
  }

  // ── 도로 벡터선 그리기 ──
  //  ══════════════════════════════════════════
  //   도로 이름
  //  ══════════════════════════════════════════
  //  ★ 왜 넣나: 가시성을 위해 선을 확 줄였다. 줄인 만큼
  //    "어느 길인가" 가 안 보인다. 선으로 못 주는 정보를 **이름으로 준다.**
  //    Meta 자체 내비도 선을 줄이고 이름을 남기는 쪽이다.
  //
  //  ※ 선을 따라 휘어지게 쓰지 않는다. 지도가 진행 방향으로 돌아가므로
  //    휜 글자는 뒤집히거나 거꾸로 선다. **항상 수평**으로 쓴다 —
  //    흘깃 보는 화면에서 읽는 데 드는 시간이 가장 짧다.
  //
  //  ※ 같은 이름을 여러 번 쓰지 않고, 겹치면 나중 것을 버린다.
  //    글자가 겹치면 더하기 화면에서는 밝기가 더해져 **아무것도 못 읽는다.**
  let roadLabels = [];      // {name, x, y, prio}
  const LABEL_FONT = '700 19px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif';

  function flushRoadLabels() {
    if (!roadLabels.length) return;
    ctx.save();
    ctx.font = LABEL_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    //  큰길 먼저 자리를 잡는다 (prio 낮을수록 큰길)
    roadLabels.sort((a, b) => a.prio - b.prio);
    const placed = [];
    const seen = new Set();
    for (const L of roadLabels) {
      if (seen.has(L.name)) continue;                 // 같은 이름은 한 번만
      const w = ctx.measureText(L.name).width + 10;
      const h = 24;
      const box = { x1: L.x - w/2, y1: L.y - h/2, x2: L.x + w/2, y2: L.y + h/2 };
      if (box.x1 < 4 || box.x2 > 596 || box.y1 < ROAD_TOP_CUT || box.y2 > 596) continue;
      let hit = false;
      for (const q of placed) {
        if (box.x1 < q.x2 && box.x2 > q.x1 && box.y1 < q.y2 && box.y2 > q.y1) { hit = true; break; }
      }
      if (hit) continue;
      placed.push(box);
      seen.add(L.name);
      //  ★ 검은 외곽선을 못 쓴다 (더하기 화면에서 검정 = 투명).
      //    대신 글자 아래에 도로선을 지우듯 어둡게 깔 수도 없다.
      //    그래서 순백 + 굵은 획으로만 승부한다. 그게 가장 밝다.
      ctx.fillStyle = '#ffffff';
      ctx.fillText(L.name, L.x, L.y);
      if (placed.length >= 7) break;   // 너무 많으면 화면이 다시 시끄러워진다
    }
    ctx.restore();
    roadLabels = [];
  }

  function drawRoads(cx, cy) {
    const z = tileZ();
    roadLabels = [];
    const EXTENT = 4096;
    const tilesNeeded = Math.ceil(300 / TILE_SIZE) + 1;

    for (let tx = Math.floor(cx) - tilesNeeded; tx <= Math.floor(cx) + tilesNeeded; tx++) {
      for (let ty = Math.floor(cy) - tilesNeeded; ty <= Math.floor(cy) + tilesNeeded; ty++) {
        const key = `${z}/${tx}/${ty}`;
        if (!(key in vtCache)) { loadVectorTile(z, tx, ty); continue; }
        const roads = vtCache[key];
        if (!roads.length) continue;

        // ══════════════════════════════════════════
        //  ★★ 여기를 통째로 갈아엎었다 (2026-08-27). 왜인지 적어둔다.
        // ══════════════════════════════════════════
        //
        //  실차 주행에서 "지도가 안 보인다" 가 나왔다. 원인을 재보니 셋이었다.
        //
        //  ① 반투명을 썼다 — 이게 가장 컸다.
        //     안경은 **더하기 화면**이다. 검정을 못 그린다. 화면 밝기가
        //     바깥 풍경 밝기에 그대로 **더해질 뿐**이다.
        //     즉 대비를 만드는 수단이 밝기 하나뿐인데,
        //     알파 0.5 = 약 2,500 nit 이다.
        //     낮 도심 배경은 아스팔트 1,000~3,000 · 콘크리트 5,000~9,000 ·
        //     하늘 6,000~10,000 nit 이다.
        //     → 밝은 노면이나 하늘에 겹치는 순간 도로선이 **배경보다 어두워진다.**
        //       안 보이는 게 아니라 없는 것과 같다.
        //     ※ 더하기 화면에서 알파는 '연하게' 가 아니라 '지우기' 다.
        //       그릴 것은 1.0 으로 그리고, 아닌 것은 아예 안 그린다.
        //       중간이 제일 나쁘다.
        //
        //  ② 선이 눈의 한계보다 얇았다.
        //     42 PPD 이므로 1px = 1.43분각이다.
        //     옛 중심선 1.6~3.2px = 2.3~4.6분각.
        //     높은 대비에서야 1분각도 갈리지만, **낮은 대비에서는 5~10분각**은
        //     있어야 한다. 도광판 자체 번짐까지 더하면 더 그렇다.
        //     → 옛 도로선은 전부 그 아래에 있었다.
        //
        //  ③ 그릴 게 너무 많았다.
        //     Mapbox 의 도로를 거의 다 그렸다 — 골목·보행로까지.
        //     화면은 600×600 이고 시야는 **고작 20°** 다.
        //     반투명 흰 선 수십 개가 겹치면 더하기 화면에서는 밝기가 서로
        //     더해져 흰 그물이 된다. 경로선이 안 보인 게 아니라
        //     **배경이 너무 시끄러웠다.**
        //
        //  ★ 그래서 이렇게 바꿨다:
        //    · 알파를 없앤다 (가장 흐린 것도 0.85 = 약 4,250 nit)
        //    · 두 겹(면+심) 을 한 겹 굵은 선으로 — 겹칠수록 번지기만 했다
        //    · 등급을 다섯에서 **둘**로 줄이고, 골목·보행로는 아예 뺀다
        //    · 가장 얇은 선도 7px(10분각) 아래로 내려가지 않게
        //
        //  ※ 도보/드라이브를 **구분하지 않는다.** 눈과 화면은 같은 것이므로
        //    잘 보이는 그림도 하나여야 한다. 모드로 갈리면 한쪽은 반드시 못 쓴다.
        for (const { props, geom } of roads) {
          const cls = props.class || '';
          const z = tileZ();

          //  ══════════════════════════════════════════
          //   ★★ 처음엔 보행로·골목을 통째로 뺐다. 그건 틀렸다.
          //  ══════════════════════════════════════════
          //   "보행로를 안 그리면 걷기 모드에서 뭘 보냐" — 맞는 지적이었다.
          //   흰 그물이 된 진짜 원인은 '보행로가 있어서' 가 아니라
          //   **모든 걸 화면 끝까지 흐리게 그려서** 였다.
          //   등급으로 자를 게 아니라 **거리로** 잘랐어야 했다.
          //
          //   ★ 가까운 곳은 다 그리고, 먼 곳은 큰길만 그린다.
          //     걸을 때 필요한 보행로는 발밑 100m 다.
          //     200m 앞 골목은 걸을 때도 안 본다 —
          //     그런데 그게 화면 위쪽에서 겹쳐 쌓여 다 뭉갰다.
          //
          //   ※ 모드로 가르지 않는다. 차로 가면 100m 를 6초에 지나가니
          //     알아서 흘러가고, 걸으면 그 자리에 오래 남는다.
          //     **같은 규칙인데 속도가 알아서 다르게 만든다.**
          //     모드로 갈라놓으면 한쪽은 반드시 손이 덜 간 채로 남는다.
          let lw, alpha, nearOnly = false;
          if (['motorway','trunk','primary','secondary'].includes(cls)) {
            lw = 11; alpha = 1.0;                    // 큰길 — 화면 끝까지
          } else if (['tertiary','street','street_limited'].includes(cls)) {
            lw = 7;  alpha = 0.85;                   // 동네길 — 화면 끝까지
          } else if (['service','alley'].includes(cls)) {
            if (z < 17) continue;
            lw = 6;  alpha = 0.85;  nearOnly = true; // 골목 — 내 주변만
          } else if (['path','footway','pedestrian','steps','track'].includes(cls)) {
            if (z < 17) continue;
            //  ★ 보행로는 걸을 때 **가장 중요한 선**이다. 다만 발밑만.
            //    굵기로 큰길과 구분한다 — 밝기로 구분하면 흐려져서 안 보인다.
            lw = 5;  alpha = 0.85;  nearOnly = true;
          } else {
            continue;                                // 그 밖(철길·페리 등)은 뺀다
          }

          ctx.beginPath();
          ctx.lineJoin = 'round'; ctx.lineCap = 'round';
          const pts = [];          // 화면에 실제로 그려진 점들 (이름 자리 잡기용)
          for (const ring of geom) {
            let first = true;
            for (const {x, y} of ring) {
              const fx = (tx + x / EXTENT - cx) * TILE_SIZE + POS_X;
              const fy = (ty + y / EXTENT - cy) * TILE_SIZE + POS_Y;
              //  ★ 거리는 **기울이기 전** 좌표로 잰다.
              //    기울인 뒤 좌표는 앞쪽이 압축돼 있어 거리가 실제와 다르다.
              if (nearOnly) {
                const ddx = fx - POS_X, ddy = fy - POS_Y;
                if (ddx*ddx + ddy*ddy > NEAR_R2) { first = true; continue; }
              }
              const p = proj(fx, fy);
              if (!p.ok) { first = true; continue; }   // 지평선 너머는 끊기
              //  ★ 화면 위쪽 띠는 기울이기 때문에 도로가 몇 px 안에 겹쳐 쌓인다.
              //    더하기 화면에서 겹치면 밝기가 더해져 **흰 덩어리**가 된다.
              //    쿼터뷰는 그대로 두되, 그 뭉개지는 띠에는 아무것도 안 그린다.
              //    비어 있는 게 뭉개진 것보다 낫다.
              if (p.y < ROAD_TOP_CUT) { first = true; continue; }
              first ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
              first = false;
              pts.push(p);
            }
          }
          //  한 겹으로만 칠한다 — 두 겹은 번짐만 키웠다
          ctx.strokeStyle = alpha >= 1 ? '#ffffff' : `rgba(255,255,255,${alpha})`;
          ctx.lineWidth = lw;
          ctx.stroke();

          //  ★ 이름 후보를 모아둔다. 여기서 바로 쓰면 뒤에 그려지는 도로가
          //    글자 위를 덮는다. 도로를 다 그린 뒤 한꺼번에 얹는다.
          //  ※ 골목·보행로 이름은 안 쓴다 — 화면이 다시 시끄러워진다.
          const nm = props.name_ko || props.name || '';
          if (nm && !nearOnly && nm.length <= 12 && pts.length) {
            const mid = pts[Math.floor(pts.length / 2)];
            roadLabels.push({ name: nm, x: mid.x, y: mid.y, prio: lw >= 11 ? 0 : 1 });
          }
        }
      }
    }
    flushRoadLabels();
  }

  // ── 화면 전환 ──
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ── GPS ──
  function getLocation() {
    if (!navigator.geolocation) { fallbackPos(); return; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const country = currentCountry();
        const flag = country === 'cn' ? '🇨🇳' : '🇰🇷';
        document.getElementById('current-location').textContent =
          `${flag} ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
        buildHome(); // 나라 바뀌면 프리셋 갱신
      },
      () => fallbackPos(),
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }
  function fallbackPos() {
    // 캐시된 마지막 위치 우선 사용
    try {
      const cached = JSON.parse(localStorage.getItem('ko_navi_last_pos') || 'null');
      if (cached) {
        currentPos = cached;
        document.getElementById('current-location').textContent = `📍 마지막 위치 (${cached.lat.toFixed(4)}, ${cached.lng.toFixed(4)})`;
        buildHome();
        return;
      }
    } catch {}
    currentPos = { lat: 37.5665, lng: 126.9780 };
    document.getElementById('current-location').textContent = '🇰🇷 서울시청 (기본값)';
  }

  // ── 홈 ──
  function buildHome() {
    const PRESETS = currentCountry() === 'cn' ? CN_PRESETS : KR_PRESETS;

    // 최근 목적지
    const recents = loadRecentDests();
    const recentSection = document.getElementById('recent-section');
    const recentList = document.getElementById('recent-list');
    recentList.innerHTML = '';
    if (recents.length > 0) {
      recentSection.style.display = 'block';
      recents.forEach(dest => {
        const el = document.createElement('div');
        el.className = 'dest-item focusable';
        el.tabIndex = 0;
        el.innerHTML = `<span class="icon">🕐</span><div><div class="name">${dest.name}</div><div class="addr" style="font-size:16px;color:#b8c8d8">${dest.addr}</div></div>`;
        el.addEventListener('click', () => startNav(dest));
        recentList.appendChild(el);
      });
    } else {
      recentSection.style.display = 'none';
    }

    // 프리셋
    const list = document.getElementById('dest-list');
    list.innerHTML = '';
    PRESETS.forEach((dest) => {
      const el = document.createElement('div');
      el.className = 'dest-item focusable';
      el.tabIndex = 0;
      el.innerHTML = `<span class="icon">${dest.icon}</span><div><div class="name">${dest.name}</div><div class="addr">${dest.addr}</div></div>`;
      el.addEventListener('click', () => startNav(dest));
      list.appendChild(el);
    });

    homeFocusables = [
      document.getElementById('search-open-btn'),
      document.getElementById('btn-foot'),
      document.getElementById('btn-drive'),
      ...document.querySelectorAll('#recent-list .dest-item'),
      ...document.querySelectorAll('#dest-list .dest-item')
    ];
    focusHome(0);
  }

  function focusHome(idx) {
    homeFocusables.forEach(el => el.classList.remove('focused'));
    if (homeFocusables[idx]) {
      homeFocusables[idx].classList.add('focused');
      homeFocusables[idx].focus();
      focusIndex = idx;
    }
  }

  // ※ 카카오 SDK 로더는 걷어냈다 — 검색을 워커(TMAP)로 옮겼다.

  let searchTimer = null;
  document.getElementById('search-input').addEventListener('input', e => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    const status = document.getElementById('search-status');
    if (!q) {
      status.className = 'search-empty'; status.textContent = '검색어를 입력하세요';
      status.style.display = 'block';
      document.getElementById('search-results').innerHTML = '';
      return;
    }
    status.className = 'search-loading'; status.textContent = '검색 중...';
    status.style.display = 'block';
    searchTimer = setTimeout(() => doSearch(q), 500);
  });

  // ── 중국 좌표계 변환 ──
  //  중국은 GPS 좌표(WGS-84)를 그대로 쓰지 않고 의도적으로 틀어놓은
  //  GCJ-02를 쓴다. 변환하지 않으면 300~500m 어긋난다.
  function gcjDelta(lat, lng) {
    const a = 6378245.0, ee = 0.00669342162296594323;
    function tLat(x, y) {
      let r = -100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
      r += (20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
      r += (20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
      r += (160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
      return r;
    }
    function tLng(x, y) {
      let r = 300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
      r += (20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
      r += (20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
      r += (150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
      return r;
    }
    const radlat = lat/180*Math.PI;
    let magic = Math.sin(radlat);
    magic = 1 - ee*magic*magic;
    const sq = Math.sqrt(magic);
    const dLat = (tLat(lng-105, lat-35)*180) / ((a*(1-ee))/(magic*sq)*Math.PI);
    const dLng = (tLng(lng-105, lat-35)*180) / (a/sq*Math.cos(radlat)*Math.PI);
    return { dLat, dLng };
  }
  function gcj02ToWgs84(lat, lng) {   // 텐센트 결과 → GPS 좌표
    const d = gcjDelta(lat, lng);
    return { lat: lat - d.dLat, lng: lng - d.dLng };
  }
  function wgs84ToGcj02(lat, lng) {   // GPS 좌표 → 텐센트 요청용
    const d = gcjDelta(lat, lng);
    return { lat: lat + d.dLat, lng: lng + d.dLng };
  }

  // ── JSONP 헬퍼 (텐센트 API CORS 우회) ──
  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = '_tmap_' + (jsonp.n = (jsonp.n || 0) + 1) + '_' + Date.now();
      window[cb] = data => { delete window[cb]; document.head.removeChild(s); resolve(data); };
      const s = document.createElement('script');
      s.src = url + `&output=jsonp&callback=${cb}`;
      s.onerror = () => { delete window[cb]; reject(); };
      document.head.appendChild(s);
    });
  }

  function doSearch(q) {
    if (currentCountry() === 'cn') {
      doTencentSearch(q);
    } else {
      doKoreaSearch(q);
    }
  }

  //  국내 장소검색 — 릴레이 워커의 /poi 를 부른다 (TMAP)
  //  ★ 전에는 카카오 JS SDK 를 안경 화면에서 직접 불렀다.
  //    카카오는 등록된 도메인에서만 동작해서 새 주소에서 막혔고,
  //    실패 처리가 없어 '검색 중' 인 채로 멈췄다.
  //    워커를 거치면 도메인 제한도 CORS 도 없고, 키도 화면에서 사라진다.
  //    경로 계산이 TMAP 이니 검색도 같은 지도를 쓰는 편이 결과가 맞는다.
  function doKoreaSearch(q) {
    const el = document.getElementById('search-status');
    let u = DEST_RELAY + '/poi?q=' + encodeURIComponent(q);
    if (currentPos) u += `&lat=${currentPos.lat}&lng=${currentPos.lng}`;

    fetch(u, { cache: 'no-store' })
      .then(r => r.json())
      .then(d => {
        if (!d.ok) throw new Error(d.error || '검색 실패');
        if (!d.places || !d.places.length) {
          el.className = 'search-empty';
          el.textContent = '검색 결과가 없습니다';
          document.getElementById('search-results').innerHTML = '';
          return;
        }
        renderSearchResults(d.places);
      })
      .catch(err => {
        // 실패는 반드시 화면에 남긴다. 조용히 멈추면 원인을 못 찾는다.
        el.className = 'search-empty';
        el.textContent = '검색 실패: ' + err.message;
        document.getElementById('search-results').innerHTML = '';
      });
  }

  function doTencentSearch(q) {
    // 현재위치 기준 5km 반경 검색, 없으면 중국 전역
    const boundary = currentPos
      ? `nearby(${currentPos.lat},${currentPos.lng},5000,1)`
      : 'region(中国,0)';
    const url = `https://apis.map.qq.com/ws/place/v1/search?keyword=${encodeURIComponent(q)}&boundary=${boundary}&page_size=8&key=${TENCENT_KEY}`;
    jsonp(url).then(data => {
      const el = document.getElementById('search-status');
      if (data.status === 0 && data.data && data.data.length > 0) {
        const normalized = data.data.map(p => {
          // GCJ-02 → WGS-84 변환 (GPS/OSRM용)
          const wgs = gcj02ToWgs84(p.location.lat, p.location.lng);
          return { name: p.title, addr: p.address, lat: wgs.lat, lng: wgs.lng, dist: null };
        });
        renderSearchResults(normalized);
      } else {
        el.className = 'search-empty'; el.textContent = '검색 결과가 없습니다';
        document.getElementById('search-results').innerHTML = '';
      }
    }).catch(() => {
      document.getElementById('search-status').className = 'search-empty';
      document.getElementById('search-status').textContent = '검색 오류가 발생했습니다';
    });
  }

  function renderSearchResults(data) {
    searchResults = data;
    const container = document.getElementById('search-results');
    container.innerHTML = '';
    document.getElementById('search-status').style.display = 'none';
    data.forEach((place) => {
      const el = document.createElement('div');
      el.className = 'search-result-item focusable';
      el.tabIndex = 0;
      const dist = place.dist
        ? (place.dist < 1000 ? place.dist + 'm' : (place.dist/1000).toFixed(1) + 'km') : '';
      el.innerHTML = `
        <div class="r-name">${place.name}</div>
        <div class="r-addr">${place.addr}</div>
        ${dist ? `<div class="r-dist">📍 ${dist}</div>` : ''}
      `;
      el.addEventListener('click', () => selectSearchResult(place));
      container.appendChild(el);
    });
    searchFocusIndex = 0;
    focusSearchResult(0);
  }

  function focusSearchResult(idx) {
    const items = document.querySelectorAll('.search-result-item');
    items.forEach(el => el.classList.remove('focused'));
    if (items[idx]) { items[idx].classList.add('focused'); items[idx].focus(); searchFocusIndex = idx; }
  }

  function selectSearchResult(place) {
    startNav({ name: place.name, addr: place.addr, lat: place.lat, lng: place.lng, icon: '📍' });
  }

  // ── 네비 시작 ──
  // ══════════════════════════════════════════
  //  안내 중에는 화면이 꺼지면 안 된다
  // ══════════════════════════════════════════
  //  ★★ 이게 없었다. 걷거나 운전하는 동안 화면이 잠들면
  //    그리기(requestAnimationFrame)가 멈추고 위치 콜백도 느려진다.
  //    실보행·주행 내비로서 치명적인 누락이었다.
  //  ※ 잠금은 화면이 뒤로 갔다 오면 풀린다. 돌아올 때 다시 잡는다.
  //  ※ 지원 안 하는 브라우저에서도 조용히 넘어간다 — 없다고 안내가 멈추면 안 된다.
  let wakeLock = null;

  async function keepScreenOn() {
    try {
      if (!('wakeLock' in navigator)) return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { /* 권한이 없거나 배터리 절약 중이면 그냥 못 잡는다 */ }
  }
  function letScreenSleep() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
  document.addEventListener('visibilitychange', () => {
    // 안내 중에 돌아왔으면 다시 잡는다
    if (document.visibilityState === 'visible' && watchId !== null && !wakeLock) keepScreenOn();
  });

  function startNav(dest) {
    saveRecentDest(dest);
    keepScreenOn();
    // ★ 안내 중이던 목적지를 남겨둔다.
    //   앱을 껐다 켜면 페이지가 처음부터 다시 뜬다. 남겨두지 않으면
    //   홈으로 돌아가 목적지를 다시 보내야 한다 —
    //   걷다가 안경을 접거나 다른 걸 잠깐 보고 오면 매번 그렇게 된다.
    try {
      localStorage.setItem('navi.active', JSON.stringify({ dest, at: Date.now() }));
    } catch (e) {}
    selectedDest = dest;
    document.getElementById('nav-dest-name').textContent = dest.name;
    showScreen('screen-nav');
    //  ★ 안내 화면의 상태는 전부 상태 줄 하나로 낸다.
    //    showLoading 은 검색 화면에서만 쓴다 — 안내 중에 가운데를 덮으면
    //    지도도 경로도 못 본다.
    navFlags = { gpsLost: false, routeLoading: true, routeFailed: false, offline: false, approach: false };
    renderNavStatus();
    // 조작법을 잠깐 보여준다 (처음 쓰는 사람은 종료하는 법도 모른다)
    const help = document.getElementById('nav-help');
    if (help) {
      help.classList.remove('hidden');
      clearTimeout(help._t);
      help._t = setTimeout(() => help.classList.add('hidden'), 4000);
    }
    if (!currentPos) fallbackPos();

    // 현재위치 중심, 줌 16 (Meta 스타일 - 현재 위치 하단 1/3 고정)
    mapView.centerLat = currentPos.lat;
    mapView.centerLng = currentPos.lng;
    mapView.zoom = 18; zoomTarget = 18;   // 걸으면서 보는 화면이라 가깝게 잡는다
    // 탑뷰로 시작 → 경로 표시 후 쿼터뷰로 기울임
    mapView.pitch = 0;
    pitchTarget = 0;
    setTimeout(() => { pitchTarget = 1; }, 900);

    fetchRoute(currentPos, dest).then(route => {
      if (route) {
        routeCoords = route.geometry.coordinates.map(([lng, lat]) => ({ lat, lng }));
        routeSteps = route.legs[0].steps;
        currentStepIndex = 0;
        // ★ 진행률을 재려면 경로를 한 번 훑어 누적거리를 만들어 둬야 한다
        buildRouteIndex(route.duration);
        const distKm = (route.distance / 1000).toFixed(1);
        const etaMin = Math.round(route.duration / 60);
        document.getElementById('nav-eta').textContent = etaMin;
        document.getElementById('nav-dist').textContent = distKm;
        // 경로 캐시 저장
        cacheRoute(dest, routeCoords, routeSteps);
        updateStepUI(routeSteps[0]);
        speak(`${dest.name}까지 ${distKm}킬로미터, 약 ${etaMin}분 소요됩니다. 안내를 시작합니다`);
        // 경로 전체가 보이도록 줌 자동 조정
        fitRouteBounds();
      }
      //  ★ 경로가 없는데 '계산 중' 을 내리면 화면이 텅 빈 채로 남는다.
      //    못 받았으면 못 받았다고 말한다.
      setNavFlag('routeLoading', false);
      if (!routeCoords.length) setNavFlag('routeFailed', true);
      startRenderLoop();
      startTracking(dest);
    }).catch(() => {
      // 네트워크 실패 시 캐시 경로 복원
      const cached = loadCachedRoute();
      if (cached && cached.dest.name === dest.name) {
        routeCoords = cached.coords;
        routeSteps = cached.steps;
        currentStepIndex = 0;
        buildRouteIndex(0);   // 캐시에는 소요시간이 없다 — 속도로 어림한다
        updateStepUI(routeSteps[0]);
        fitRouteBounds();
        setOffline(true);
      }
      setNavFlag('routeLoading', false);
      if (!routeCoords.length) setNavFlag('routeFailed', true);
      startRenderLoop();
      startTracking(dest);
    });
  }

  // 네비 시작 시 현재위치 중심, 줌 16 고정 (Meta 스타일: 주변 도로만 보임)
  function fitRouteBounds() {
    if (!currentPos) return;
    mapView.centerLat = currentPos.lat;
    mapView.centerLng = currentPos.lng;
    mapView.zoom = 18; zoomTarget = 18; // 고정 줌 - 현재 주변만 크게 본다
  }

  // ══════════════════════════════════════════
  //  텐센트 경로 안내 (중국 도로 데이터)
  //  OSRM 공개 서버는 OpenStreetMap 기반이라 중국 도로가 부실하고
  //  중국에서 접속도 불안정하다. 중국에서는 텐센트를 쓴다.
  // ══════════════════════════════════════════

  // 텐센트의 회전 설명(중국어) → OSRM 형식으로.
  // ※ 순서 중요: '좌회전'보다 '좌전방'을 먼저 봐야 한다.
  const TENCENT_ACT = [
    [/掉头/,            'turn', 'uturn'],
    [/左前方|靠左/,      'turn', 'slight left'],
    [/右前方|靠右/,      'turn', 'slight right'],
    [/左后方/,          'turn', 'sharp left'],
    [/右后方/,          'turn', 'sharp right'],
    [/左转|向左/,        'turn', 'left'],
    [/右转|向右/,        'turn', 'right'],
  ];

  function fetchTencentRoute(from, dest) {
    const mode = navProfile === 'driving' ? 'driving' : 'walking';
    const f = wgs84ToGcj02(from.lat, from.lng);
    const t = wgs84ToGcj02(dest.lat, dest.lng);
    const url = `https://apis.map.qq.com/ws/direction/v1/${mode}/`
              + `?from=${f.lat},${f.lng}&to=${t.lat},${t.lng}&key=${TENCENT_KEY}`;

    return jsonp(url).then(d => {
      if (d.status !== 0) throw new Error(d.message || '텐센트 경로 실패');
      const r = d.result && d.result.routes && d.result.routes[0];
      if (!r) throw new Error('경로 없음');

      // 폴리라인은 차분 압축돼 온다 — 앞 값에 더해가며 복원
      const pl = r.polyline.slice();
      for (let i = 2; i < pl.length; i++) pl[i] = pl[i - 2] + pl[i] / 1000000;
      const pts = [];
      for (let i = 0; i + 1 < pl.length; i += 2) {
        const w = gcj02ToWgs84(pl[i], pl[i + 1]);
        pts.push([w.lng, w.lat]);          // OSRM과 같은 [경도, 위도] 순서
      }
      if (pts.length < 2) throw new Error('경로 좌표 부족');

      const steps = (r.steps || []).map(st => {
        const i0 = Array.isArray(st.polyline_idx) ? st.polyline_idx[0] : 0;
        const loc = pts[Math.min(i0, pts.length - 1)];
        const desc = (st.act_desc || '') + (st.dir_desc || '') + (st.instruction || '');
        let type = 'turn', mod = 'straight';
        for (const [re, ty, md] of TENCENT_ACT) {
          if (re.test(desc)) { type = ty; mod = md; break; }
        }
        return {
          distance: st.distance || 0,
          duration: (st.duration || 0) * 60,   // 텐센트는 '분' 단위
          name: st.road_name || '',
          maneuver: { type, modifier: mod, location: loc },
        };
      });
      steps.push({
        distance: 0, duration: 0, name: '',
        maneuver: { type: 'arrive', modifier: '', location: pts[pts.length - 1] },
      });

      return {
        distance: r.distance,
        duration: (r.duration || 0) * 60,     // 분 → 초
        geometry: { coordinates: pts },
        legs: [{ steps }],
      };
    });
  }

  // ══════════════════════════════════════════
  //  국내 도보 경로 (TMAP 보행자 경로안내)
  //  OSRM은 오픈스트리트맵 기반이라 국내 보도 데이터가 부실하다.
  //  TMAP은 횡단보도·육교·지하보도까지 반영된 실제 보행 경로를 준다.
  // ══════════════════════════════════════════

  // TMAP 회전 코드 → OSRM 형식
  //  ★ TMAP 회전 코드 → 우리 표현.
  //    보행자와 자동차가 코드 체계를 공유하지만 자동차에만 있는 것이 많다
  //    (고속도로 입출구·P턴). 규격서에서 확인한 것만 적는다.
  const TMAP_TURN = {
    11: ['turn', 'straight'],     12: ['turn', 'left'],         13: ['turn', 'right'],
    14: ['turn', 'uturn'],        15: ['turn', 'pturn'],
    16: ['turn', 'sharp left'],   17: ['turn', 'slight left'],
    18: ['turn', 'slight right'], 19: ['turn', 'sharp right'],
    43: ['turn', 'right'],        44: ['turn', 'left'],
    // 고속도로·도시고속도로 입구
    101: ['ramp', 'right'], 102: ['ramp', 'left'], 103: ['ramp', 'straight'],
    111: ['ramp', 'right'], 112: ['ramp', 'left'], 113: ['ramp', 'straight'],
    // 고속도로·도시고속도로 출구
    104: ['exit', 'right'], 105: ['exit', 'left'], 106: ['exit', 'straight'],
    114: ['exit', 'right'], 115: ['exit', 'left'], 116: ['exit', 'straight'],
    117: ['turn', 'slight right'], 118: ['turn', 'slight left'],
    200: ['depart', ''],
    201: ['arrive', ''], 182: ['arrive', 'left'], 183: ['arrive', 'right'],
    203: ['arrive', 'across'],
  };

  //  ══════════════════════════════════════════
  //   TMAP 경로 — 걸을 때와 탈 때는 다른 API 다
  //  ══════════════════════════════════════════
  //  ★★ 전에는 자동차 모드면 TMAP 을 아예 안 쓰고 OSRM 공개 서버로 넘겼다.
  //    그 서버는 한국 도로 정확도가 떨어지고 실시간 교통도, 한국어 안내도 없다.
  //    차에서 써보니 "도보랑 똑같다" 고 느껴진 이유의 절반이 이것이었다.
  //  ★ TMAP 에 자동차 경로안내가 따로 있다 (규격서 확인).
  //    응답이 보행자와 **같은 GeoJSON 구조**라 해석기를 그대로 쓴다.
  //    다른 건 주소와 보내는 값뿐이다.
  function fetchTmapRoute(from, dest) {
    const car = (navProfile === 'driving');

    const url = car
      ? 'https://apis.openapi.sk.com/tmap/routes?version=1&format=json'
      : 'https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&format=json';

    const body = {
      startX: from.lng, startY: from.lat,
      endX: dest.lng,   endY: dest.lat,
      reqCoordType: 'WGS84GEO', resCoordType: 'WGS84GEO',
      startName: '출발', endName: '도착',
      sort: 'index',
    };
    if (car) {
      body.searchOption = '00';   // 교통최적 + 추천 (티맵 기본값)
      body.carType = 0;           // 승용차
      body.trafficInfo = 'Y';     // 혼잡도도 함께 받는다
    }

    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'appKey': TMAP_KEY },
      body: JSON.stringify(body),
    }).then(r => r.json()).then(parseTmapRoute);
  }

  /// TMAP 응답(보행자·자동차 공통 GeoJSON)을 우리 경로 형태로 옮긴다
  function parseTmapRoute(d) {
    const feats = d.features || [];
    if (!feats.length) throw new Error(d.error && d.error.message || 'TMAP 경로 없음');

    const head = (feats[0] && feats[0].properties) || {};
    const pts = [];
    const steps = [];

    for (const f of feats) {
      const pr = f.properties || {}, g = f.geometry || {};
      if (g.type === 'LineString') {
        // 경로선 — 중복 좌표는 건너뛴다
        for (const c of g.coordinates) {
          const last = pts[pts.length - 1];
          if (!last || last[0] !== c[0] || last[1] !== c[1]) pts.push(c);
        }
      } else if (g.type === 'Point') {
        const [type, mod] = TMAP_TURN[pr.turnType] || ['turn', 'straight'];
        // ★ 자동차는 nextRoadName 이 훨씬 쓸모 있다 ("소공로" 처럼).
        //   description 은 "…방면으로 좌회전 후 …190m 이동" 처럼 길어서
        //   600×600 안경 화면에 안 들어간다.
        const label = (pr.nextRoadName || pr.description || '')
          .replace(/^,\s*/, '').trim();
        steps.push({
          distance: 0,        // 아래에서 다음 지점까지 거리로 채운다
          duration: 0,
          name: label,
          maneuver: { type, modifier: mod, location: g.coordinates },
        });
      }
    }
    if (pts.length < 2) throw new Error('TMAP 경로 좌표 부족');

    for (let i = 0; i < steps.length - 1; i++) {
      const a = steps[i].maneuver.location, b = steps[i + 1].maneuver.location;
      steps[i].distance = Math.round(
        Math.hypot((b[1] - a[1]) * 111320, (b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180))
      );
    }
    if (!steps.length || steps[steps.length - 1].maneuver.type !== 'arrive') {
      steps.push({ distance: 0, duration: 0, name: '',
        maneuver: { type: 'arrive', modifier: '', location: pts[pts.length - 1] } });
    }

    return {
      distance: head.totalDistance || 0,
      duration: head.totalTime || 0,      // TMAP 은 초 단위
      fare: head.totalFare || 0,          // 통행료 (자동차만 온다)
      geometry: { coordinates: pts },
      legs: [{ steps }],
    };
  }

  // 나라에 따라 경로 엔진을 고른다. 실패하면 OSRM으로 넘어간다.
  function fetchRoute(from, dest) {
    if (currentCountry() === 'cn') {
      return fetchTencentRoute(from, dest).catch(e => {
        console.warn('텐센트 경로 실패, OSRM으로 대체:', e && e.message);
        return fetchOSRMRoute(from, dest);
      });
    }
    return fetchTmapRoute(from, dest).catch(e => {
      console.warn('TMAP 경로 실패, OSRM으로 대체:', e && e.message);
      return fetchOSRMRoute(from, dest);
    });
  }

  // ── OSRM (한국·그 외 / 텐센트 실패 시 대체) ──
  //  ★★ 공개 OSRM 데모 서버는 **자동차 프로파일만** 호스팅한다.
  //    'foot' 로 부르면 오류가 온다. 그런데 전에는 실패를 null 로 조용히
  //    돌려줘서, 화면은 로딩만 사라지고 "경로 계산 중..." 이 영원히 남았다.
  //    ※ 없는 것을 있는 척하지 않는다. 못 하면 못 한다고 던진다.
  function fetchOSRMRoute(from, dest) {
    const profile = 'driving';   // 이 서버가 가진 건 이것뿐이다
    const url = `https://router.project-osrm.org/route/v1/${profile}/${from.lng},${from.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson&steps=true`;
    return fetch(url).then(r => r.json()).then(d => {
      const r0 = d && d.routes && d.routes[0];
      if (!r0) throw new Error('OSRM 경로 없음');
      return r0;
    });
  }

  // ── 이동 수단 선택 ──
  function setProfile(mode) {
    navProfile = mode;
    // ★ 모드를 바꾸면 안내 상태를 비운다.
    //   문턱·안내거리·소요시간 계산이 전부 달라지므로 옛 값이 남으면 안 된다.
    spokenDistBucket = null; spokenBucketVal = null;
    document.getElementById('btn-foot').classList.toggle('active-mode', mode === 'foot');
    document.getElementById('btn-drive').classList.toggle('active-mode', mode === 'driving');
    // 네비 카드 아이콘 업데이트
    const icon = document.querySelector('.nav-card-row span');
    if (icon) icon.textContent = mode === 'foot' ? '🚶' : '🚗';
  }
  document.getElementById('btn-foot').addEventListener('click', () => setProfile('foot'));
  document.getElementById('btn-drive').addEventListener('click', () => setProfile('driving'));

  // ── 타일 수학 ──
  // ★ 지도 타일은 정수 줌에만 존재한다.
  //   줌을 부드럽게 만들면서 소수(17.5)를 그대로 넘겼더니
  //   없는 타일을 부르게 되어 도로가 통째로 사라졌다.
  //   타일 계산은 정수로 하고, 소수부는 캔버스를 확대해 표현한다.
  function tileZ() { return Math.round(mapView.zoom); }
  function zoomScale() { return Math.pow(2, mapView.zoom - tileZ()); }

  function latLngToTilePixel(lat, lng, z) {
    const n = Math.pow(2, z);
    const tx = (lng + 180) / 360 * n;
    const latRad = lat * Math.PI / 180;
    const ty = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
    return { tx, ty };
  }

  // ══════════════════════════════════════════
  //  지도를 진행 방향으로 돌린다
  // ══════════════════════════════════════════
  //  ★★ 전에는 **북쪽 고정**이었다. 나침반 값은 현재 위치의 부채꼴을
  //    돌리는 데만 썼다. 그런데 화면을 쿼터뷰로 기울여 놓았으므로
  //    '화면 위쪽 = 앞' 으로 읽히는데, 실제로는 북쪽이었다.
  //    남쪽으로 가면 경로선이 발밑으로 뻗는다.
  //    안경이 머리에 붙어 있는 만큼 이건 바로 방향 착각이 된다.
  //
  //  ★ 진행 방향이 화면 위로 오게 돌린다 (티맵·네이버와 같은 방식).
  //  ※ 갑자기 홱 돌면 멀미가 난다. 매 프레임 조금씩 따라가게 한다.
  //  ※ 방향을 모를 때는 돌리지 않는다 — 엉뚱하게 돌아간 지도는
  //    안 돌아간 지도보다 나쁘다.
  let viewRot = 0;        // 지금 화면이 돌아간 각(라디안)

  function updateViewRot() {
    const deg = facingDeg();
    if (deg == null) return;                 // 모르면 그대로 둔다
    const target = -deg * Math.PI / 180;     // 그 방향이 위로 오게
    let d = target - viewRot;
    // 359도 → 1도 처럼 한 바퀴를 도는 대신 가까운 쪽으로
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    viewRot += d * 0.12;
  }

  // ── 원근 투영 (탑뷰 → 쿼터뷰) ──
  // 현재 위치(POS_X, POS_Y)를 기준점으로, 앞쪽(위)일수록 압축·수렴
  function proj(x, y) {
    const p = mapView.pitch;
    if (p < 0.005) return { x, y, ok: true };
    const d = POS_Y - y;                  // 앞쪽 거리 (양수 = 전방)
    const denom = 1 + d * PITCH_K * p;
    if (denom < 0.15) return { x, y, ok: false };  // 지평선 너머 = 클립
    return {
      x: POS_X + (x - POS_X) / denom,
      y: POS_Y - d / denom,
      ok: true,
    };
  }

  function latLngToPixel(lat, lng) {
    const { tx: cx, ty: cy } = latLngToTilePixel(mapView.centerLat, mapView.centerLng, tileZ());
    const { tx, ty } = latLngToTilePixel(lat, lng, tileZ());
    // 현재위치가 POS_X, POS_Y (하단 1/3)에 오도록 오프셋
    let fx = (tx - cx) * TILE_SIZE + POS_X;
    let fy = (ty - cy) * TILE_SIZE + POS_Y;
    // ★ 내 자리를 중심으로 돌린다. 기울이기(proj)는 그 뒤에 한다 —
    //   순서가 바뀌면 원근이 엉뚱한 축으로 걸린다.
    if (viewRot) {
      const dx = fx - POS_X, dy = fy - POS_Y;
      const c = Math.cos(viewRot), sn = Math.sin(viewRot);
      fx = POS_X + dx * c - dy * sn;
      fy = POS_Y + dx * sn + dy * c;
    }
    return proj(fx, fy);
  }

  // ── 렌더 루프 ──
  function startRenderLoop() {
    if (animFrame) cancelAnimationFrame(animFrame);
    function loop() {
      pulsePhase = (pulsePhase + 0.025) % 1;
      updateViewRot();
      // 카메라 각도 부드럽게 전환 (탑뷰 → 쿼터뷰)
      // 줌도 부드럽게 따라간다
      if (Math.abs(mapView.zoom - zoomTarget) > 0.002) {
        mapView.zoom += (zoomTarget - mapView.zoom) * 0.18;
      } else {
        mapView.zoom = zoomTarget;
      }
      if (Math.abs(mapView.pitch - pitchTarget) > 0.001) {
        mapView.pitch += (pitchTarget - mapView.pitch) * 0.045;
      } else {
        mapView.pitch = pitchTarget;
      }
      renderMap();
      animFrame = requestAnimationFrame(loop);
    }
    loop();
  }
  function stopRenderLoop() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  }

  // ── Canvas 렌더링 ──
  function renderMap() {
    ctx.clearRect(0, 0, 600, 600);

    const z = tileZ();
    const { tx: cx, ty: cy } = latLngToTilePixel(mapView.centerLat, mapView.centerLng, z);

    // 소수 줌은 화면을 확대해서 표현한다 (타일은 정수 줌만 있다)
    ctx.save();
    const sc = zoomScale();
    if (Math.abs(sc - 1) > 0.001) {
      ctx.translate(POS_X, POS_Y);
      ctx.scale(sc, sc);
      ctx.translate(-POS_X, -POS_Y);
    }

    // 벡터 도로선 (Mapbox Streets MVT → 흰 선, 검정=투명)
    drawRoads(cx, cy);

    // 경로선 (Meta 스타일 - 얇고 선명한 파란선)
    if (routeCoords.length > 1) {
      // ★ 경로선은 화면에서 가장 중요한 선이다. 도로보다 확실히 위에 보여야 한다.
      //   외곽 번짐 (넓게, 그러나 도로와 섞이지 않게 색을 확실히)
      ctx.beginPath();
      //  ★ 바깥 띠는 '경로가 지나가는 폭' 을 알려주는 몸통이다.
      //    도로가 밝아진 만큼 이것도 같이 올린다 (0.40 → 0.60 ≈ 3,000 nit).
      ctx.strokeStyle = 'rgba(60,255,140,0.60)';
      ctx.lineWidth = 22; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      let started = false;
      routeCoords.forEach(pt => {
        const p = latLngToPixel(pt.lat, pt.lng);
        if (!p.ok) { started = false; return; }
        started ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
        started = true;
      });
      ctx.stroke();

      // 메인선 (굵고 선명)
      ctx.beginPath();
      // ★ 파랑은 흰 도로 위에 얹히면 빛이 섞여 묻혔다 (더하기 화면).
      //   초록은 흰색과 가장 멀리 떨어져 있어 겹쳐도 구분된다.
      ctx.strokeStyle = '#3cff8c';
      ctx.lineWidth = 13; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      //  ★ 글로우(shadowBlur)를 뺐다.
      //    불투명 화면에서는 강조지만 **더하기 화면에서는 빛을 주변에 퍼뜨려
      //    경계를 흐린다.** 밝아 보이지만 덜 또렷해진다.
      //    강조는 번짐이 아니라 굵기로 한다 (11 → 13px).
      started = false;
      routeCoords.forEach(pt => {
        const p = latLngToPixel(pt.lat, pt.lng);
        if (!p.ok) { started = false; return; }
        started ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
        started = true;
      });
      ctx.stroke();
    }

    //  ── 접근 구간 점선 ──
    //  ※ 경로선 **다음에** 그린다. 경로선 아래로 깔면 겹치는 부분에서
    //    초록에 묻혀 안 보인다. 다만 현재 위치보다는 먼저 그린다.
    if (linkTarget && currentPos) {
      const a = latLngToPixel(currentPos.lat, currentPos.lng);
      const b = latLngToPixel(linkTarget.lat, linkTarget.lng);
      if (a.ok !== false && b.ok !== false) {
        ctx.save();
        //  ★ 점선 간격을 넉넉히 (12/10). 더하기 화면에서 촘촘한 점선은
        //    번져서 실선으로 보인다 — 그러면 '길' 로 오해한다.
        ctx.setLineDash([12, 10]);
        ctx.lineCap = 'butt';
        //  경로선(초록)과 다른 색이어야 '길이 아니다' 가 읽힌다.
        ctx.strokeStyle = '#ffd27a';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.stroke();
        //  붙어야 할 지점에 작은 고리를 찍는다 — 선만 있으면 어디까지인지 모른다
        ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, Math.PI * 2);
        ctx.lineWidth = 4; ctx.stroke();
        ctx.restore();
      }
    }

    // 목적지 핀 or 화면 밖이면 가장자리 방향 인디케이터
    if (selectedDest) {
      const { x, y } = latLngToPixel(selectedDest.lat, selectedDest.lng);
      const margin = 24;
      const onScreen = x > margin && x < 600-margin && y > margin && y < 600-margin;
      if (onScreen) {
        drawDestPin(x, y);
      } else {
        drawDestEdgeIndicator(x, y);
      }
    }

    // 현재 위치 (펄스 애니메이션)
    if (currentPos) {
      const { x, y } = latLngToPixel(currentPos.lat, currentPos.lng);
      drawCurrentPos(x, y);
    }

    ctx.restore();   // 소수 줌 확대 해제
  }

  function drawDestPin(x, y) {
    // 물방울 핀 (구글맵 스타일)
    ctx.save();
    ctx.translate(x, y);
    // 그림자
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
    // 핀 몸통 (원)
    ctx.beginPath(); ctx.arc(0, -14, 11, 0, Math.PI*2);
    ctx.fillStyle = '#e8333a'; ctx.fill();
    // 핀 꼭지
    ctx.beginPath();
    ctx.moveTo(-7, -5); ctx.lineTo(7, -5); ctx.lineTo(0, 6);
    ctx.closePath(); ctx.fillStyle = '#e8333a'; ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    // 핀 내부 흰 원
    ctx.beginPath(); ctx.arc(0, -14, 5, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
  }

  // 목적지가 화면 밖일 때 가장자리 방향 인디케이터
  function drawDestEdgeIndicator(destX, destY) {
    const cx = 300, cy = 300; // 화면 중심
    const pad = 20; // 가장자리 여백
    const W = 600, H = 600;

    // 화면 중심 → 목적지 방향 각도
    const angle = Math.atan2(destY - cy, destX - cx);
    const cos = Math.cos(angle), sin = Math.sin(angle);

    // 화면 가장자리 교차점 계산
    let ex, ey;
    const tx = cos > 0 ? (W - pad - cx) / cos : cos < 0 ? -(cx - pad) / cos : Infinity;
    const ty = sin > 0 ? (H - pad - cy) / sin : sin < 0 ? -(cy - pad) / sin : Infinity;
    const t = Math.min(Math.abs(tx), Math.abs(ty));
    ex = cx + cos * t;
    ey = cy + sin * t;

    // 클램프
    ex = Math.max(pad, Math.min(W - pad, ex));
    ey = Math.max(pad, Math.min(H - pad, ey));

    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(angle);

    // 삼각형 화살표
    const sz = 11;
    ctx.beginPath();
    ctx.moveTo(sz, 0);
    ctx.lineTo(-sz * 0.7, -sz * 0.6);
    ctx.lineTo(-sz * 0.7,  sz * 0.6);
    ctx.closePath();
    ctx.fillStyle = '#e8333a';
    ctx.shadowColor = 'rgba(232,51,58,0.7)';
    ctx.shadowBlur = 8;
    ctx.fill();

    // 흰 테두리
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  function drawCurrentPos(x, y) {
    // ★ 방향 부채꼴 — 내가 어느 쪽을 보고 있는지.
    //   이게 없으면 점만 찍혀서 어느 쪽으로 첫걸음을 떼야 할지 알 수 없다.
    const deg = facingDeg();
    if (deg == null) {
      // ★ 방향을 못 얻었으면 그렇다고 보여준다.
      //   아무것도 안 그리면 '방향이 없는 것' 과 '고장난 것' 을 구분할 수 없다.
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2);
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = '#ffffff';   // 더하기 화면에서 반투명은 '연하게' 가 아니라 '지우기' 다
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }
    if (deg != null) {
      // ★ 지도가 진행 방향으로 돌아갔으므로, 부채꼴도 같은 만큼 돌려야
      //   화면에서 위를 가리킨다. (안 돌리면 지도와 부채꼴이 따로 논다)
      const rad = (deg - 90) * Math.PI / 180 + viewRot;
      const spread = 0.42;                       // 부채꼴 폭 (약 48도)
      const R = 46;
      const g = ctx.createRadialGradient(x, y, 8, x, y, R);
      g.addColorStop(0, 'rgba(92,200,255,0.85)');
      g.addColorStop(1, 'rgba(92,200,255,0)');
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, R, rad - spread, rad + spread);
      ctx.closePath();
      ctx.fillStyle = g;
      ctx.fill();

      // 끝에 화살촉 하나 — 부채꼴만으로는 방향이 덜 또렷하다
      const ax = x + Math.cos(rad) * (R - 6);
      const ay = y + Math.sin(rad) * (R - 6);
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(rad);
      ctx.beginPath();
      ctx.moveTo(9, 0); ctx.lineTo(-6, -6); ctx.lineTo(-6, 6);
      ctx.closePath();
      ctx.fillStyle = '#5cc8ff';
      ctx.shadowColor = 'rgba(92,200,255,0.9)'; ctx.shadowBlur = 10;
      ctx.fill(); ctx.shadowBlur = 0;
      ctx.restore();
    }

    // 외부 펄스 링
    const pulseR = 14 + pulsePhase * 22;
    const pulseAlpha = (1 - pulsePhase) * 0.3;
    ctx.beginPath(); ctx.arc(x, y, pulseR, 0, Math.PI*2);
    ctx.fillStyle = `rgba(74,158,255,${pulseAlpha})`; ctx.fill();

    // 중간 링 (흰색)
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    //  ★ 글로우를 뺐다 — 더하기 화면에서 번짐은 경계를 흐릴 뿐이다
    ctx.fill();

    // 내부 파란/보라 그라디언트 원 (Meta 스타일)
    const grad = ctx.createRadialGradient(x-2, y-2, 1, x, y, 9);
    grad.addColorStop(0, '#c4a8ff');
    grad.addColorStop(1, '#5cc8ff');
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI*2);
    ctx.fillStyle = grad; ctx.fill();
  }

  // ── 줌 (키보드 전용) ──
  // 0.5 단계로 목표만 바꾸고, 실제 줌은 매 프레임 그리로 다가간다
  function zoomIn()  { zoomTarget = Math.min(ZOOM_MAX, zoomTarget + 0.5); }
  function zoomOut() { zoomTarget = Math.max(ZOOM_MIN, zoomTarget - 0.5); }

  // ── 경로 이탈 감지 ──
  function distToRoute(lat, lng) {
    if (routeCoords.length < 2) return Infinity;
    let minD = Infinity;
    for (let i = 0; i < routeCoords.length - 1; i++) {
      const d = pointToSegmentDist(lat, lng, routeCoords[i], routeCoords[i+1]);
      if (d < minD) minD = d;
    }
    return minD;
  }
  // ══════════════════════════════════════════
  //  경로 위 어디까지 왔는가 — 진행률
  // ══════════════════════════════════════════
  //  ★★ 차에서 써보고 알았다. 전에는 '다음 회전점까지 직선거리' 만 봤다.
  //
  //    시속 60km 면 초당 17m 다. 위치가 5초마다 오면 한 번에 83m 를 건너뛴다.
  //    그런데 스텝 전진 조건이 '25m 안에 들어오면' 이었다 —
  //    회전점을 지나가도 그 창에 한 번도 안 걸려서 안내가 영영 안 넘어갔다.
  //    남은 거리도 직선이라 화면의 경로선과 눈에 띄게 어긋났다.
  //
  //  ★ 그래서 현재 위치를 **경로선에 투영**한다.
  //    '경로의 몇 미터 지점에 있는가' 하나를 알면
  //    지나쳤는지 · 다음 회전까지 몇 m · 총 몇 m 남았는지가 전부 나온다.
  //    창을 통과했는지에 기대지 않으므로 속도와 무관하다.
  let routeCum = [];      // 각 경로점까지의 누적 거리(m)
  let stepAlong = [];     // 각 안내지점이 경로의 몇 m 지점인가
  let alongNow = 0;       // 지금 내가 있는 지점(m)
  let projHint = 0;       // 지난번에 붙었던 자리 (여기 근처부터 찾는다)
  let routeTotalM = 0;
  let routeDurationS = 0; // 경로가 알려준 총 소요(초)

  function metersBetween(a, b) {
    const dy = (b.lat - a.lat) * 111320;
    const dx = (b.lng - a.lng) * 111320 * Math.cos(a.lat * Math.PI / 180);
    return Math.hypot(dx, dy);
  }

  /// 경로가 새로 들어오면 한 번 계산해 둔다
  function buildRouteIndex(durationSec) {
    routeCum = [0];
    for (let i = 1; i < routeCoords.length; i++) {
      routeCum[i] = routeCum[i - 1] + metersBetween(routeCoords[i - 1], routeCoords[i]);
    }
    routeTotalM = routeCum.length ? routeCum[routeCum.length - 1] : 0;
    routeDurationS = durationSec || 0;
    projHint = 0;
    alongNow = 0;
    // 안내지점을 '경로 위 거리' 로 옮겨둔다. 여기서는 전체를 훑어야 한다.
    stepAlong = routeSteps.map(st => {
      //  ★ 스텝에 회전 지점이 없을 수 있다 (옛 버전이 남긴 캐시 경로 등).
      //    여기서 터지면 **안내가 통째로 죽는다** — 화면은 '경로 계산 중' 에서
      //    영영 멈춘다. 한 스텝 못 읽는 것보다 그게 훨씬 나쁘다.
      const loc = st && st.maneuver && st.maneuver.location;
      if (!loc) return 0;
      return projectOnRoute(loc[1], loc[0], 0, routeCoords.length - 1).along;
    });
  }

  /// 한 점을 경로선에 투영한다 → { along(m), offset(m), idx }
  //  ※ 전체를 매번 훑지 않는다. 지난 자리 근처만 본다 —
  //    회차로처럼 경로가 자기 위로 겹칠 때 엉뚱한 곳에 붙는 것도 이걸로 막는다.
  //  ※ 거리는 그 점 기준 평면 근사로 잰다. 경도에 cos(위도) 를 곱해야
  //    가로세로 자가 같아진다 (전에는 안 곱해서 투영점이 치우쳤다).
  function projectOnRoute(lat, lng, from, to) {
    if (routeCoords.length < 2) return { along: 0, offset: Infinity, idx: 0 };
    const lo = (from != null) ? from : Math.max(0, projHint - 30);
    const hi = (to != null) ? to : Math.min(routeCoords.length - 1, projHint + 600);
    const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 111320;

    let best = { along: routeCum[lo] || 0, offset: Infinity, idx: lo };
    for (let i = lo; i < hi; i++) {
      const a = routeCoords[i], b = routeCoords[i + 1];
      const ax = (a.lng - lng) * kx, ay = (a.lat - lat) * ky;
      const bx = (b.lng - lng) * kx, by = (b.lat - lat) * ky;
      const dx = bx - ax, dy = by - ay;
      const len2 = dx * dx + dy * dy;
      let t = 0;
      if (len2 > 0) t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2));
      const px = ax + t * dx, py = ay + t * dy;
      const off = Math.hypot(px, py);
      if (off < best.offset) {
        best = { along: (routeCum[i] || 0) + Math.sqrt(len2) * t, offset: off, idx: i };
      }
    }
    return best;
  }

  /// 거리를 사람이 읽는 꼴로
  //  ══════════════════════════════════════════
  //   경로까지 데려다주는 점선 (접근 구간)
  //  ══════════════════════════════════════════
  //  ★★ 왜 필요한가
  //    건물 안이나 주차장에서 안내를 켜면 나는 도로 위에 있지 않다.
  //    그러면 화면에 **경로선은 저 멀리 떠 있고 나는 아무 데나 찍혀** 있다.
  //    "어느 쪽으로 나가야 하나" 를 화면이 말해주지 않는다.
  //    티맵·네이버가 이 구간을 점선으로 이어주는 게 그래서다.
  //
  //  ※ 실선으로 긋지 않는다. 이 구간은 **길이 아니다** —
  //    건물을 통과하거나 담을 넘는 직선일 수 있다.
  //    실선으로 그으면 "이리로 가라" 로 읽힌다. 점선은 "저기로 붙어라" 다.
  //    모양이 곧 뜻이므로 여기서 아끼면 안 된다.
  let linkTarget = null;    // {lat,lng} — 경로 위 붙어야 할 지점
  let linkDistM  = 0;       // 거기까지 직선 거리

  /// 경로를 따라 mAlong 미터 지점의 좌표. 없으면 null.
  function pointAlongRoute(mAlong) {
    if (routeCoords.length < 2 || !routeCum.length) return null;
    const m = Math.max(0, Math.min(mAlong, routeTotalM));
    let i = 1;
    while (i < routeCum.length - 1 && routeCum[i] < m) i++;
    const segLen = routeCum[i] - routeCum[i-1];
    const t = segLen > 0 ? (m - routeCum[i-1]) / segLen : 0;
    const a = routeCoords[i-1], b = routeCoords[i];
    return { lat: a.lat + (b.lat - a.lat) * t, lng: a.lng + (b.lng - a.lng) * t };
  }

  function fmtDist(m) {
    if (m >= 1000) return (m / 1000).toFixed(1) + 'km';
    // ★ 차에서는 1m 단위가 의미 없다. 10m 로 끊는다.
    if (navProfile === 'driving') return Math.round(m / 10) * 10 + 'm';
    return Math.round(m) + 'm';
  }

  // ══════════════════════════════════════════
  //  걸을 때와 탈 때의 차이는 여기서만 정한다
  // ══════════════════════════════════════════
  //  ※ 전에는 도보 값 하나로 둘 다 돌렸다. 그래서 '모드가 있으나 마나' 였다.
  function trackOpts() {
    return navProfile === 'driving'
      // 차는 초당 17m 다. 5초 묵은 위치는 83m 뒤의 이야기다.
      ? { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      : { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 };
  }
  function offRouteLimitM() { return navProfile === 'driving' ? 60 : 30; }
  function arriveLimitM()   { return navProfile === 'driving' ? 60 : 30; }

  function pointToSegmentDist(lat, lng, a, b) {
    // 단순 거리 근사 (km)
    const dx = b.lng - a.lng, dy = b.lat - a.lat;
    if (dx === 0 && dy === 0) return getDistanceKm(lat, lng, a.lat, a.lng);
    const t = Math.max(0, Math.min(1, ((lng - a.lng)*dx + (lat - a.lat)*dy) / (dx*dx + dy*dy)));
    return getDistanceKm(lat, lng, a.lat + t*dy, a.lng + t*dx);
  }

  // ── GPS 추적 ──
  //  ★ 위치가 올 때마다 하는 일은 하나뿐이다: **경로 위 내 자리를 갱신한다.**
  //    나머지(도착·ETA·다음 회전·이탈)는 전부 그 값에서 나온다.
  let offStreak = 0;        // 연달아 경로 밖으로 나온 횟수
  let lastRerouteAt = 0;

  function startTracking(dest) {
    //  ※ 여기서 미리 켜두지 않는다. 첫 위치가 올 때까지는
    //    '경로 계산 중' 이 이미 떠 있으므로 두 번 말할 필요가 없다.
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    offStreak = 0;
    lastRerouteAt = 0;

    watchId = navigator.geolocation.watchPosition(pos => {
      currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (pos.coords.heading != null) { currentHeading = pos.coords.heading; lastGpsHeadingAt = Date.now(); }
      mapView.centerLat = currentPos.lat;
      mapView.centerLng = currentPos.lng;
      try { localStorage.setItem('ko_navi_last_pos', JSON.stringify(currentPos)); } catch {}
      //  ★ 위치가 다시 왔으면 경고를 **반드시 내린다.**
      //    안 내리면 지나간 오류가 계속 떠 있어 '늑대다' 가 된다
      //    (번역 앱에서 똑같은 걸 겪었다).
      setNavFlag('gpsLost', false);
      setOffline(false);

      if (routeCoords.length < 2) return;

      // ── 경로 위 내 자리 ──
      const pr = projectOnRoute(currentPos.lat, currentPos.lng);

      //  ★★ 여기 구멍이 있었다.
      //    경로에서 아무리 멀리 떨어져 있어도 진행률을 그대로 올렸다.
      //    건물 안에서 켰는데 경로가 그 건물 근처를 두 번 지나가면,
      //    가장 가까운 점이 **뒤쪽 구간이 아니라 앞쪽 구간**으로 잡혀
      //    진행이 통째로 앞으로 튄다 — 회전 안내가 몇 개씩 건너뛴다.
      //  ★ 경로에 붙어 있을 때만 진행으로 친다.
      const ONROUTE_M = 25;
      const onRoute = pr.offset <= ONROUTE_M;
      if (onRoute && pr.along > alongNow) { alongNow = pr.along; projHint = pr.idx; }

      //  ★ 떨어져 있으면 '경로 위 지금 자리' 까지 점선으로 잇는다.
      //    처음엔 alongNow 가 0 이므로 자연히 **출발 지점**을 가리킨다.
      //    가다가 벗어나면 그 시점의 자리를 가리킨다 — 규칙 하나로 둘 다 된다.
      setNavFlag('approach', !onRoute && alongNow < 5);   // 출발 전 접근 구간만
      if (onRoute) {
        linkTarget = null; linkDistM = 0;
      } else {
        linkTarget = pointAlongRoute(alongNow);
        linkDistM  = linkTarget
          ? metersBetween(currentPos, linkTarget)
          : 0;
      }

      //  ★ 남은 거리에 접근 구간을 더한다.
      //    안 더하면 건물 안에서 '200m' 라고 떠 있다가
      //    밖에 나오는 순간 '250m' 로 늘어난다. 늘어나는 남은 거리는
      //    고장으로 보인다.
      const remainM = Math.max(0, routeTotalM - alongNow) + linkDistM;

      // ── 도착 ──
      if (remainM < arriveLimitM()) {
        navigator.geolocation.clearWatch(watchId); watchId = null;
        // ★ 도착했으면 이어갈 것이 없다. 안 지우면 다시 열 때 또 안내한다.
        try { localStorage.removeItem('navi.active'); } catch (e) {}
        letScreenSleep();
        speak('목적지에 도착했습니다');
        document.getElementById('turn-arrow').textContent = '🏁';
        document.getElementById('turn-dist').textContent = '도착!';
        document.getElementById('turn-text').textContent = dest.name;
        document.getElementById('nav-eta').textContent = '도착';
        document.getElementById('nav-dist').textContent = '0.0';
        return;
      }

      // ── 남은 거리·시간 ──
      //  ★ 전에는 목적지까지 직선거리와 4km/h 고정이었다.
      //    드라이브에서 5km 가 75분으로 떴다. 경로가 알려준 소요시간을
      //    남은 비율로 환산한다. (교통정보가 반영된 값이다)
      document.getElementById('nav-dist').textContent = (remainM / 1000).toFixed(1);
      let etaSec;
      if (routeDurationS > 0 && routeTotalM > 0) {
        etaSec = routeDurationS * (remainM / routeTotalM);
      } else {
        etaSec = remainM / (navProfile === 'driving' ? 11.1 : 1.1);  // 40km/h · 4km/h
      }
      document.getElementById('nav-eta').textContent = Math.max(1, Math.round(etaSec / 60));

      // ── 다음 회전 ──
      //  ★ '창을 통과했는가' 로 판단하지 않는다. 지났으면 지난 것이다.
      //    여러 개를 한 번에 지나쳤어도 while 이 따라잡는다.
      let idx = currentStepIndex;
      while (idx < routeSteps.length - 1 && stepAlong[idx + 1] <= alongNow + 5) idx++;
      if (idx !== currentStepIndex) { currentStepIndex = idx; updateStepUI(routeSteps[idx]); }

      const next = routeSteps[currentStepIndex + 1];
      if (next) {
        const dM = Math.max(0, (stepAlong[currentStepIndex + 1] || 0) - alongNow);
        document.getElementById('turn-dist').textContent = fmtDist(dM);
        announceTurn(next, dM / 1000);
      }

      // ── 경로 이탈 ──
      //  ★ 문턱을 넘었다고 바로 다시 잡지 않는다.
      //    도심 GPS 는 30~60m 씩 튄다. 전에는 스로틀이 없어서
      //    고층 빌딩 아래를 지나면 재탐색이 계속 돌 수 있었다.
      //    (rerouteTimer 변수가 있었지만 어디에서도 값을 넣지 않는 죽은 코드였다)
      if (pr.offset > offRouteLimitM()) offStreak++; else offStreak = 0;
      const sinceReroute = Date.now() - lastRerouteAt;
      if (offStreak >= 2 && !isRerouting && sinceReroute > 15000) {
        isRerouting = true;
        lastRerouteAt = Date.now();
        offStreak = 0;
        document.getElementById('turn-dist').textContent = '재경로...';
        speak('경로를 다시 탐색합니다');
        fetchRoute(currentPos, dest).then(route => {
          if (route && route.geometry && route.geometry.coordinates.length > 1) {
            routeCoords = route.geometry.coordinates.map(([lng, lat]) => ({ lat, lng }));
            routeSteps = route.legs[0].steps;
            currentStepIndex = 0;
            spokenDistBucket = null; spokenBucketVal = null;
            buildRouteIndex(route.duration);
            updateStepUI(routeSteps[0]);
          }
          isRerouting = false;
        }).catch(() => { isRerouting = false; });
      }
    }, err => {
      // ★ 조용히 멈추지 않는다. 화면이 얼어붙었는지 내가 멈춘 건지
      //   사용자가 구분할 수 있어야 한다.
      //  ★ 위치를 못 잡은 것과 '오프라인' 은 다른 일이다.
      //    전에는 위치 오류에 setOffline(true) 를 걸어서
      //    "캐시 경로 사용 중" 이 같이 떴다 — 사실이 아니었다.
      console.warn(err.message);
      setNavFlag('gpsLost', true);
    }, trackOpts());
  }

  function stopNav() {
    // 안내를 끝냈으면 이어갈 것이 없다
    try { localStorage.removeItem('navi.active'); } catch (e) {}
    letScreenSleep();
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    stopRenderLoop();
    isRerouting = false; spokenDistBucket = null; spokenBucketVal = null;
    routeCum = []; stepAlong = []; alongNow = 0; projHint = 0;
    routeTotalM = 0; routeDurationS = 0; offStreak = 0;
    navFlags = { gpsLost: false, routeLoading: false, routeFailed: false, offline: false, approach: false };
    linkTarget = null; linkDistM = 0;
    renderNavStatus();
    mapView.pitch = 0; pitchTarget = 0;
    viewRot = 0;
    routeCoords = []; routeSteps = []; selectedDest = null; currentHeading = null;
  }

  // ── 턴 안내 ──
  function updateStepUI(step) {
    if (!step) return;
    document.getElementById('turn-arrow').textContent = getStepArrow(step);
    document.getElementById('turn-text').textContent = getStepText(step);
    document.getElementById('turn-dist').textContent = '--';
    spokenDistBucket = null;   // 새 스텝 → 안내 버킷 초기화
    spokenBucketVal = null;
  }

  // ── 음성 안내 (TTS) ──
  function speak(text) {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 1.05;
      u.volume = 1;
      speechSynthesis.speak(u);
    } catch(e) {}
  }

  // 회전 동작을 음성용 문구로
  function getStepVoice(step) {
    const m = (step && step.maneuver) || {};
    const type = m.type, mod = m.modifier || '';
    if (type === 'arrive') return '목적지에 도착했습니다';
    if (type === 'depart') return '안내를 시작합니다';
    // ★ 자동차에만 나오는 것들 (TMAP 자동차 회전코드 101~116)
    if (type === 'ramp') {
      if (mod === 'left')  return '왼쪽 고속도로 입구로 진입하세요';
      if (mod === 'right') return '오른쪽 고속도로 입구로 진입하세요';
      return '고속도로로 진입하세요';
    }
    if (type === 'exit') {
      if (mod === 'left')  return '왼쪽 출구로 나가세요';
      if (mod === 'right') return '오른쪽 출구로 나가세요';
      return '출구로 나가세요';
    }
    if (mod === 'pturn') return 'P턴 하세요';
    if (mod === 'left') return '좌회전하세요';
    if (mod === 'right') return '우회전하세요';
    if (mod === 'slight left') return '좌측 방향입니다';
    if (mod === 'slight right') return '우측 방향입니다';
    if (mod === 'sharp left') return '왼쪽으로 크게 도세요';
    if (mod === 'sharp right') return '오른쪽으로 크게 도세요';
    if (mod === 'uturn') return '유턴하세요';
    return '직진하세요';
  }

  //  ══════════════════════════════════════════
  //   거리별 사전 안내 — 차와 걸음은 필요한 거리가 다르다
  //  ══════════════════════════════════════════
  //  ★★ 전에는 둘 다 200m / 50m / 즉시였다.
  //    시속 60km 면 200m 는 **12초**다. 차선을 바꿀 시간이 안 된다.
  //    티맵·네이버가 1km 부터 알려주는 이유가 이것이다.
  //  ★ 그리고 한 번 지나간 단계로 되돌아가지 않는다.
  //    전에는 신호등에서 GPS 가 앞뒤로 흔들리면
  //    "200미터 앞 좌회전" 이 다시 나왔다.
  let spokenBucketVal = null;

  function announceTurn(step, distKm) {
    if (!step) return;
    const m = distKm * 1000;
    const car = navProfile === 'driving';
    const marks = car ? [1000, 500, 300, 100, 40] : [200, 50, 20];

    let n = null;
    for (const mk of marks) if (m <= mk) n = mk;   // 가장 작은 해당 칸
    if (n == null) return;
    if (spokenBucketVal != null && n >= spokenBucketVal) return;  // 뒤로 안 간다
    spokenBucketVal = n;
    spokenDistBucket = String(n);

    const action = getStepVoice(step);
    const nowMark = car ? 40 : 20;
    if (n <= nowMark)        speak(action);
    else if (n >= 1000)      speak('1킬로미터 앞 ' + action);
    else                     speak(n + '미터 앞 ' + action);
  }

  function getStepText(step) {
    const m = (step && step.maneuver) || {};
    const type = m.type, mod = m.modifier || '', name = step.name || '';
    if (type === 'depart') return '출발';
    if (type === 'arrive') return '목적지 도착';
    if (type === 'ramp') return `고속도로 진입${name ? ' · '+name : ''}`;
    if (type === 'exit') return `출구${name ? ' · '+name : ''}`;
    if (mod === 'pturn') return 'P턴';
    if (mod === 'left') return `좌회전${name ? ' · '+name : ''}`;
    if (mod === 'right') return `우회전${name ? ' · '+name : ''}`;
    if (mod === 'slight left') return `좌측 방향${name ? ' · '+name : ''}`;
    if (mod === 'slight right') return `우측 방향${name ? ' · '+name : ''}`;
    if (mod === 'uturn') return 'U턴';
    return name || '직진';
  }
  function getStepArrow(step) {
    const m = (step && step.maneuver) || {};
    const type = m.type, mod = m.modifier || '';
    if (type === 'arrive') return '🏁';
    if (type === 'ramp')   return mod === 'left' ? '↰' : '↱';
    if (type === 'exit')   return mod === 'left' ? '↖' : '↗';
    if (mod === 'pturn')   return '↺';
    if (mod === 'left') return '←'; if (mod === 'right') return '→';
    if (mod === 'slight left') return '↖'; if (mod === 'slight right') return '↗';
    if (mod === 'uturn') return '↩';
    return '↑';
  }

  // ── 로딩 ──
  function showLoading(t) { document.getElementById('loading-text').textContent = t; document.getElementById('loading-overlay').classList.remove('hidden'); }
  function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

  // ── 유틸 ──
  function getDistanceKm(lat1, lng1, lat2, lng2) {
    const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // ── 키보드 ──
  document.addEventListener('keydown', e => {
    startCompass();   // 첫 조작에서 나침반 권한을 얻는다 (자동 호출은 막혀 있다)
    const active = document.querySelector('.screen.active')?.id;

    if (active === 'screen-home') {
      if (e.key === 'ArrowDown') { focusHome(Math.min(focusIndex+1, homeFocusables.length-1)); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { focusHome(Math.max(focusIndex-1, 0)); e.preventDefault(); }
      else if (e.key === 'Enter') {
        if (focusIndex === 0) openSearch();
        else if (focusIndex === 1) setProfile('foot');
        else if (focusIndex === 2) setProfile('driving');
        else homeFocusables[focusIndex].click();
        e.preventDefault();
      }
    }

    if (active === 'screen-search-input') {
      const items = document.querySelectorAll('.search-result-item');
      if (e.key === 'ArrowDown') { focusSearchResult(Math.min(searchFocusIndex+1, items.length-1)); e.preventDefault(); }
      else if (e.key === 'ArrowUp') {
        if (searchFocusIndex === 0) document.getElementById('search-input').focus();
        else focusSearchResult(searchFocusIndex-1);
        e.preventDefault();
      }
      else if (e.key === 'Enter' && searchResults[searchFocusIndex]) {
        selectSearchResult(searchResults[searchFocusIndex]); e.preventDefault();
      }
      else if (e.key === 'Escape') { closeSearch(); e.preventDefault(); }
    }

    if (active === 'screen-nav') {
      if (e.key === 'Escape' || e.key === 'ArrowLeft') { stopNav(); showScreen('screen-home'); focusHome(focusIndex); e.preventDefault(); }
      // ★ 안경에는 키보드가 없다. 방향키와 Enter 만 들어온다.
      //   전에는 줌이 +/- 에 걸려 있어서 안경에서는 아예 못 썼다.
      //   걸을 때 시점보다 줌이 훨씬 자주 필요하므로 위/아래를 줌에 준다.
      else if (e.key === 'ArrowUp')   { zoomIn();  e.preventDefault(); }
      else if (e.key === 'ArrowDown') { zoomOut(); e.preventDefault(); }
      // 시점 전환(위에서 보기 ↔ 비스듬히)은 핀치로
      else if (e.key === 'Enter') {
        pitchTarget = pitchTarget > 0.5 ? 0 : 1;
        e.preventDefault();
      }
      else if (e.key === '+' || e.key === '=') { zoomIn(); e.preventDefault(); }
      else if (e.key === '-') { zoomOut(); e.preventDefault(); }
      // 음성 안내 on/off
      else if (e.key === 'ArrowRight') {
        voiceOn = !voiceOn;
        if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
        document.getElementById('turn-text').textContent = voiceOn ? '🔊 음성 안내 켜짐' : '🔇 음성 안내 꺼짐';
        if (voiceOn) speak('음성 안내를 켭니다');
        setTimeout(() => {
          if (routeSteps[currentStepIndex]) updateStepUI(routeSteps[currentStepIndex]);
        }, 1500);
        e.preventDefault();
      }
    }
  });

  // ── 검색 화면 ──
  function openSearch() {
    showScreen('screen-search-input');
    setTimeout(() => document.getElementById('search-input').focus(), 50);
  }
  function closeSearch() {
    showScreen('screen-home');
    focusHome(0);
  }

  document.getElementById('search-open-btn').addEventListener('click', openSearch);
  document.getElementById('search-back-btn').addEventListener('click', closeSearch);
  document.getElementById('back-btn').addEventListener('click', () => { stopNav(); showScreen('screen-home'); buildHome(); focusHome(0); });

  // ══════════════════════════════════════════
  //  폰에서 보낸 목적지 받기
  //  · 앱이 켜질 때 한 번 확인하고, 대기 중에는 5초마다 다시 본다.
  //  · 안내 중에는 확인하지 않는다 (경로가 중간에 바뀌면 곤란하다).
  //  · 같은 목적지를 두 번 시작하지 않도록 보낸 시각으로 구분한다.
  // ══════════════════════════════════════════
  let lastDestAt = 0;
  try { lastDestAt = parseInt(localStorage.getItem('navi.destAt')) || 0; } catch (e) {}

  function checkRelay() {
    // ★ 안내 중에도 새 목적지가 오면 바로 그리로 바꾼다.
    //   전에는 홈 화면일 때만 봤다. 그러면 안내가 한 번 시작된 뒤로는
    //   폰에서 공유해도 안경이 통째로 무시했다 — 목적지를 바꾸려면
    //   왼쪽 스와이프로 홈에 나갔다 와야 했다.
    //   목적지를 보내는 것 자체가 "여기로 가겠다" 는 뜻이므로 바로 따른다.
    //
    //   다만 검색 화면에서는 건드리지 않는다. 사용자가 지금 직접
    //   고르는 중인데 화면이 튀면 곤란하다.
    const search = document.getElementById('screen-search-input');
    if (search && search.classList.contains('active')) return;

    fetch(DEST_RELAY + '/dest', { cache: 'no-store' })
      .then(r => r.json())
      .then(d => {
        const dest = d && d.dest;
        if (!dest || !dest.at || dest.at <= lastDestAt) return;
        lastDestAt = dest.at;
        try { localStorage.setItem('navi.destAt', String(dest.at)); } catch (e) {}
        startNav({
          name: dest.name || '목적지',
          addr: dest.addr || '',
          lat: dest.lat, lng: dest.lng,
          icon: '📲',
        });
      })
      .catch(() => {});   // 릴레이가 없어도 앱은 평소대로 동작해야 한다
  }

  // ── 시작 ──
  buildHome();
  getLocation();
  startCompass();

  // ★ 안내 중에 앱이 닫혔다면 그대로 이어간다.
  //   30분이 지났으면 이어가지 않는다 — 그때는 이미 다른 곳에 있을 것이다.
  //   ※ 위치를 먼저 잡아야 경로를 계산할 수 있어서 조금 기다린다.
  (function resumeNav() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('navi.active') || 'null'); } catch (e) {}
    if (!saved || !saved.dest || !saved.at) return;
    if (Date.now() - saved.at > 30 * 60 * 1000) {
      try { localStorage.removeItem('navi.active'); } catch (e) {}
      return;
    }
    let waited = 0;
    const t = setInterval(() => {
      waited += 300;
      if (currentPos) { clearInterval(t); startNav(saved.dest); }
      else if (waited >= 9000) { clearInterval(t); startNav(saved.dest); }  // 위치가 늦어도 시도한다
    }, 300);
  })();

  checkRelay();
  setInterval(checkRelay, 5000);
</script>
</body>
</html>
