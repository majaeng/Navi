<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="meta-mrbd-web-app-capable" content="yes">
<title>중한 실시간 번역 (음성 직접)</title>
<style>
  :root {
    --safe: 24px;
    --fs: 24px;
    --money: #ffc95a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
                 'Noto Sans KR', sans-serif;
    overflow: hidden;
  }
  .wrap { position: relative; width: 100%; height: 100%; padding: var(--safe); }

  .top {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; color: rgba(255,255,255,0.55);
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #666; flex: none;
  }
  .dot.on { background: #4a9eff; }
  .dot.err { background: #ff5a5a; }

  /* 번역문 — 화면의 주인공 */
  .trans {
    margin-top: 18px;
    font-size: var(--fs); line-height: 1.45; font-weight: 600;
    white-space: pre-wrap; word-break: break-word;
    height: calc(var(--fs) * 1.45 * 11);
    overflow: hidden;
  }
  /* 아직 말하는 중인 부분은 흐리게 — 확정된 앞부분은 밝기가 안 바뀐다 */
  .trans .tail { color: rgba(255,255,255,0.72); }

  /* 원문 (참고용, 작게) */
  .src {
    position: absolute; left: var(--safe); right: var(--safe);
    bottom: calc(var(--safe) + 34px);
    font-size: 14px; color: rgba(255,255,255,0.32);
    white-space: pre-wrap; word-break: break-word;
    max-height: 44px; overflow: hidden;
  }

  .stat {
    position: absolute; left: var(--safe); bottom: var(--safe);
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    color: rgba(255,255,255,0.5);
    white-space: pre-wrap; line-height: 1.6;
    right: var(--safe);
  }
  .stat b { color: #8effa8; font-weight: 400; }
  .stat .err { color: #ff8080; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="dot" id="dot"></span>
    <span id="status">Enter 를 눌러 시작</span>
  </div>

  <div class="trans" id="trans"></div>
  <div class="src" id="src"></div>
  <div class="stat" id="stat"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  음성 → 한국어 직접 번역 (gpt-realtime-translate)
//
//  지금 쓰는 cn-translate.html 과 비교하려고 만든 별도 페이지다.
//  구조가 완전히 다르다:
//
//   기존:  소리 → (AssemblyAI) 중국어 글자 → (하이쿠) 한국어 글자
//   여기:  소리 → 한국어 글자         ... 한 번에
//
//  그래서 우리가 만든 문장 끊기 규칙이 전혀 필요 없다.
//  언제 끊을지는 모델이 알아서 한다.
// ══════════════════════════════════════════════════════

const TOKEN_URL = 'https://openai-live.majaeng.workers.dev';
const LANG = new URLSearchParams(location.search).get('lang') || 'ko';

const $dot    = document.getElementById('dot');
const $status = document.getElementById('status');
const $trans  = document.getElementById('trans');
const $src    = document.getElementById('src');
const $stat   = document.getElementById('stat');

const MAX_LINES = 11;

let pc = null;
let stream = null;
let running = false;

let lines = [];        // 확정된 줄
let live = '';         // 지금 들어오는 중인 글
let srcText = '';      // 원문 (참고용)

// 측정: 말이 시작되고 첫 한국어 글자가 뜰 때까지
let speechAt = 0;
let firstAt = 0;
let sessionAt = 0;
const firstTimes = [];

function setStatus(t, kind) {
  $status.textContent = t;
  $dot.className = 'dot' + (kind === 'on' ? ' on' : kind === 'err' ? ' err' : '');
}

function render() {
  $trans.textContent = '';
  if (lines.length) $trans.append(document.createTextNode(lines.join('\n')));
  if (live) {
    if (lines.length) $trans.append(document.createTextNode('\n'));
    const s = document.createElement('span');
    s.className = 'tail';
    s.textContent = live;
    $trans.append(s);
  }
  $src.textContent = srcText.slice(-120);
}

// ── 진단 ──
// 왜 멈추는지 알려면 상태를 눈으로 봐야 한다.
let connState = '-';
let chanState = '-';
let evCount = 0;
let lastEv = '-';
let lastErr = '';
const evSeen = {};
// ★ 실제로 어떤 모양으로 오는지 한 번은 눈으로 봐야 한다.
//   필드 이름을 짐작해서 ev.delta 로 읽었는데 화면이 비어 있었다.
let sampleEv = '';
// ★ 마이크에 소리가 들어오는지 눈으로 봐야 한다.
//   이게 없어서, 모델이 약한 소음을 듣고 지어낸 "좋아요," 를
//   번역이 되는 줄 알고 한참 헤맸다.
let micLevel = 0;
let micPeak = 0;
let audioCtx = null;
// 최근 이벤트를 그대로 남긴다. 무엇이 오다 멈췄는지 이걸로 본다.
const evLog = [];
function logEv(ev) {
  const t = (ev.type || '?').replace(/^session\./, '');
  let extra = '';
  if (typeof ev.delta === 'string') extra = ' ' + JSON.stringify(ev.delta.slice(0, 20));
  else if (ev.error) extra = ' ' + JSON.stringify(ev.error).slice(0, 80);
  const at = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  evLog.push(`${at} ${t}${extra}`);
  while (evLog.length > 8) evLog.shift();
}

function renderStat() {
  const avg = firstTimes.length
    ? Math.round(firstTimes.reduce((a, b) => a + b, 0) / firstTimes.length)
    : 0;
  const kinds = Object.keys(evSeen).slice(-6)
    .map(k => `${k.replace('session.', '')}×${evSeen[k]}`).join(' ');
  $stat.innerHTML =
    `모델 <b>gpt-realtime-translate</b>   언어 <b>${LANG}</b>   ` +
    `연결 <b>${sessionAt ? Math.round(sessionAt) : '-'}</b>ms   ` +
    `첫글자 <b>${avg || '-'}</b>ms (${firstTimes.length}회)\n` +
    `마이크 ${'█'.repeat(Math.min(20, Math.round(micLevel * 400)))||'·'} ` +
    `<b>${micLevel.toFixed(4)}</b> (최대 <b>${micPeak.toFixed(4)}</b>)\n` +
    `상태 <b>${connState}</b> / 채널 <b>${chanState}</b>   받은이벤트 <b>${evCount}</b>   ` +
    `마지막 <b>${lastEv}</b>\n` +
    (kinds ? `종류 ${kinds}\n` : '') +
    (sampleEv ? `원본 ${sampleEv}\n` : '') +
    (evLog.length ? evLog.join('\n') + '\n' : '') +
    (lastErr ? `<span class="err">${lastErr}</span>` : '');
}
setInterval(renderStat, 500);

// ══════════════════════════════════════════
//  줄 나누기
// ══════════════════════════════════════════
//  이 모델은 마침표를 찍지 않는다. 대신 한 덩어리가 끝나면
//  session.output_transcript.done 을 보내주므로 그때 줄을 바꾼다.
//  ※ 우리가 중국어를 끊을 필요는 없다. 그건 모델이 한다.
//    여기서 하는 건 '읽기 좋게 줄을 나누는 것'뿐이다.
const LINE_MAX = 42;   // 이보다 길어지면 화면을 넘어가니 중간에라도 나눈다

function pushLine(t) {
  const s = (t || '').trim();
  if (!s) return;
  lines.push(s);
  while (lines.length > MAX_LINES) lines.shift();
}

/// 지금 쌓인 글을 확정 줄로 넘긴다
function commitLive() {
  if (!live.trim()) { live = ''; return; }
  // 너무 길면 어절 경계에서 나눈다
  let rest = live.trim();
  while (rest.length > LINE_MAX) {
    let cut = rest.lastIndexOf(' ', LINE_MAX);
    if (cut < LINE_MAX * 0.5) cut = LINE_MAX;   // 띄어쓰기가 없으면 그냥 자른다
    pushLine(rest.slice(0, cut));
    rest = rest.slice(cut).trim();
  }
  pushLine(rest);
  live = '';
}

// 마침표가 찍히는 경우도 있으니 그때는 바로 나눈다
function commitIfSentence() {
  const m = live.match(/^(.*?[.!?。！？])\s*(.*)$/s);
  if (m) {
    pushLine(m[1]);
    live = m[2] || '';
    return;
  }
  // 마침표 없이 계속 길어지면 화면을 넘어가므로 중간에 나눈다
  if (live.length > LINE_MAX * 2) {
    const cut = live.lastIndexOf(' ', LINE_MAX);
    if (cut > LINE_MAX * 0.5) {
      pushLine(live.slice(0, cut));
      live = live.slice(cut).trim();
    }
  }
}

// 끊기면 다시 붙는다. 회의 중에 한 번 끊겼다고 끝나면 안 된다.
let retryTimer = null;
let retryCount = 0;

// ★ 다시 시도해도 소용없는 오류가 있다.
//   요금제·권한 문제(4xx)는 몇 번을 붙어도 같은 답이 온다.
//   실제로 429(한도 초과)를 받고도 0.8초마다 계속 붙어서
//   콘솔에 같은 오류가 열 번 찍혔다.
let fatal = false;
// ★ 우리가 직접 닫은 것인지 구분한다.
//   이게 없으면 teardown() 이 부른 onclose 를 '끊김' 으로 오해해
//   재연결을 걸고, 그게 또 teardown 을 불러 끝없이 돈다.
//   (실측: 세션이 4개까지 만들어졌다)
let closing = false;

function scheduleRetry() {
  if (retryTimer || !running || fatal) return;
  retryCount++;
  if (retryCount > 5) {
    lastErr += ' — 다섯 번 실패해서 멈춥니다';
    stop();
    return;
  }
  // 붙을수록 간격을 늘린다
  const wait = Math.min(800 * Math.pow(2, retryCount - 1), 8000);
  setStatus(`끊김 — ${Math.round(wait / 1000)}초 뒤 재연결 (${retryCount}/5)`, 'err');
  retryTimer = setTimeout(async () => {
    retryTimer = null;
    if (!running) return;
    // 화면의 글자는 지우지 않는다. 연결만 새로 만든다.
    teardown();
    await connect();
  }, wait);
}

function teardown() {
  closing = true;
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  connState = '-'; chanState = '-';
}

async function start() {
  if (running) return;
  running = true;
  retryCount = 0; fatal = false;
  lines = []; live = ''; srcText = '';
  render();
  await connect();
}

// 연결만 담당한다 (재연결 때 화면을 지우지 않으려고 분리했다)
async function connect() {
  try {
    setStatus('토큰 받는 중…');
    const t0 = performance.now();
    const r = await fetch(TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ language: LANG }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const secret = data.secret;

    setStatus('마이크 여는 중…');
    stream = await navigator.mediaDevices.getUserMedia({
      // ★ echoCancellation 은 반드시 꺼야 한다.
      //   켜두면 브라우저가 "스피커에서 나온 소리"로 판단해 지워버린다.
      //   스피커로 중국어를 재생해 시험할 때 마이크에 아무것도 안 들어간다.
      //   (기존 앱에도 같은 주석이 있는데 이 파일에 옮겨오지 않아 또 겪었다)
      //   autoGainControl 은 켠다 — 끄면 내장 마이크 입력이 너무 작다.
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: true,
      },
    });

    // 마이크 음량 측정 (보내는 것과 같은 소리를 그대로 잰다)
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      const src = audioCtx.createMediaStreamSource(stream);
      const an = audioCtx.createAnalyser();
      an.fftSize = 1024;
      src.connect(an);
      const buf = new Float32Array(an.fftSize);
      const tick = () => {
        if (!stream) return;
        an.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        micLevel = Math.sqrt(sum / buf.length);
        if (micLevel > micPeak) micPeak = micLevel;
        requestAnimationFrame(tick);
      };
      tick();
    } catch (e) { lastErr = '음량 측정 실패: ' + e.message; }

    setStatus('연결 중…');
    closing = false;
    // ※ 이번 연결을 지역 변수로 잡아둔다.
    //   await 사이에 재연결이 끼어들어 pc 가 바뀌면
    //   옛 절차가 새 연결을 건드리거나 null 을 만져 터진다.
    const myPc = new RTCPeerConnection();
    pc = myPc;
    myPc.addTrack(stream.getAudioTracks()[0], stream);

    // 번역된 음성도 돌아온다. 자막만 쓸 것이므로 재생하지 않는다.
    // (안경에서는 이걸 스피커로 내보내는 선택도 가능하다)
    myPc.ontrack = () => {};

    // 연결이 왜 끊기는지 보이게 한다
    myPc.onconnectionstatechange = () => {
      if (pc !== myPc) return;          // 이미 교체된 옛 연결이다
      connState = myPc.connectionState;
      if (connState === 'failed' || connState === 'disconnected') {
        if (closing) return;            // 우리가 닫은 것이다
        lastErr = '연결 끊김 (' + connState + ')';
        if (running) scheduleRetry();
      }
    };
    myPc.oniceconnectionstatechange = () => {
      if (pc === myPc && myPc.iceConnectionState === 'failed') lastErr = 'ICE 실패';
    };

    const ch = myPc.createDataChannel('oai-events');
    ch.onopen  = () => { if (pc === myPc) chanState = 'open'; };
    ch.onclose = () => {
      if (pc !== myPc || closing) return;   // 우리가 닫았거나 옛 연결이다
      chanState = 'closed';
      if (running) { lastErr = '채널이 닫힘'; scheduleRetry(); }
    };
    ch.onerror = (e) => { lastErr = '채널 오류'; };

    ch.onmessage = (e) => {
      let ev;
      try { ev = JSON.parse(e.data); } catch (err) { return; }

      evCount++;
      lastEv = ev.type || '?';
      evSeen[lastEv] = (evSeen[lastEv] || 0) + 1;
      logEv(ev);

      // ★ 이벤트 이름에 'session.' 이 붙는 것과 안 붙는 것이 섞여 있다.
      //   문서 예제만 보고 전부 붙는다고 가정했다가, 번역이 198개나
      //   도착했는데 화면이 비어 있었다. 접두사를 떼고 비교한다.
      const kind = (ev.type || '').replace(/^session\./, '');

      // 한국어 번역이 조각조각 도착한다
      if (kind === 'output_transcript.delta' && !sampleEv) {
        sampleEv = JSON.stringify(ev).slice(0, 260);
      }

      if (kind === 'output_transcript.delta') {
        if (speechAt && !firstAt) {
          firstAt = performance.now();
          const d = Math.round(firstAt - speechAt);
          firstTimes.push(d);
          if (firstTimes.length > 10) firstTimes.shift();
        }
        // 필드 이름이 무엇이든 글자를 찾아낸다
        const piece = (typeof ev.delta === 'string' ? ev.delta : '')
          || (ev.delta && typeof ev.delta.text === 'string' ? ev.delta.text : '')
          || (typeof ev.text === 'string' ? ev.text : '')
          || (typeof ev.transcript === 'string' ? ev.transcript : '');
        live += piece;
        commitIfSentence();
        render();
      }

      // 원문(중국어)도 함께 온다 — 인식이 맞는지 눈으로 확인하는 용도
      if (kind === 'input_transcript.delta') {
        if (!speechAt) { speechAt = performance.now(); firstAt = 0; }
        srcText += (typeof ev.delta === 'string' ? ev.delta : '')
          || (typeof ev.text === 'string' ? ev.text : '')
          || (typeof ev.transcript === 'string' ? ev.transcript : '');
        if (srcText.length > 400) srcText = srcText.slice(-400);
        render();
      }

      // 한 문장이 끝났다 — 다음 문장의 지연을 새로 재기 위해 초기화
      // ★ 한 덩어리가 끝났다는 신호. 여기서 줄을 바꾼다.
      //   이 모델은 마침표를 찍지 않으므로 글자만 보고는 끊을 자리를 알 수 없다.
      //   (그래서 처음엔 "준비해봤는데지금 이 계획대로" 처럼 다 붙어 나왔다)
      if (kind === 'output_transcript.done') {
        commitLive();
        speechAt = 0; firstAt = 0;
        render();
      }

      if (kind === 'input_transcript.done') {
        speechAt = 0; firstAt = 0;
        srcText += '\n';
      }

      if (kind === 'error' || ev.error) {
        // ※ 오류 내용을 잘라내지 않는다. 줄이면 원인을 못 찾는다.
        lastErr = '오류: ' + (ev.error?.message || JSON.stringify(ev).slice(0, 200));
        setStatus('오류 — 아래 참조', 'err');
      }
    };

    const offer = await myPc.createOffer();
    await myPc.setLocalDescription(offer);
    if (pc !== myPc) return;   // 그새 새 연결로 교체됐다

    const sdpRes = await fetch(
      'https://api.openai.com/v1/realtime/translations/calls',
      {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${secret}`,
          'Content-Type': 'application/sdp',
        },
        body: offer.sdp,
      }
    );
    if (!sdpRes.ok) {
      const body = (await sdpRes.text()).slice(0, 300);
      // 요금제·권한 문제는 다시 시도해도 같은 답이 온다. 이유를 그대로 보여준다.
      if (sdpRes.status === 429) {
        fatal = true;
        throw new Error(
          '429 — OpenAI 사용 한도. gpt-realtime-translate 는 무료 등급에서 지원되지 않습니다. ' +
          '결제 설정에서 $5 이상 충전하면 Tier 1 이 되어 풀립니다. ' + body);
      }
      if (sdpRes.status === 401 || sdpRes.status === 403) {
        fatal = true;
        throw new Error(sdpRes.status + ' — 키 권한 문제. ' + body);
      }
      throw new Error('연결 실패 ' + sdpRes.status + ': ' + body);
    }

    if (pc !== myPc) return;   // 응답을 기다리는 사이에 교체됐다
    await myPc.setRemoteDescription({ type: 'answer', sdp: await sdpRes.text() });

    sessionAt = performance.now() - t0;
    lastErr = ''; retryCount = 0; fatal = false;
    setStatus('듣는 중 · Enter 정지', 'on');
  } catch (e) {
    // ※ 여기서 통째로 멈추면 안 된다. 한 번 실패했다고 회의가 끝나지 않는다.
    lastErr = String(e.message || e);
    if (running) scheduleRetry();
    else setStatus(lastErr, 'err');
  }
}

function stop() {
  running = false;
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  teardown();
  setStatus('정지됨 · Enter 로 시작');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    running ? stop() : start();
    e.preventDefault();
  }
  if (e.key === 'Escape') {
    lines = []; live = ''; srcText = ''; render();
    e.preventDefault();
  }
});

render();
renderStat();
</script>
</body>
</html>
