    ko: '청두에 4개월 계신다니 실질적으로 도움될 만한 것들을 말씀드릴게요. 먼저 음식인데, 청두의 매운맛과 한국의 매운맛은 완전히 다릅니다. 여기는 마(麻)를 중시하는데 화자오가 주는 혀가 얼얼해지는 느낌이에요. 처음 드시는 외국인은 대부분 못 견디니 주문하실 때 꼭 덜 맵게 또는 안 맵게 해달라고 하세요. 직원이 이상하게 생각하지 않습니다. 다음은 날씨입니다. 청두는 일 년 중 맑은 날이 많지 않고 봄가을은 괜찮지만 여름은 무덥고 겨울은 습하고 춥습니다. 습도가 연중 70% 이상이라 한국에서 오시면 빨래가 잘 안 마른다고 느끼실 거예요. 제습기 하나 사시길 권합니다. 교통은 지하철이 아주 편해서 시내는 거의 다 갈 수 있고, 택시는 디디를 쓰시면 길에서 잡는 것보다 싸고 안전합니다. 생활 면에서는 현지 유심을 하나 만드시고 위챗과 알리페이에 연동하셔야 합니다. 여기는 거의 모든 곳이 QR 결제라 현금은 잘 안 쓰고, 작은 가게는 거스름돈도 없는 경우가 있어요. 마지막으로 주말에 시간 되시면 근교를 둘러보세요. 칭청산과 두장옌은 고속철로 한 시간이면 가고 경치가 꽤 좋습니다.',

const $list = document.getElementById('list');
const $voice = document.getElementById('voice');
const $rate = document.getElementById('rate');
const $rateVal = document.getElementById('rate-val');
const $warn = document.getElementById('warn');
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => /^zh/i.test(v.lang));
  $voice.innerHTML = '';
  if (!voices.length) { $warn.style.display = 'block'; return; }
  $warn.style.display = 'none';
  voices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `${v.name} (${v.lang})`;
    $voice.appendChild(o);
  });
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

$rate.addEventListener('input', () => { $rateVal.textContent = $rate.value; });

function speak(text, card) {
  speechSynthesis.cancel();
  document.querySelectorAll('.item').forEach(el => el.classList.remove('playing'));
  const u = new SpeechSynthesisUtterance(text);
  const v = voices[$voice.value];
  if (v) u.voice = v;
  u.lang = 'zh-CN';
  u.rate = parseFloat($rate.value);
  u.onstart = () => card.classList.add('playing');
  u.onend = () => card.classList.remove('playing');
  speechSynthesis.speak(u);
}

SENTENCES.forEach(s => {
  const card = document.createElement('div');
  card.className = 'item';
  card.innerHTML = `
    <span class="tag">${s.tag}</span>
    <div class="cn">${s.cn}</div>
    <div class="ko">기대 번역 · ${s.ko}</div>
    <div class="row">
      <button class="primary">재생</button>
      <span class="len">${s.cn.length}자 · 약 ${Math.round(s.cn.length * 0.18)}초</span>
    </div>`;
  card.querySelector('button').addEventListener('click', () => speak(s.cn, card));
  $list.appendChild(card);
});

const $now = document.getElementById('now');
let queue = [];

// 대화가 이어지는 상황 재현 — 문장 사이 2초 간격
function playQueue() {
  if (!queue.length) { $now.textContent = ''; return; }
  const { s, card } = queue.shift();
  $now.textContent = `${s.tag} (남은 ${queue.length}개)`;
  speechSynthesis.cancel();
  document.querySelectorAll('.item').forEach(el => el.classList.remove('playing'));

  const u = new SpeechSynthesisUtterance(s.cn);
  const v = voices[$voice.value];
  if (v) u.voice = v;
  u.lang = 'zh-CN';
  u.rate = parseFloat($rate.value);
  u.onstart = () => {
    card.classList.add('playing');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  u.onend = () => {
    card.classList.remove('playing');
    setTimeout(playQueue, 2000);   // 다음 발화까지 잠시 쉼
  };
  speechSynthesis.speak(u);
}

document.getElementById('play-all').addEventListener('click', () => {
  const cards = [...document.querySelectorAll('.item')];
  queue = SENTENCES.map((s, i) => ({ s, card: cards[i] }));
  playQueue();
});

document.getElementById('stop').addEventListener('click', () => {
  queue = [];
  $now.textContent = '';
  speechSynthesis.cancel();
  document.querySelectorAll('.item').forEach(el => el.classList.remove('playing'));
});
</script>
</body>
</html>
