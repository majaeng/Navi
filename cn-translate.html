<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>중한 실시간 번역</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 600px; height: 600px;
      background: #000; color: #fff; overflow: hidden;
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    /* ══════════════════════════════════════════
       가산 디스플레이 원칙:
       · 검정 = 투명. 채워진 배경은 바깥 시야를 가리므로 쓰지 않음
       · 가장자리는 왜곡·감광 구간이므로 안전 영역(54px)을 비움
       · 정보는 밝기 단계로 구분 (테두리·배경 대신 명암으로)
       ══════════════════════════════════════════ */

    :root {
      /* 메타 공식 가이드라인: 안전 여백 8dp (전체화면 앱 24dp) */
      --safe: 24px;
      --fs: 24px;                /* 번역 글자 크기 — 상/하 스와이프로 조절 */
      --ink-1: #fff;             /* 주 정보 */
      --ink-2: rgba(255,255,255,0.40);
      --ink-3: rgba(255,255,255,0.22);
      --accent: #7db8ff;
      --money: #ffc95a;
    }

    #app {
      width: 600px; height: 600px;
      position: relative;
      padding: var(--safe);
    }

    /* ── 상단: 상태 (점 + 최소 텍스트) ── */
    .status {
      position: absolute; top: var(--safe); left: var(--safe);
      display: flex; align-items: center; gap: 9px;
      cursor: pointer;                     /* 브라우저 테스트용 */
      padding: 6px 10px; margin: -6px -10px;  /* 클릭 영역만 넓힘 */
    }
    /* 조작 힌트 — 아주 낮은 대비로 상시 표시 */
    .status-key {
      font-size: 13px; color: var(--ink-3);
      letter-spacing: 0.2px;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.3); transition: background 300ms;
      flex-shrink: 0;
    }
    .status-dot.listening { background: var(--accent); animation: blink 1.6s infinite; }
    .status-dot.translating { background: #8effa8; }
    .status-text {
      font-size: 15px; color: var(--ink-2);
      letter-spacing: 0.2px;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* 엔진 표시 — 우상단, 아주 낮은 대비 */
    .engine {
      position: absolute; top: var(--safe); right: var(--safe);
      font-size: 13px; color: var(--ink-3); letter-spacing: 0.4px;
    }
    .engine.hq { color: rgba(141,255,168,0.45); }

    /* ── 중앙: 번역 영역 ── */
    .stage {
      position: absolute; top: 50%; left: var(--safe); right: var(--safe);
      transform: translateY(-50%);
    }

    /* 번역 창 — 자막처럼 3줄만 보이고 위로 흘러감.
       위쪽은 서서히 사라지게 해서 읽는 흐름을 방해하지 않는다. */
    /* 원문·용어·이전번역 줄을 없애고 그 공간을 번역에 넘김 */
    .hidden-refs { display: none; }

    .trans-window {
      height: calc(var(--fs) * 1.45 * 10);
      overflow: hidden;
      scroll-behavior: smooth;
      /* 위쪽을 살짝만 흐리게 — 과하면 글자가 잘린 것처럼 보인다 */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 9%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 9%);
    }

    /* 번역 한국어 (주 정보) */
    .translated-text {
      font-size: var(--fs); font-weight: 600; color: var(--ink-1);
      line-height: 1.45; word-break: keep-all;
      letter-spacing: -0.3px;
      transition: color 250ms;
      white-space: pre-wrap;      /* 발화 구분 줄바꿈 반영 */
    }
    .translated-text.empty {
      color: var(--ink-3); font-weight: 400; font-size: 19px;
      letter-spacing: 0;
    }
    /* 아직 확정되지 않은 꼬리 부분만 살짝 흐리게.
       확정된 앞부분은 밝기가 바뀌지 않아 깜빡임이 없다. */
    .translated-text .tail { color: rgba(255,255,255,0.72); }

    /* ── 하단: 환율 (테두리 없이 텍스트만) ── */
    .currency {
      position: absolute; bottom: var(--safe); left: var(--safe);
      display: none; align-items: baseline; gap: 10px;
    }
    .currency.show { display: flex; }
    .currency-cny { font-size: 16px; color: rgba(255,201,90,0.5); }
    .currency-krw { font-size: 25px; font-weight: 600; color: var(--money); }

    /* 진단 패널 (D키) — 기본 숨김 */
    .debug {
      position: absolute; left: var(--safe); right: var(--safe); bottom: var(--safe);
      font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      color: rgba(255,255,255,0.6); line-height: 1.65;
      display: none; text-align: left; white-space: pre-wrap;
    }
    .debug.show { display: block; }
    .debug b { color: #8effa8; font-weight: 400; }
    .debug .err { color: #ff9a9a; }

    /* 알림 — 배경 없이 글자만 */
    .toast {
      position: absolute; bottom: var(--safe); right: var(--safe);
      font-size: 14px; color: #ff9a9a;
      opacity: 0; transition: opacity 300ms; pointer-events: none;
      text-align: right; max-width: 60%;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div id="app">

  <!-- 상태 (좌상단) · 클릭하면 시작·정지 -->
  <div class="status" id="status" onclick="toggleListen()">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-text" id="status-text">준비</span>
    <span class="status-key" id="status-key">· Enter 시작</span>
  </div>

  <!-- 엔진 (우상단) -->
  <div class="engine hq" id="engine-pill">AAI</div>

  <!-- 번역 영역 -->
  <!-- 번역 영역 — 화면 전체를 번역이 사용 -->
  <div class="stage">
    <div class="trans-window" id="trans-window">
      <div class="translated-text empty" id="translated-text">중국어를 말하면 번역됩니다</div>
    </div>
  </div>

  <!-- 진단용 (D키로만 보임) -->
  <div class="hidden-refs">
    <span id="prev-text"></span>
    <span id="terms"></span>
    <span id="original-text"></span>
  </div>

  <!-- 환율 -->
  <div class="currency" id="currency-badge">
    <span class="currency-cny" id="currency-cny"></span>
    <span class="currency-krw" id="currency-krw"></span>
  </div>

  <div class="debug" id="debug"></div>
  <div class="toast" id="toast"></div>
</div>

<!-- 용어 사전 (별도 파일 — 여기만 수정하면 됨) -->
<script src="glossary.js"></script>
<script>
  const PAPAGO_PROXY = 'https://papago-proxy.majaeng.workers.dev';
  const ER_API = 'https://open.er-api.com/v6/latest/CNY';

  // ── AssemblyAI 토큰 프록시 (고정밀 모드) ──
  // ⚠️ 아직 미설정: Cloudflare Worker 만든 뒤 아래 주소를 채우면 활성화됨
  const AAI_TOKEN_PROXY = 'https://aai-token.majaeng.workers.dev';
  const AAI_WS = 'wss://streaming.assemblyai.com/v3/ws';
  const AAI_MODEL = 'universal-3-5-pro';   // 중국어(Mandarin) 지원 모델
  const SAMPLE_RATE = 16000;

  // ── iFlytek 인증 프록시 (메인 엔진) ──
  // ⚠️ 아직 미설정: Worker 만든 뒤 아래 주소를 채우면 활성화됨
  const IFLYTEK_AUTH_PROXY = 'https://iflytek-auth.majaeng.workers.dev';

  // 엔진 우선순위: iflytek → aai → browser (앞이 실패하면 다음으로)
  let sttMode = 'aai';
  const confLog = [];        // 최근 턴들의 인식 신뢰도 (기준값 조정용)
  // 중국어가 아닌 말을 걸러내는 기준. 시끄러운 곳에서 진짜 중국어가
  // 잘리면 낮추고, 엉뚱한 번역이 새어 나오면 올린다.
  // (CONF_MIN 제거 — 언어 판정으로 대체)
  let flySocket = null;
  let flyFirstFrame = true;
  let flySlices = [];              // wpgs 스트리밍 결과 조각들
  let flyCarry = new Uint8Array(0);  // 프레임 경계에 걸친 잔여 바이트
  let flyPending = null;             // 중간결과 번역 디바운스
  let flyPreroll = [];               // 세션 열리기 직전 음성 보관
  let flyOpening = false;            // 세션 여는 중 중복 방지
  let flyOpenGuard = null;           // 연결 지연 시 플래그 해제
  let flyQuietSince = 0;
  let noiseFloor = 0;                // 주변 소음 수준 (자동 학습)
  const VOICE_FLOOR = 0.012;         // 최소 판정선 (이보다 작으면 소음으로 간주)
  let voiceRun = 0;                  // 연속으로 기준을 넘은 프레임 수
  const VOICE_RUN_MIN = 2;           // 약 0.5초 이상 이어져야 말소리로 인정
                                     // (더 키우면 시작이 눈에 띄게 늦어진다)
  let gain = 1;                      // 소프트웨어 증폭 배율
  let peakTracker = 0;               // 최근 최대 진폭
  const TARGET_PEAK = 0.35;          // 증폭 목표 레벨
  const MAX_GAIN = 12;               // 최대 증폭 배율 (높이면 잡음까지 커져 인식 방해)
  // 세션이 끊긴 사이의 음성만 보관한다.
  // 너무 크게 잡으면 이미 처리된 음성까지 다시 보내 중복 번역이 된다.
  const PREROLL_CHUNKS = 6;          // 약 1.5초 분량
  let flyReopen = null;            // 세션 재연결 타이머
  let flyRotate = null;            // 60초 만료 전 교대 타이머
  let flyAppId = '';
  const FLY_FRAME_BYTES = 1280;    // iFlytek 규격
  let aaiSocket = null;
  let audioCtx = null;
  let mediaStream = null;
  let procNode = null;
  let srcNode = null;

  let recognition = null;
  let isListening = false;
  let translateTimer = null;
  let lastOriginal = '';
  let lastTranslated = '';
  let lastSent = '';               // 같은 문장 중복 번역 방지
  // ── 표시 상태 ──
  // 문장을 쪼개지 않는다. 말하는 중인 문장 하나를 통째로 번역해 교체하고,
  // 끝나면 확정해서 위로 올린다.
  let lines = [];            // 확정된 문장들 (더는 바뀌지 않음)
  let inFlight = 0;
  const MAX_LINES = 14;      // 화면에 유지할 확정 문장 수
  let liveSeq = 0;           // 미리보기 세대 번호
  let liveText = '';         // 말하는 중인 문장의 번역(흐린 줄)
  let lastCommitAt = 0;      // 마지막으로 화면에 올린 시각
  const SAME_LINE_MS = 3000; // 이 안에 이어지면 같은 줄로 본다
  const MIN_SOLID = 4;             // 이보다 짧은 조각은 소음으로 보고 버림
  // ── 긴 발화 분할 ──
  // 누적 전체를 매번 번역하면 길어질수록 느려져 타임아웃이 난다.
  // 끝난 문장만 떼어 번역하고 결과를 이어 붙인다.
  const SENT_END = /[。！？；…]/;    // 문장 끝 (가장 좋은 분할점)
  const CLAUSE_END = /[，、]/;      // 절 끝 (차선책)
  // 값이 작을수록 빠르고, 클수록 문맥이 살아난다.
  const REVEAL_MS = 50;            // 글자가 드러나는 간격 (작을수록 빠름)
  let voiceAt = 0;                 // 말이 시작된 시각 (지연 측정용)
  let papagoFails = 0;             // 파파고 연속 실패 횟수
  let papagoBlockedAt = 0;         // 파파고를 건너뛰기 시작한 시각
  let flytekMtBroken = false;      // iFlytek 번역 사용 불가 (미구독 등)
  const PAPAGO_BACKOFF_MS = 4000;  // 이 시간 동안만 보조 엔진을 먼저 시도
  let cnyToKrw = null; // 환율 캐시

  // ── 환율 로드 (앱 시작시 1회) ──
  async function loadRate() {
    try {
      const res = await fetch(ER_API);
      const data = await res.json();
      cnyToKrw = data?.rates?.KRW;
    } catch(e) {}
  }
  loadRate();

  // ── 환율 변환 ──
  // 중국어 숫자 단위 파싱 (万=10000, 千=1000, 百=100, 十=10)
  const CN_NUM = {'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'两':2};
  const CN_UNIT = {'十':10,'百':100,'千':1000,'万':10000,'亿':100000000};

  function parseChinese(s) {
    let result = 0, cur = 0, tmp = 0;
    for (const c of s) {
      if (CN_NUM[c] !== undefined) { tmp = CN_NUM[c]; }
      else if (CN_UNIT[c] !== undefined) {
        const u = CN_UNIT[c];
        if (u >= 10000) { result = (result + cur + tmp) * u; cur = 0; tmp = 0; }
        else { cur += (tmp || 1) * u; tmp = 0; }
      }
    }
    return result + cur + tmp;
  }

  function detectAmount(text) {
    // 아라비아 숫자 + 위안 단위
    const arabicMatch = text.match(/(\d+(?:\.\d+)?)\s*(?:块|元|人民币|块钱|元钱)/);
    if (arabicMatch) return parseFloat(arabicMatch[1]);

    // 한자 숫자 + 위안 단위
    const cnMatch = text.match(/([零一二三四五六七八九两十百千万亿]+)\s*(?:块|元|人民币|块钱|元钱)/);
    if (cnMatch) {
      const val = parseChinese(cnMatch[1]);
      if (val > 0) return val;
    }
    return null;
  }

  function showCurrency(cny) {
    if (!cnyToKrw || !cny) { hideCurrency(); return; }
    const krw = Math.round(cny * cnyToKrw);
    document.getElementById('currency-cny').textContent = `¥${cny.toLocaleString()}`;
    document.getElementById('currency-krw').textContent = `${krw.toLocaleString()}원`;
    document.getElementById('currency-badge').classList.add('show');
  }

  function hideCurrency() {
    document.getElementById('currency-badge').classList.remove('show');
  }

  // ── UI 참조 ──
  const $dot    = document.getElementById('status-dot');
  const $status = document.getElementById('status-text');
  const $key    = document.getElementById('status-key');
  const $orig   = document.getElementById('original-text');
  const $trans  = document.getElementById('translated-text');
  const $prev   = document.getElementById('prev-text');
  // 마이크 버튼은 안경에 터치가 없어 제거됨.
  // 기존 호출부를 그대로 두기 위한 빈 대체 객체.
  const $btn = { classList: { add(){}, remove(){} }, set textContent(v){}, get textContent(){ return ''; } };
  const $toast  = document.getElementById('toast');

  // ── 상태 업데이트 ──
  function setStatus(state, text) {
    $dot.className = 'status-dot' + (state ? ' ' + state : '');
    $status.textContent = text;
    // 지금 무엇을 할 수 있는지 항상 표시
    if ($key) $key.textContent = isListening ? '· Enter 정지' : '· Enter 시작';
  }

  // ── 진단 패널 ──
  const dbg = {
    mic: '-', rms: 0, peak: 0, thr: 0, gain: 1, session: '없음',
    tToken: 0, tOpen: 0, tRecog: 0, tTrans: 0,
    frames: 0, recv: 0, lastText: '-', lastErr: '-', trans: '-',
  };
  const $debug = document.getElementById('debug');

  function renderDebug() {
    if (!$debug.classList.contains('show')) return;
    const scale = Math.max(dbg.peak, 0.02);
    const bar = '█'.repeat(Math.min(20, Math.round(dbg.rms / scale * 20)));
    $debug.innerHTML =
      `엔진 <b>${sttMode}</b>   세션 <b>${dbg.session}</b>   마이크 <b>${dbg.mic}</b>\n` +
      `음량 ${bar || '·'} ${dbg.rms.toFixed(4)} / 기준 ${dbg.thr.toFixed(4)}   증폭 <b>x${dbg.gain.toFixed(1)}</b>\n` +
      `보낸프레임 <b>${dbg.frames}</b>   받은응답 <b>${dbg.recv}</b>\n` +
      `지연  연결 <b>${dbg.tOpen}</b>ms  인식 <b>${dbg.tRecog}</b>ms  번역 <b>${dbg.tTrans}</b>ms\n` +
      // ↓ 폭탄·멈춤 진단용. 턴이 길거나 대기가 쌓이거나 시한초과가 늘면 그게 원인이다.
      `턴길이 <b>${dbg.turnLen || 0}</b>자   대기 <b>${pendingLines.length}</b>줄   ` +
      `번역중 <b>${inFlight}</b>   시한초과 <b>${dbg.timeouts || 0}</b>\n` +
      `글자판정 <b>${dbg.script || '-'}</b>   조각 ${dbg.chunk || '-'}\n` +
      `인식 ${dbg.lastText}\n` +
      `번역 ${dbg.trans}\n` +
      (dbg.lastErr !== '-' ? `<span class="err">오류 ${dbg.lastErr}</span>` : '');
  }
  setInterval(renderDebug, 250);

  function showToast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    setTimeout(() => $toast.classList.remove('show'), 3000);
  }

  // ── 번역 (파파고) ──
  // ── 번역 캐시 ──
  // 자주 나오는 표현은 왕복 없이 즉시 표시 (지연 0)
  // 브라우저에 저장돼서 앱을 껐다 켜도 유지됨
  const CACHE_KEY = 'cn_translate_cache_v1';
  const CACHE_MAX = 5000;          // 보관 문장 수
  let cacheDirty = false;

  // ── 캐시 조회용 정규화 ──
  // 같은 말인데 문장부호나 말끝 어조사만 다른 경우를 같은 것으로 취급.
  // 예) "好的。" "好的吧" "嗯，好的" → 모두 "好的"
  // ※ 뜻이 바뀌는 어조사(吗/呢)는 건드리지 않음
  const FILLER_HEAD = /^(嗯|啊|呃|哦|噢|那个|就是说|就是|然后)+/;
  const FILLER_TAIL = /(吧|啊|呀|嘛|哦|噢|了啊)+$/;
  const PUNCT = /[。，、！？；：""''《》()（）\s.,!?;:]/g;

  function normalize(text) {
    let t = text.replace(PUNCT, '');
    t = t.replace(FILLER_HEAD, '');
    // 어조사는 한 번만 떼어냄 (과하게 깎으면 뜻이 달라짐)
    if (t.length > 2) t = t.replace(FILLER_TAIL, '');
    return t || text;
  }

  // 미리 외워둔 문장 (glossary.js) — 서버를 안 거치므로 지연 0
  // 정규화한 형태로 저장해 변형에도 걸리게 함
  const seedPhrases = Object.entries(window.GLOSSARY_PHRASES || {})
    .map(([k, v]) => [normalize(k), v]);

  // 저장된 캐시 불러오기 (기본 표현 + 그동안 쌓인 것)
  const seedKeys = new Set(seedPhrases.map(([k]) => k));
  const transCache = new Map(seedPhrases);
  try {
    const saved = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
    for (const [k, v] of saved) transCache.set(k, v);
  } catch(e) {}

  // 변경분을 주기적으로 저장 (매번 쓰면 느려지므로 5초마다)
  function saveCache() {
    if (!cacheDirty) return;
    cacheDirty = false;
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify([...transCache]));
    } catch(e) {
      // 용량 초과 시 절반으로 줄여서 재시도
      const half = [...transCache].slice(-Math.floor(transCache.size / 2));
      transCache.clear();
      for (const [k, v] of seedPhrases) transCache.set(k, v);
      for (const [k, v] of half) transCache.set(k, v);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify([...transCache])); } catch(e2) {}
    }
  }
  setInterval(saveCache, 5000);
  window.addEventListener('pagehide', saveCache);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveCache();
  });

  // ══════════════════════════════════════════
  //  유사 문장 찾기 (미리보기용)
  //
  //  완전히 같지 않아도 비슷한 캐시 문장을 찾아 먼저 흐리게 보여준다.
  //  진짜 번역이 도착하면 즉시 교체되므로 틀린 채로 남지 않는다.
  //
  //  ⚠️ 뜻이 뒤집히는 경우는 절대 매칭하지 않는다:
  //     · 부정어(不/没/别/无/未) 유무가 다르면 제외
  //     · 숫자가 다르면 제외
  // ══════════════════════════════════════════
  const NEG = /[不没别无未]/g;
  const NUM = /[0-9零一二三四五六七八九十百千万亿两]/g;
  const QUES = /[吗呢?？]|什么|怎么|为什么|哪儿|哪里|几点|多少/g;
  const SIM_THRESHOLD = 0.72;   // 이 이상 비슷해야 미리보기

  function signature(s) {
    return {
      neg: (s.match(NEG) || []).join(''),
      num: (s.match(NUM) || []).join(''),
      // 의문문과 평서문이 섞이지 않도록
      ques: (s.match(QUES) || []).length > 0,
    };
  }

  // 두 글자 묶음 기준 유사도 (0~1)
  function similarity(a, b) {
    if (a === b) return 1;
    if (a.length < 2 || b.length < 2) return 0;
    const grams = new Map();
    for (let i = 0; i < a.length - 1; i++) {
      const g = a.slice(i, i + 2);
      grams.set(g, (grams.get(g) || 0) + 1);
    }
    let match = 0;
    for (let i = 0; i < b.length - 1; i++) {
      const g = b.slice(i, i + 2);
      const c = grams.get(g);
      if (c > 0) { grams.set(g, c - 1); match++; }
    }
    return (2 * match) / (a.length - 1 + b.length - 1);
  }

  function findSimilar(text) {
    const sig = signature(text);
    const len = text.length;
    let best = null, bestScore = SIM_THRESHOLD;

    for (const [k, v] of transCache) {
      // 길이가 많이 다르면 건너뜀 (속도)
      if (Math.abs(k.length - len) > Math.max(3, len * 0.4)) continue;
      // 부정어·숫자가 다르면 뜻이 뒤집힐 수 있으므로 제외
      const ks = signature(k);
      if (ks.neg !== sig.neg || ks.num !== sig.num || ks.ques !== sig.ques) continue;

      const s = similarity(text, k);
      if (s > bestScore) { bestScore = s; best = v; }
    }
    return best;
  }

  function esc(s) {
    return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  // ── 번역 엔진 (파파고 우선 → iFlytek 폴백) ──
  // 파파고가 느리거나 막히면(중국 등) 자동으로 iFlytek으로 넘어감
  const PAPAGO_TIMEOUT = 3000;   // 조각이 최대 140자이므로 여유 있게

  async function papagoTranslate(text) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), PAPAGO_TIMEOUT);
    try {
      const res = await fetch(PAPAGO_PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `source=zh-CN&target=ko&text=${encodeURIComponent(text)}`,
        signal: ctl.signal,
      });
      const data = await res.json();
      return data?.message?.result?.translatedText || '';
    } finally {
      clearTimeout(timer);
    }
  }

  // ★ 반드시 타임아웃이 있어야 한다.
  //   예전에는 맨 fetch 였다. 이 프록시가 응답을 주지 않으면 이 약속이
  //   영원히 매달리고, 순서를 지키려고 만든 commitChain 이 그 뒤의 모든
  //   번역을 함께 붙잡아 화면이 통째로 멈췄다. (멈춤 → 폭탄의 원인)
  const FLYTEK_TIMEOUT = 2500;

  async function flytekTranslate(text) {
    if (!IFLYTEK_AUTH_PROXY) return '';
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), FLYTEK_TIMEOUT);
    try {
      const res = await fetch(IFLYTEK_AUTH_PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
        signal: ctl.signal,
      });
      const data = await res.json();
      return data?.translated || '';
    } finally {
      clearTimeout(timer);
    }
  }

  // 파파고는 절대 영구히 건너뛰지 않는다. 매번 시도한다.
  // 다만 최근에 연속 실패했고 보조 엔진이 살아있다면 순서만 바꿔
  // 대기 시간을 아낀다.
  async function tryFlytek(text) {
    if (flytekMtBroken) return '';
    try {
      const t = await flytekTranslate(text);
      if (t) return t;
    } catch(e) {}
    flytekMtBroken = true;   // 미구독 등 — 더는 호출하지 않음
    return '';
  }

  async function translateVia(text) {
    const papagoShaky = papagoFails >= 3 &&
                        (Date.now() - papagoBlockedAt) < PAPAGO_BACKOFF_MS;

    // 파파고가 불안정하면 보조 엔진 먼저
    if (papagoShaky && !flytekMtBroken) {
      const t = await tryFlytek(text);
      if (t) return t;
    }

    // 파파고 시도 (항상)
    try {
      const t = await papagoTranslate(text);
      if (t) { papagoFails = 0; return t; }
      papagoFails++;
    } catch(e) {
      papagoFails++;
    }
    if (papagoFails === 3) papagoBlockedAt = Date.now();

    // 아직 안 써봤다면 보조 엔진
    return await tryFlytek(text);
  }

  // ── 용어 사전 ──
  const FIXES = window.GLOSSARY_FIXES || {};
  const TERMS = window.GLOSSARY_TERMS || {};
  // 긴 용어부터 매칭 (짧은 게 먼저 걸리는 것 방지)
  const TERM_KEYS = Object.keys(TERMS).sort((a, b) => b.length - a.length);
  const $terms = document.getElementById('terms');
  const $transWin = document.getElementById('trans-window');

  // 잘못 인식된 표기를 올바른 한자로 교정
  function applyFixes(text) {
    let out = text;
    for (const [wrong, right] of Object.entries(FIXES)) {
      if (out.includes(wrong)) out = out.split(wrong).join(right);
    }
    return out;
  }

  // 원문에 업계 용어가 있으면 화면에 힌트 표시 (최대 2개)
  function showTerms(text) {
    const hits = [], taken = [];
    for (const k of TERM_KEYS) {
      if (!text.includes(k)) continue;
      // 이미 잡힌 용어에 포함되는 짧은 말은 건너뜀 (虚幻引擎 다음의 引擎)
      if (taken.some(t => t.includes(k))) continue;
      taken.push(k);
      hits.push(`${k} · ${TERMS[k]}`);
      if (hits.length >= 2) break;
    }
    if (hits.length) {
      $terms.textContent = hits.join('   ');
      $terms.classList.add('show');
    } else {
      $terms.classList.remove('show');
    }
  }

  // 번역만 담당한다. 화면 표시는 호출한 쪽에서 한다.
  async function translateCurrent(text) {
    text = (text || '').trim();
    if (!text) return '';
    showTerms(text);

    const amount = detectAmount(text);
    amount ? showCurrency(amount) : hideCurrency();

    // 캐시 적중 → 네트워크 없이 즉시 (문장부호·어조사 차이는 무시)
    const key = normalize(text);
    const hit = transCache.get(key);
    if (hit) {
      if (!seedKeys.has(key)) {
        transCache.delete(key); transCache.set(key, hit); cacheDirty = true;
      }
      return hit;
    }

    setStatus('translating', '번역 중...');
    try {
      const translated = await translateVia(text);
      if (!translated) {
        dbg.lastErr = '번역 실패 (모든 엔진)';
        showToast('번역 서버 응답 없음');
        return '';
      }
      transCache.set(key, translated);
      cacheDirty = true;
      while (transCache.size > CACHE_MAX) {
        for (const k of transCache.keys()) {
          if (!seedKeys.has(k)) { transCache.delete(k); break; }
        }
      }
      return translated;
    } catch(e) {
      showToast('번역 오류 - 네트워크 확인');
      return '';
    } finally {
      if (isListening) setStatus('listening', '듣는 중...');
    }
  }

  // ── 음성 인식 ──
  function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('이 브라우저는 음성인식 미지원 (Chrome 필요)'); return null; }

    const r = new SR();
    r.lang = 'zh-CN';         // 중국어 인식
    r.continuous = true;       // 계속 듣기
    r.interimResults = true;   // 중간 결과도 받기
    r.maxAlternatives = 1;

    r.onstart = () => {
      isListening = true;
      setStatus('listening', '듣는 중...');
      $btn.classList.add('active');
      $btn.textContent = '⏹';
    };

    r.onresult = (e) => {
      let interim = '';
      let final = '';

      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t;
        else interim += t;
      }

      // 중간 결과: 원문 표시
      const current = final || interim;
      if (current) $orig.textContent = current;

      // 최종 결과: 번역
      if (final) {
        lastOriginal = final;
        clearTimeout(translateTimer);
        translate(final);
      } else if (interim) {
        // 중간결과는 1.5초 멈추면 번역
        clearTimeout(translateTimer);
        translateTimer = setTimeout(() => translate(interim), 1500);
      }
    };

    r.onerror = (e) => {
      if (e.error === 'no-speech') return;
      if (e.error === 'not-allowed') { showToast('마이크 권한을 허용해주세요'); return; }
      showToast('인식 오류: ' + e.error);
    };

    r.onend = () => {
      // 듣기 중이면 자동 재시작
      if (isListening) {
        try { r.start(); } catch(e) {}
      } else {
        $btn.classList.remove('active');
        $btn.textContent = '🎤';
        setStatus('', '준비');
      }
    };

    return r;
  }

  // ══════════════════════════════════════════
  //  iFlytek 실시간 음성인식 (메인 엔진)
  //  중국어·사투리에 강하고 중국 내에서 빠름
  // ══════════════════════════════════════════
  async function startFlytek() {
    if (!IFLYTEK_AUTH_PROXY) return fallbackTo('aai', null);

    // 1) 마이크 먼저 확보 (세션 재연결 중에도 계속 유지)
    if (!(await openMic())) return false;

    isListening = true;
    $btn.classList.add('active');
    $btn.textContent = '⏹';
    setStatus('listening', '듣는 중...');

    // 마이크 상시 개방. 말소리가 감지될 때만 세션을 염
    // (조용할 때 세션을 붙들고 있으면 동시연결 제한·사용량 낭비)
    pipeAudio(sendFlytekChunk, true);
    return true;
  }

  // 말소리 감지 → 세션이 없으면 열기
  // flyOpening 은 소켓이 실제로 열리거나 실패할 때까지 유지해야 함
  // (일찍 풀면 1초 안에 세션이 여러 개 열려 동시연결 제한에 걸림)
  function onVoiceDetected() {
    if (flySocket || flyOpening) return;
    flyOpening = true;
    voiceAt = performance.now();     // 말이 시작된 시각 (지연 측정 기준)
    dbg.tRecog = 0; dbg.tTrans = 0;
    dbg.session = '연결중';
    // 연결이 매달려 있을 경우를 대비한 안전장치
    clearTimeout(flyOpenGuard);
    flyOpenGuard = setTimeout(() => { flyOpening = false; }, 6000);
    openFlySession(false);
  }

  // iat는 한 세션당 최대 60초 + 말이 멈추면 자동 종료.
  // 긴 발화가 끊기지 않도록, 만료 전에 다음 세션을 미리 열어두고 이어붙임.
  // 토큰을 미리 받아둔다 — 말이 시작된 뒤에 받으면 그만큼 늦어진다
  let tokenCache = null;
  async function fetchToken() {
    const res = await fetch(IFLYTEK_AUTH_PROXY);
    const data = await res.json();
    if (!data?.url || !data?.app_id) throw new Error('no url');
    return { ...data, at: Date.now() };
  }
  async function prefetchToken() {
    try { tokenCache = await fetchToken(); } catch(e) {}
  }
  function tokenFresh() {
    return tokenCache && (Date.now() - tokenCache.at) < 240000;  // 4분
  }

  async function openFlySession(background) {
    let wsUrl, appId;
    const t0 = performance.now();
    try {
      // 미리 받아둔 게 있으면 즉시 사용 (왕복 한 번 절약)
      const tk = tokenFresh() ? tokenCache : await fetchToken();
      tokenCache = null;
      wsUrl = tk.url; appId = tk.app_id;
      prefetchToken();          // 다음 세션용으로 미리 준비
    } catch(e) {
      flyOpening = false;
      if (!background) fallbackTo('aai', '인식 서버 연결 실패');
      return false;
    }
    dbg.tToken = Math.round(performance.now() - t0);

    const sock = new WebSocket(wsUrl);
    let opened = false;
    flyAppId = appId;

    sock.onopen = () => {
      opened = true;
      flyOpening = false;
      dbg.tOpen = Math.round(performance.now() - t0);
      if (background) terminateFlySocket(flySocket);   // 이전 세션 마무리
      flySocket = sock;
      flyFirstFrame = true;

      // ★ 새 세션은 인식 결과가 0번부터 다시 시작한다.
      //   이전 조각을 지우지 않으면 앞부분만 덮이고 뒷부분은 옛것이 남아
      //   원문이 뒤엉킨다(번역 반복·오역의 원인).
      flySlices = [];
      finishedText = '';

      dbg.session = '열림'; dbg.frames = 0; dbg.recv = 0; dbg.lastErr = '-';
      setStatus('listening', '듣는 중...');
      scheduleFlyRotate();
    };

    sock.onmessage = ev => {
      // 교대로 물러난 이전 세션의 결과는 무시.
      // (안 그러면 새 세션의 누적 문장을 덮어써서 번역이 깨짐)
      if (flySocket && sock !== flySocket) return;
      dbg.recv++;
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.code !== 0) {
        dbg.lastErr = msg.code + ' ' + (msg.message || '');
        // 11201 = 무료 콜 소진
        if (msg.code === 11201) { stopFlytek(); fallbackTo('aai', '무료 사용량 소진'); }
        // 그 외 오류는 세션을 버리고 다음 발화 때 새로 엶
        else if (sock === flySocket) { flySocket = null; try { sock.close(1000); } catch {} }
        return;
      }
      handleFlytekResult(msg.data);

      // 서버가 인식 종료를 알리면 즉시 전송 중단 (더 보내면 invalid handle)
      if (msg.data?.status === 2 && sock === flySocket) {
        dbg.session = '완료';
        flySocket = null;
        flyCarry = new Uint8Array(0);
        // ★ 여기까지의 음성은 이미 처리됐다. 버퍼를 비우지 않으면
        //   다음 세션에 같은 음성을 다시 보내 같은 말이 두 번 번역된다.
        flyPreroll = [];
        clearTimeout(flyRotate);
        setTimeout(() => { try { sock.close(1000); } catch {} }, 100);
        // 말이 계속되고 있으면 곧바로 다음 세션을 연다.
        // 목소리가 감지될 때까지 기다리면 그 사이 음성이 유실된다.
        if (isListening && sttMode === 'iflytek' && !flyOpening) {
          flyOpening = true;
          voiceAt = performance.now();
          dbg.session = '연결중';
          openFlySession(false);
        }
      }
    };

    sock.onerror = () => { flyOpening = false; dbg.lastErr = 'WebSocket 연결 오류'; };

    sock.onclose = (e) => {
      // 아예 열리지도 못한 경우(인증 실패 등) 플래그 해제
      if (!opened) {
        flyOpening = false;
        dbg.session = '연결실패';
        dbg.lastErr = '핸드셰이크 실패 (code ' + e.code + ')';
        return;
      }
      dbg.session = '닫힘';
      if (sock !== flySocket) return;        // 교대로 물러난 이전 세션은 무시
      flySocket = null;
      flyCarry = new Uint8Array(0);
      clearTimeout(flyRotate);
      // 재연결하지 않음 — 다음 말소리가 감지되면 그때 새 세션을 엶
    };

    return true;
  }

  // 60초 만료 전(50초)에 다음 세션을 미리 열어 공백 없이 교대
  function scheduleFlyRotate() {
    clearTimeout(flyRotate);
    flyRotate = setTimeout(() => {
      if (isListening && sttMode === 'iflytek') openFlySession(true);
    }, 50000);
  }

  // 이전 세션에 종료 프레임을 보내 마지막 결과를 받아냄
  function terminateFlySocket(sock) {
    if (!sock || sock.readyState !== WebSocket.OPEN) return;
    try {
      sock.send(JSON.stringify({
        data: { status: 2, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' }
      }));
    } catch {}
    setTimeout(() => { try { sock.close(1000); } catch {} }, 500);
  }

  // 오디오 청크 → base64 → JSON 프레임 전송
  function sendFlytekChunk(pcmBuffer) {
    if (!flySocket || flySocket.readyState !== WebSocket.OPEN) return;

    const bytes = new Uint8Array(pcmBuffer);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    const audio = btoa(bin);

    const frame = {
      data: {
        status: flyFirstFrame ? 0 : 1,     // 0=첫프레임, 1=중간
        format: 'audio/L16;rate=16000',
        encoding: 'raw',
        audio,
      }
    };

    // 첫 프레임에만 공통/비즈니스 파라미터 포함
    if (flyFirstFrame) {
      frame.common = { app_id: flyAppId };
      frame.business = {
        language: 'zh_cn',
        domain: 'iat',        // Short Form ASR
        accent: 'mandarin',   // 쓰촨 등 방언도 이 엔진이 흡수함
        dwa: 'wpgs',          // 스트리밍 중간결과 활성화
        vad_eos: 600,         // 0.6초 침묵 = 한 덩어리 끝.
                              // 사람은 쉼표 자리에서 자연스럽게 쉬므로,
                              // 이 값이 곧 "절 단위 분할"이 된다.
                              // 텍스트를 규칙으로 자르는 것보다 정확하다.
        ptt: 1,               // 구두점
      };
      flyFirstFrame = false;
    }

    flySocket.send(JSON.stringify(frame));
    dbg.frames++;
  }

  // wpgs 스트리밍 결과 조립 (apd=이어붙임, rpl=구간교체)
  function handleFlytekResult(data) {
    const r = data?.result;
    if (!r) return;

    // 이번 조각의 텍스트
    let piece = '';
    for (const w of (r.ws || [])) {
      for (const c of (w.cw || [])) piece += c.w;
    }

    // ※ 순번(sn)으로 새 세션을 판단하지 않는다.
    //   wpgs는 앞부분을 고쳐쓸 때도 낮은 순번을 쓰기 때문에
    //   오판해서 번역을 처음부터 다시 하게 되고 화면이 중복된다.
    //   새 세션 판단은 소켓이 열릴 때(onopen)에만 한다.

    if (r.pgs === 'rpl' && Array.isArray(r.rg)) {
      // rg 구간을 잘라내고 교체
      for (let i = r.rg[0]; i <= r.rg[1]; i++) flySlices[i] = '';
    }
    flySlices[r.sn] = piece;

    const text = flySlices.join('').trim();
    if (!text) return;

    if (!dbg.tRecog && voiceAt) dbg.tRecog = Math.round(performance.now() - voiceAt);
    dbg.lastText = text;
    $orig.textContent = text;

    // 화면에는 아직 안 띄우지만, 듣고 있다는 건 알려준다
    if (!(r.ls || data.status === 2) && isListening) {
      setStatus('listening', '듣는 중… ' + text.length + '자');
    }

    const isEnd = r.ls || data.status === 2;

    // 종료 신호가 여러 번 오는 경우가 있다 — 같은 문장이면 무시
    if (finishedText && finishedText.startsWith(text)) return;

    // ══════════════════════════════════════════
    //  문장을 쪼개지 않는다.
    //  중국어는 앞뒤 문맥이 있어야 번역되므로, 도중에 자르면
    //  어떤 규칙을 써도 뜻이 깨진다.
    //  대신 "지금 말하는 중인 문장"을 통째로 번역해 그 줄만 교체하고,
    //  문장이 끝나면 그 줄을 확정해 위로 올린다.
    // ══════════════════════════════════════════
    if (isEnd) {
      finishedText = text;
      liveSeq++;              // 진행 중이던 미리보기 무효화
      clearTimeout(flyPending); flyPending = null;
      previewSrc = '';
      liveText = '';          // 미리보기는 확정 문장으로 대체된다

      // 구두점 기준으로 문장을 나눈다.
      // ※ 예전엔 규칙(어절·조사)으로 추측하다 단어 중간을 잘라 뜻이 깨졌다.
      //   최종 결과에는 인식 모델이 찍은 구두점이 있으므로 그걸 그대로 쓴다.
      translateLive(text);   // 통째로 번역 → 결과를 잘라서 표시

      flySlices = [];
      return;
    }

    // ※ 말하는 중에는 화면을 건드리지 않는다.
    //   글자가 계속 바뀌면 읽는 눈이 따라가지 못한다.
    //   듣고 있다는 표시는 상단 상태 점이 대신한다.
  }

  // ══════════════════════════════════════════
  //  문장 나누기
  //  마침표·물음표·느낌표·말줄임 뒤에서 자른다.
  //  중국어 전각 부호와 반각 부호를 모두 본다.
  //  쉼표(，)로는 자르지 않는다 — 너무 잘게 쪼개져 문맥이 깨진다.
  //  ※ 구두점이 없으면 통째로 한 문장으로 본다.
  // ══════════════════════════════════════════
  function splitSentences(text) {
    const MARKS = '\u3002\uFF01\uFF1F!?\u2026';   // 。！？ ! ? …
    const out = [];
    let buf = '';
    for (const ch of text) {
      buf += ch;
      if (MARKS.includes(ch)) {
        const t = buf.trim();
        if (t) out.push(t);
        buf = '';
      }
    }
    const rest = buf.trim();
    if (rest) out.push(rest);
    return out.length ? out : [text.trim()];
  }

  // ══════════════════════════════════════════
  //  미리보기: 말하는 도중에도 번역이 뜬다
  //  · 0.45초마다, 그리고 새 글자가 3자 이상 늘었을 때만 보낸다
  //  · 앞선 미리보기가 아직 안 왔으면 건너뛴다 (밀림 방지)
  //  · 결과가 늦게 오면 버린다 — 최신 것만 의미가 있다
  // ══════════════════════════════════════════
  const PREVIEW_MS = 450;      // 미리보기 갱신 간격
  const PREVIEW_MIN_GROW = 3;  // 이만큼 늘어야 다시 번역
  let previewBusy = false;
  let previewSrc = '';         // 마지막으로 미리보기를 보낸 원문

  function schedulePreview(text) {
    if (flyPending) return;
    if (text.length < previewSrc.length + PREVIEW_MIN_GROW) return;
    flyPending = setTimeout(() => {
      flyPending = null;
      runPreview(dbg.lastText || text);
    }, PREVIEW_MS);
  }

  function runPreview(text) {
    if (previewBusy || !text) return;
    if (finishedText && finishedText.startsWith(text)) return;
    previewBusy = true;
    previewSrc = text;
    const seq = liveSeq;
    translateCurrent(applyFixes(text.trim()))
      .then(t => {
        if (seq !== liveSeq) return;   // 이미 확정됨 — 늦은 미리보기는 버린다
        if (!t) return;
        liveText = t;
        renderLines();
      })
      .catch(() => {})
      .finally(() => { previewBusy = false; });
  }

  // ══════════════════════════════════════════
  //  번역 결과를 표시 단위로 쪼갠다
  //  ※ 중국어 원문을 자르면 문맥이 끊겨 번역이 나빠진다.
  //    그래서 번역은 통째로 하고, 나온 한국어만 여기서 나눈다.
  //  · 마침표·물음표·느낌표에서는 항상 끊는다
  //  · 쉼표는 앞 조각이 충분히 길 때만 끊는다 (조각이 너무 잘게 나면 읽기 나쁘다)
  //  · 남은 꼬리가 너무 짧으면 앞 줄에 붙인다
  // ══════════════════════════════════════════
  const COMMA_MIN = 14;   // 쉼표로 끊으려면 이 글자 수는 넘어야 한다
  const TAIL_MIN  = 6;    // 이보다 짧은 꼬리는 앞 줄에 붙인다

  function splitKorean(t) {
    const out = [];
    let buf = '';
    for (const ch of t) {
      buf += ch;
      const isEnd   = '.!?\u2026'.includes(ch);
      const isComma = ',\u3001'.includes(ch);
      if (isEnd || (isComma && buf.trim().length >= COMMA_MIN)) {
        const piece = buf.trim();
        if (piece) out.push(piece);
        buf = '';
      }
    }
    const rest = buf.trim();
    if (rest) {
      if (out.length && rest.length < TAIL_MIN) out[out.length - 1] += ' ' + rest;
      else out.push(rest);
    }
    return out.length ? out : [t.trim()];
  }

  // 한 덩어리가 끝날 때마다 번역해 화면에 확정한다.
  // 번역은 동시에 보내되(빠르게), 화면에는 말한 순서대로 올린다.
  // ※ 확정 결과는 절대 버리지 않는다.
  // ── 순서 보장 (단, 절대 영구 대기하지 않는다) ──
  // 번역을 말한 순서대로 내보내려고 약속을 사슬로 잇는다.
  // 그런데 사슬은 한 칸이 막히면 뒤가 전부 멈춘다.
  // 그래서 어떤 번역이든 이 시한을 넘기면 빈 값으로 처리하고 넘어간다.
  const JOB_MAX_MS = 6000;   // 파파고 3s + 보조 2.5s 보다 넉넉하게

  function withDeadline(p, ms) {
    return new Promise(resolve => {
      let settled = false;
      const finish = v => { if (!settled) { settled = true; clearTimeout(t); resolve(v); } };
      const t = setTimeout(() => {
        dbg.timeouts = (dbg.timeouts || 0) + 1;   // 몇 번 시한을 넘겼는지 (D 키로 확인)
        finish('');
      }, ms);
      p.then(finish, () => finish(''));
    });
  }

  // ══════════════════════════════════════════
  //  중국어를 자라는 대로 끊어 보내기
  // ══════════════════════════════════════════
  //  인식기가 턴을 닫아줄 때까지 기다리면 143자가 한 번에 와서
  //  번역도 부정확하고 화면도 폭탄이 된다. 설정으로는 못 막았다.
  //  그래서 말하는 중간에 우리가 직접 끊는다.
  //
  //  · 구두점이 보이면 거기서 끊는다
  //  · 구두점이 없어도 일정 길이가 쌓이면 끊는다
  //  · 맨 끝 몇 글자는 아직 고쳐질 수 있으니 남겨둔다
  //  · 이미 내보낸 만큼은 다시 번역하지 않는다
  const CHUNK_PUNCT = /[。！？；：，、.!?;:,]/;
  const CHUNK_MIN   = 10;   // 구두점이 있어도 이보다 짧으면 안 끊는다
  const CHUNK_FORCE = 22;   // 구두점이 없어도 이만큼이면 끊는다
  const CHUNK_LAG   = 5;    // 인식기가 고칠 여유로 남겨두는 글자 수

  const NOT_PLAIN = /[\s。！？；：，、.!?;:,]/;

  // ══════════════════════════════════════════
  //  중국어 글자인지 직접 확인한다
  // ══════════════════════════════════════════
  //  ★ 인식기가 알려주는 language_code 를 믿으면 안 된다.
  //    그 값이 안 실려 오면 검사가 조용히 통과된다. 실제로 한국어를 말했을 때
  //    인식기가 베트남어 글자로 받아쓴 것이 그대로 화면에 올라갔다.
  //    글자를 직접 세는 건 절대 조용히 통과되지 않는다.
  const HAN    = /[一-鿿㐀-䶿]/;
  const HANGUL = /[가-힣ᄀ-ᇿ㄰-㆏]/;
  const SKIP   = /[\s\d\p{P}\p{S}]/u;

  /// 글자 중 한자가 차지하는 비율. 베트남어·한글·영어는 0 에 가깝다.
  function scriptOf(s) {
    let han = 0, hangul = 0, total = 0;
    for (const ch of s) {
      if (SKIP.test(ch)) continue;
      total++;
      if (HAN.test(ch)) han++;
      else if (HANGUL.test(ch)) hangul++;
    }
    if (!total) return { kind: 'empty', han: 0 };
    const r = han / total;
    if (r >= 0.6) return { kind: 'zh', han: r };
    if (hangul / total >= 0.4) return { kind: 'ko', han: r };
    return { kind: 'other', han: r };
  }

  function plainLen(s) {
    let n = 0;
    for (const ch of s) if (!NOT_PLAIN.test(ch)) n++;
    return n;
  }

  /// 구두점을 뺀 글자 n개를 지나간 위치를 돌려준다.
  /// (구두점판과 서식없는판의 길이가 달라서 글자 수로 세야 한다)
  function skipPlain(text, n) {
    if (n <= 0) return 0;
    let c = 0;
    for (let i = 0; i < text.length; i++) {
      if (!NOT_PLAIN.test(text[i])) c++;
      if (c >= n) return i + 1;
    }
    return text.length;
  }

  let emittedPlain = 0;   // 이번 턴에서 이미 번역에 보낸 글자 수
  let lastVoiceAt = 0;    // 마지막으로 말소리가 있었던 시각

  /// 번역을 거치지 않고 그대로 화면에 올린다 (한국어 입력 등)
  function commitPlain(t) {
    commitChain = commitChain.then(() => { queueLine(t); }).catch(() => {});
  }

  function feedChunks(text, isFinal) {
    for (;;) {
      const tail = text.slice(skipPlain(text, emittedPlain));
      if (!tail) return;

      // 확정된 문장이면 끝까지 쓴다. 말하는 중이면 끝을 남겨둔다.
      const limit = isFinal ? tail.length : tail.length - CHUNK_LAG;
      if (limit <= 0) return;

      let cut = -1;
      for (let i = 0; i < limit; i++) {
        if (CHUNK_PUNCT.test(tail[i]) && plainLen(tail.slice(0, i + 1)) >= CHUNK_MIN) {
          cut = i + 1;
          break;
        }
      }
      if (cut < 0) {
        const n = plainLen(tail.slice(0, limit));
        // 구두점이 없으면 — 말이 멈춘 순간에 끊는다.
        // 글자 수만으로 끊으면 "工/厂" 처럼 낱말이 갈라져 번역이 망가진다.
        const paused = dbg.quiet && (performance.now() - lastVoiceAt) > 180;
        if (n >= CHUNK_MIN && paused) cut = limit;
        else if (n >= CHUNK_FORCE) cut = limit;   // 쉬지 않고 계속 말하는 경우
        else return;
      }

      const piece = tail.slice(0, cut).trim();
      if (!piece) return;

      // ★ 중국어가 아니면 번역하지 않는다.
      const sc = scriptOf(piece);
      emittedPlain += plainLen(piece);
      dbg.chunk = piece;
      dbg.script = sc.kind;
      if (sc.kind === 'ko') { commitPlain(piece); continue; }   // 한글은 그대로 보여준다
      if (sc.kind !== 'zh')  { continue; }                      // 베트남어 등 오인식은 버린다
      translateLive(piece);
    }
  }

  let commitChain = Promise.resolve();
  function translateLive(text) {
    inFlight++;
    // ※ inFlight 도 이 시한 안에 반드시 줄어든다.
    //   매달린 요청 때문에 0 이 되지 않으면 화면 정리가 영원히 멈춘다.
    const job = withDeadline(
      translateCurrent(applyFixes(text.trim())).catch(() => ''),
      JOB_MAX_MS
    ).finally(() => { inFlight--; });

    commitChain = commitChain
      .then(() => job)
      .then(t => { if (t) for (const line of splitKorean(t)) queueLine(line); })
      .catch(() => {});
  }

  // ── 화면 표시 ──
  // 확정된 문장은 위에 고정(밝게)되고, 말하는 중인 문장만 맨 아래에서 흐리게 갱신된다.
  function renderLines() {
    const hasAny = lines.length > 0 || !!liveText;
    $trans.textContent = '';
    if (lines.length) $trans.append(document.createTextNode(lines.join('\n')));
    if (liveText) {
      if (lines.length) $trans.append(document.createTextNode('\n'));
      const s = document.createElement('span');
      s.className = 'tail';
      s.textContent = liveText;
      $trans.append(s);
    }
    if (!hasAny) $trans.textContent = '중국어를 말하면 번역됩니다';
    $trans.classList.toggle('empty', !hasAny);
    requestAnimationFrame(() => {
      const lh = curFontSize() * 1.45;
      const max = $transWin.scrollHeight - $transWin.clientHeight;
      $transWin.scrollTop = max > 0 ? Math.round(max / lh) * lh : 0;
    });
  }


  // 번역 확정 — 화면에 추가한다.
  // 짧은 쉼(0.6초)마다 끊기므로 조각이 잦다. 계속 이어 말하는 중이면
  // 같은 줄에 이어붙이고, 충분히 쉬었으면 새 줄에서 시작한다.
  // ══════════════════════════════════════════
  //  조용해지면 화면을 비운다
  //  안경은 검정이 투명이라, 남은 글자가 계속 시야를 가린다.
  //  마지막 줄이 뜬 뒤 한동안 새 말이 없으면 지운다.
  //  ※ 마지막 줄을 읽을 시간은 줘야 하므로 너무 짧게 잡지 않는다.
  // ══════════════════════════════════════════
  //  · 마지막 줄이 뜬 뒤 READ_MS 는 무조건 남겨 둔다 (읽을 시간)
  //  · 인식기가 소리를 듣고 있는 동안에는 절대 지우지 않는다.
  //    상대가 말하는 중이면 턴이 안 끝나 새 줄이 안 올라오는데,
  //    그걸 "조용하다"고 착각해서 지우던 문제가 있었다.
  const READ_MS       = 7000;   // 마지막 줄이 뜬 뒤 보장되는 시간
  const QUIET_MS      = 2500;   // 인식기가 이만큼 조용해야 지우기 시작
  const FADE_STEP_MS  = 1200;   // 그 뒤로는 이 간격마다 한 줄씩

  let lastHeardAt = 0;
  let lastFadeAt = 0;

  setInterval(() => {
    if (!lines.length) return;
    if (pendingLines.length || inFlight > 0) return;   // 아직 올릴 게 남았다
    const now = performance.now();
    if (now - lastHeardAt   < QUIET_MS) return;        // 아직 듣고 있다
    if (now - lastCommitAt  < READ_MS)  return;        // 읽을 시간을 준다
    if (now - lastFadeAt    < FADE_STEP_MS) return;

    lines.shift();              // 위에서부터 (마지막 줄이 가장 오래 남는다)
    lastFadeAt = now;
    if (!lines.length) liveText = '';
    renderLines();
  }, 400);

  // ══════════════════════════════════════════
  //  줄 내보내기 속도 조절
  //  한 덩어리에 문장이 여러 개면 번역이 거의 동시에 돌아온다.
  //  그대로 뿌리면 세 줄이 한꺼번에 꽂혀서 읽을 수가 없다.
  //  번역은 그대로 동시에 하되, 화면에는 한 줄씩 간격을 두고 올린다.
  //  ※ 밀리기 시작하면 간격을 좁혀 따라잡는다.
  // ══════════════════════════════════════════
  const LINE_GAP_MS = 550;     // 줄 사이 기본 간격
  const LINE_GAP_FAST = 260;   // 밀렸을 때 간격
  let pendingLines = [];
  let revealTimer = null;

  // 대기 줄이 이보다 쌓이면 아무리 빨리 내보내도 읽을 수 없다.
  // 그럴 땐 가장 오래된 줄을 버린다. (지금 하는 말이 더 중요하다)
  const PENDING_MAX = 8;

  function queueLine(t) {
    pendingLines.push(t);
    while (pendingLines.length > PENDING_MAX) pendingLines.shift();
    pumpReveal();
  }

  function pumpReveal() {
    if (revealTimer || !pendingLines.length) return;
    const gap = pendingLines.length > 2 ? LINE_GAP_FAST : LINE_GAP_MS;
    const since = performance.now() - lastCommitAt;
    const wait = Math.max(0, gap - since);   // 한참 쉬었다면 바로 내보낸다
    revealTimer = setTimeout(() => {
      revealTimer = null;
      const line = pendingLines.shift();
      if (line) commitLine(line);
      pumpReveal();
    }, wait);
  }

  function commitLine(t) {
    // ※ 한 번 화면에 오른 줄은 다시 손대지 않는다.
    //   예전엔 "3초 안에 이어 말하면 같은 줄에 붙인다"는 규칙이 있었는데,
    //   읽고 있는 줄에 글자가 계속 자라서 눈이 따라가지 못했다.
    lines.push(t);
    if (lines.length > MAX_LINES) lines.shift();

    lastCommitAt = performance.now();
    lastTranslated = t;
    renderLines();
  }

  // 마지막 구두점 위치 찾기 (그 다음 인덱스 반환)
  function lastBoundary(s, re) {
    let idx = -1;
    for (let i = 0; i < s.length; i++) {
      if (re.test(s[i])) idx = i;
    }
    return idx >= 0 ? idx + 1 : 0;
  }


  function stopFlytek() {
    isListening = false;
    clearTimeout(flyReopen);
    clearTimeout(flyRotate);

    // 종료 프레임 (status=2)
    if (flySocket && flySocket.readyState === WebSocket.OPEN) {
      try {
        flySocket.send(JSON.stringify({
          data: { status: 2, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' }
        }));
      } catch {}
    }
    setTimeout(() => { try { flySocket?.close(1000); } catch {} flySocket = null; }, 300);

    closeMic();
    flySlices = [];
    $btn.classList.remove('active');
    $btn.textContent = '🎤';
    setStatus('', '준비');
  }

  // ══════════════════════════════════════════
  //  AssemblyAI 스트리밍 STT (폴백 1)
  //  마이크 → PCM 16kHz → WebSocket → 실시간 텍스트
  // ══════════════════════════════════════════
  // 엔진 실패 → 다음 순위 엔진으로 자동 전환 후 계속 진행
  // iflytek → aai → browser
  function fallbackTo(nextMode, reason) {
    if (reason) showToast(reason + ' - 엔진 전환');
    const wasListening = isListening;
    if (wasListening) stopListen();          // 현재 엔진 정리
    setSttMode(nextMode);
    setTimeout(() => { if (!isListening) toggleListen(); }, 400);
    return false;
  }

  async function startAAI() {
    if (!AAI_TOKEN_PROXY) return fallbackTo('browser', null);

    // 1) 임시 토큰 발급 (API 키는 Worker에만 존재)
    let token;
    setStatus('translating', '연결 중...');
    try {
      const res = await fetch(AAI_TOKEN_PROXY);
      const data = await res.json();
      token = data?.token;
      if (!token) throw new Error('no token');
    } catch(e) {
      return fallbackTo('browser', '인식 서버 연결 실패');
    }

    // 2) 마이크 확보
    if (!(await openMic())) return false;

    // 3) WebSocket 연결
    //  · language_codes=["zh"]  중국어로 고정
    //  · format_turns=true      확정 결과에 구두점을 붙여 준다
    //  · mode=min_latency       가장 빨리 내놓는 설정
    //
    //  턴 종료는 침묵이 아니라 "말이 끝났는지"를 모델이 판단한다.
    //  다만 판단이 발동하려면 최소한의 멈춤이 필요하다(min_turn_silence).
    //  문장 사이의 짧은 멈춤도 잡으려고 공식 문서의 '적극적' 설정을 쓴다.
    const params = new URLSearchParams({
      sample_rate: SAMPLE_RATE,
      speech_model: AAI_MODEL,
      language_codes: '["zh","ja"]',   // 중국어를 기대하되 하나로 못박지 않는다
      language_detection: 'true',      // 턴마다 감지된 언어를 돌려받는다
      format_turns: 'true',
      mode: 'min_latency',
      end_of_turn_confidence_threshold: '0.4',
      min_turn_silence: '160',    // 이만큼 쉬면 "문장 끝인가" 판단이 돌아간다
      max_turn_silence: '400',    // 판단이 안 서도 이만큼 조용하면 강제 종료
      token,
    });
    aaiSocket = new WebSocket(`${AAI_WS}?${params}`);
    aaiSocket.binaryType = 'arraybuffer';

    aaiSocket.onopen = () => {
      isListening = true;
      setStatus('listening', '듣는 중…');
      pipeAudio(buf => {
        if (aaiSocket && aaiSocket.readyState === WebSocket.OPEN) aaiSocket.send(buf);
      });
    };

    let aaiDone = '';   // 이미 처리한 확정 문장 (중복 방지)
    emittedPlain = 0;   // 새 연결이면 보낸 글자 수도 초기화한다

    aaiSocket.onmessage = ev => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type !== 'Turn') return;

      const text = (msg.transcript || '').trim();
      if (!text) return;

      dbg.lastText = text;
      $orig.textContent = text;
      lastHeardAt = performance.now();   // 말하는 중 — 화면을 지우면 안 된다


      dbg.lang = msg.language_code || '-';
      // ※ 언어 판정은 참고만 한다. 실제 차단은 글자를 세서 한다(feedChunks).
      //   language_code 가 안 실려 오면 검사가 조용히 통과되기 때문이다.

      // ── 말하는 중 ──
      // ※ 턴이 닫히기를 기다리지 않는다. 자란 만큼 끊어서 바로 번역한다.
      if (!msg.end_of_turn) {
        dbg.turnLen = text.length;
        if (isListening) setStatus('listening', '듣는 중… ' + text.length + '자');
        feedChunks(text, false);
        return;
      }

      // 구두점이 붙은 결과만 쓴다. 서식 없는 확정이 먼저 오고
      // 잠시 뒤 구두점판이 또 오므로, 서식판을 기다린다.
      if (msg.turn_is_formatted === false) return;
      if (text === aaiDone) { emittedPlain = 0; return; }
      aaiDone = text;

      if (!dbg.tRecog && voiceAt) dbg.tRecog = Math.round(performance.now() - voiceAt);

      // ── 중국어인지 판정 ──
      //  이 인식기는 한국어를 지원하지 않는다. 한국어를 말하면 그 소리를
      //  중국어 글자에 억지로 끼워 맞춘다 (실측에서 "欧巴"(오빠)가 그대로 찍혔다).
      //
      //  신뢰도 숫자로 선을 긋는 건 문장마다 흔들려서 못 믿는다.
      //  대신 엔진이 턴마다 내주는 언어 판정을 쓴다 — 중국어가 아니면 번역하지 않는다.
      //  ※ 한국어는 지원 언어가 아니라 "무슨 언어인지"는 못 맞힌다.
      //    우리 목적(엉뚱한 번역 막기)에는 "zh 아님"만 알면 충분하다.
      const lang     = msg.language_code || null;
      const langConf = msg.language_confidence;
      const ws       = msg.words || [];
      const conf     = ws.length
        ? ws.reduce((a, w) => a + (w.confidence || 0), 0) / ws.length
        : null;

      dbg.lang = lang;
      dbg.langConf = langConf;
      dbg.turnLen = text.length;   // 턴이 길게 오면 폭탄이 된다 — 눈으로 확인하려고 둔다
      dbg.conf = conf;
      confLog.push({ lang, langConf, conf, len: text.length, text: text.slice(0, 24) });
      if (confLog.length > 60) confLog.shift();

      // ※ 여기서 언어로 걸러내지 않는다. feedChunks 가 조각마다 글자를 보고
      //   판단한다 (한 턴 안에 중국어와 한국어가 섞여도 각각 처리된다).

      // 턴이 닫혔다 — 아직 안 보낸 꼬리만 마무리한다.
      // (앞부분은 말하는 중에 이미 번역해서 화면에 올라가 있다)
      feedChunks(text, true);
      emittedPlain = 0;
    };

    aaiSocket.onerror = () => {};   // onclose 에서 일괄 처리

    aaiSocket.onclose = () => {
      // 듣는 중에 끊겼다면 무료 엔진으로 자동 폴백
      if (isListening) {
        stopAAI();
        fallbackTo('browser', '세션 종료');
      }
    };

    return true;
  }

  // ══════════════════════════════════════════
  //  공용 마이크 파이프라인 (두 엔진이 함께 사용)
  // ══════════════════════════════════════════
  async function openMic() {
    try {
      // echoCancellation만 끔 — 켜두면 스피커에서 나오는 소리를 지워버려
      // 영상·통화 번역이 아예 안 됨.
      // autoGainControl은 켜야 함 — 끄면 내장 마이크 입력이 너무 작아짐.
      // noiseSuppression은 iFlytek이 더 잘 처리하므로 끔.
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: true,
          channelCount: 1,
        }
      });
      dbg.mic = '정상';
      return true;
    } catch(e) {
      dbg.mic = '권한거부';
      dbg.lastErr = '마이크 접근 실패: ' + e.name;
      showToast('마이크 권한을 허용해주세요');
      setStatus('', '준비');
      return false;
    }
  }

  function closeMic() {
    clearTimeout(flyPending); flyPending = null;
    flyCarry = new Uint8Array(0);
    flyPreroll = [];
    flyOpening = false;
    procNode?.disconnect(); srcNode?.disconnect();
    audioCtx?.close().catch(() => {});
    procNode = null; srcNode = null; audioCtx = null;
    mediaStream?.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }

  // 마이크 → 16kHz Int16 PCM → onChunk(ArrayBuffer)
  // extra 가 주어지면(iFlytek) 40ms/1280B 페이싱으로 나눠 보냄
  function pipeAudio(onChunk, extra) {
    // Safari 등 일부 브라우저는 sampleRate 지정을 무시하므로,
    // 실제 샘플레이트를 확인해 필요하면 16kHz로 직접 변환한다.
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
    } catch(e) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    // 자동재생 정책으로 suspended 상태일 수 있으므로 깨움
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
      // 사용자 동작이 있을 때 다시 시도하도록 예약
      const wake = () => { audioCtx?.resume().catch(() => {}); };
      document.addEventListener('keydown', wake, { once: true });
      document.addEventListener('click', wake, { once: true });
    }

    const actualRate = audioCtx.sampleRate;
    const needResample = Math.abs(actualRate - SAMPLE_RATE) > 1;
    dbg.mic = '정상 ' + actualRate + 'Hz' + (needResample ? '→16k' : '');

    srcNode = audioCtx.createMediaStreamSource(mediaStream);
    procNode = audioCtx.createScriptProcessor(4096, 1, 1);

    const paced = extra !== undefined;

    procNode.onaudioprocess = e => {
      if (!isListening) return;
      let input = e.inputBuffer.getChannelData(0);

      // 필요하면 16kHz로 리샘플 (선형 보간)
      if (needResample) {
        const ratio = actualRate / SAMPLE_RATE;
        const outLen = Math.floor(input.length / ratio);
        const out = new Float32Array(outLen);
        for (let i = 0; i < outLen; i++) {
          const pos = i * ratio;
          const i0 = Math.floor(pos), frac = pos - i0;
          const a = input[i0] || 0, b = input[i0 + 1] ?? a;
          out[i] = a + (b - a) * frac;
        }
        input = out;
      }

      // 무음 게이트 판단에 쓰려면 증폭 전에 미리 구해둔다
      let sumRaw = 0;
      for (let i = 0; i < input.length; i++) sumRaw += input[i] * input[i];
      const rmsRaw = Math.sqrt(sumRaw / input.length);

      // ── 자동 증폭 ──
      // 입력이 작으면 키워서 인식률을 올린다. 최근 최대치를 기준으로
      // 목표 레벨에 맞추되, 급격한 변화를 막기 위해 서서히 조정.
      let framePeak = 0;
      for (let i = 0; i < input.length; i++) {
        const a = Math.abs(input[i]);
        if (a > framePeak) framePeak = a;
      }
      peakTracker = Math.max(framePeak, peakTracker * 0.995);   // 천천히 감쇠
      const wantGain = peakTracker > 0.0005
        ? Math.min(MAX_GAIN, Math.max(1, TARGET_PEAK / peakTracker))
        : 1;
      // 줄일 땐 빠르게(음 깨짐 방지), 키울 땐 천천히(잡음 증폭 방지)
      gain += (wantGain - gain) * (wantGain < gain ? 0.4 : 0.05);
      dbg.gain = gain;

      // ── 말소리 감지 (음량 기반) ──
      // ※ 이 계산은 어느 엔진을 쓰든 먼저 해야 한다.
      //   예전에는 무음 게이트 아래에 있어서, AssemblyAI 경로가 위에서
      //   먼저 return 해버리는 바람에 기준값(dbg.thr)이 0으로 남았다.
      const rms = rmsRaw * gain;   // 증폭 후 기준으로 판단
      dbg.rms = rms;
      if (rms > dbg.peak) dbg.peak = rms;

      // ── 주변 소음 수준 추적 ──
      // ★ 반드시 "내려갈 땐 빠르게, 올라갈 땐 아주 느리게" 여야 한다.
      //   말소리를 소음으로 학습하면 기준이 말소리보다 높아져
      //   음성 감지가 영구히 죽는다.
      if (noiseFloor === 0) {
        noiseFloor = rms;
      } else if (rms < noiseFloor) {
        noiseFloor = noiseFloor * 0.85 + rms * 0.15;   // 조용해지면 빨리 따라감
      } else {
        noiseFloor *= 1.0002;                          // 시끄러워도 거의 안 오름
      }

      // 소음 대비 조금이라도 크면 말소리로 판단.
      // 상한을 둬서 어떤 경우에도 기준이 말소리를 넘지 못하게 한다.
      const threshold = Math.min(
        Math.max(noiseFloor * 1.8, VOICE_FLOOR),
        Math.max(dbg.peak * 0.2, VOICE_FLOOR)
      );
      dbg.thr = threshold;

      // ── 무음 게이트 ──
      // 말소리가 아닌 구간은 진짜 무음(0)으로 바꿔 보낸다.
      //
      // ★ 엔진 종류와 무관하게 적용해야 한다.
      //   예전에는 iFlytek 경로에만 걸려 있었다. 그래서 AssemblyAI 로 보낼 때는
      //   조용한 구간까지 최대 12배로 증폭해 계속 흘려보냈고, 서버는 침묵을
      //   본 적이 없어 턴을 닫지 않았다. 한 덩어리가 수백 자로 불어난 원인이다.
      //   (min_turn_silence 를 160ms 로 낮춰도 소용없었던 이유가 이것)
      const quiet = dbg.thr > 0 && rms < dbg.thr * 0.6;

      // Float32 (-1~1) → Int16 PCM (증폭 적용, 클리핑 방지)
      const pcm = new Int16Array(input.length);
      if (!quiet) {
        for (let i = 0; i < input.length; i++) {
          const s = Math.max(-1, Math.min(1, input[i] * gain));
          pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
      }
      dbg.quiet = quiet;
      if (!quiet) lastVoiceAt = performance.now();   // 끊을 자리를 찾는 데 쓴다
      if (!paced) { onChunk(pcm.buffer); return; }

      // 순간적인 소음(문 닫힘, 키보드 등)에 세션이 열리면
      // iFlytek이 잡음을 억지로 중국어로 인식해 헛소리가 쌓인다.
      // 말소리는 최소 0.7초는 이어지므로 그 조건을 요구한다.
      if (rms > threshold) {
        voiceRun++;
        if (voiceRun >= VOICE_RUN_MIN) { flyQuietSince = 0; onVoiceDetected(); }
      } else {
        voiceRun = 0;
      }
      dbg.run = voiceRun;

      const incoming = new Uint8Array(pcm.buffer);

      // 세션이 아직 없으면 직전 음성을 잠깐 보관해뒀다가
      // 세션이 열릴 때 같이 보내 앞부분이 잘리지 않게 함
      if (!flySocket || flySocket.readyState !== WebSocket.OPEN) {
        flyPreroll.push(incoming);
        while (flyPreroll.length > PREROLL_CHUNKS) flyPreroll.shift();
        return;
      }

      // 보관해둔 앞부분 먼저 흘려보냄
      let pending = incoming;
      if (flyPreroll.length) {
        const parts = [...flyPreroll, incoming];
        flyPreroll = [];
        const total = parts.reduce((n, p) => n + p.length, 0);
        pending = new Uint8Array(total);
        let o = 0;
        for (const p of parts) { pending.set(p, o); o += p.length; }
      }

      // 규격 프레임 크기(1280B)로 쪼개서 전송
      const merged = new Uint8Array(flyCarry.length + pending.length);
      merged.set(flyCarry); merged.set(pending, flyCarry.length);
      let off = 0;
      while (merged.length - off >= FLY_FRAME_BYTES) {
        onChunk(merged.slice(off, off + FLY_FRAME_BYTES).buffer);
        off += FLY_FRAME_BYTES;
      }
      flyCarry = merged.slice(off);
    };

    srcNode.connect(procNode);
    procNode.connect(audioCtx.destination);
  }

  function stopAAI() {
    isListening = false;

    // 세션 종료 신호 (미전송 시 3시간 과금됨)
    if (aaiSocket && aaiSocket.readyState === WebSocket.OPEN) {
      try { aaiSocket.send(JSON.stringify({ type: 'Terminate' })); } catch {}
    }
    setTimeout(() => { try { aaiSocket?.close(); } catch {} aaiSocket = null; }, 300);

    closeMic();

    $btn.classList.remove('active');
    $btn.textContent = '🎤';
    setStatus('', '준비');
  }

  // ── 엔진 표시 갱신 ──
  // 사용자가 직접 바꾸는 게 아니라, 고정밀 실패 시 자동 폴백용
  function setSttMode(mode) {
    sttMode = mode;
    const $pill = document.getElementById('engine-pill');
    const label = { iflytek: '讯飞', aai: 'AAI', browser: '일반' }[mode] || mode;
    $pill.textContent = label;
    $pill.classList.toggle('hq', mode === 'iflytek' || mode === 'aai');
  }

  // ── 시작/정지 (모드에 따라 분기) ──
  function stopListen() {
    if (sttMode === 'iflytek') {
      stopFlytek();
    } else if (sttMode === 'aai') {
      stopAAI();
    } else {
      isListening = false;
      recognition?.stop();
    }
  }

  function toggleListen() {
    if (isListening) { stopListen(); return; }

    if (sttMode === 'iflytek') {
      startFlytek();
    } else if (sttMode === 'aai') {
      startAAI();
    } else {
      if (!recognition) recognition = initRecognition();
      if (!recognition) return;
      try {
        recognition.start();
      } catch(e) {
        // 이미 실행 중
      }
    }
  }

  // ══════════════════════════════════════════
  //  자동 시작
  //  마이크 권한이 이미 허용돼 있으면 앱을 열자마자 듣기 시작.
  //  (첫 방문 등 권한이 없을 때만 Enter를 한 번 눌러야 함)
  // ══════════════════════════════════════════
  async function autoStart() {
    // 권한 상태 확인이 가능한 브라우저면 미리 확인
    try {
      const st = await navigator.permissions?.query({ name: 'microphone' });
      if (st && st.state === 'denied') {
        setStatus('', '마이크 권한 필요');
        return;
      }
      if (st && st.state === 'prompt') {
        setStatus('', '준비');   // 권한 요청은 사용자 동작이 필요
        return;
      }
    } catch(e) {
      // permissions API 미지원 → 그냥 시도해봄
    }

    try {
      await toggleListen();
    } catch(e) {
      setStatus('', '준비');
    }
  }

  // 화면이 다시 활성화되면(안경에서 앱으로 복귀) 자동으로 재개
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !isListening) {
      setTimeout(autoStart, 300);
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(autoStart, 100));
  } else {
    setTimeout(autoStart, 100);
  }

  // ── 글자 크기 (상/하 스와이프) ──
  // 안경에서 실제로 보면서 조절할 수 있어야 한다. 밝은 곳에서는 크게,
  // 정보가 많이 필요할 때는 작게. 고른 값은 기억해 둔다.
  const FS_MIN = 18, FS_MAX = 32;
  function curFontSize() {
    return parseFloat(getComputedStyle(document.documentElement)
      .getPropertyValue('--fs')) || 24;
  }
  function setFontSize(px) {
    const v = Math.min(FS_MAX, Math.max(FS_MIN, Math.round(px)));
    document.documentElement.style.setProperty('--fs', v + 'px');
    try { localStorage.setItem('cn.fs', String(v)); } catch (e) {}
    toast('글자 ' + v + 'px');
    renderLines();
  }
  try {
    const saved = parseFloat(localStorage.getItem('cn.fs'));
    if (saved) document.documentElement.style.setProperty('--fs', saved + 'px');
  } catch (e) {}

  // ── 뉴럴밴드 (키보드) ──
  document.addEventListener('keydown', e => {
    // 위/아래 스와이프 = 글자 크기
    if (e.key === 'ArrowUp')   { setFontSize(curFontSize() + 2); e.preventDefault(); return; }
    if (e.key === 'ArrowDown') { setFontSize(curFontSize() - 2); e.preventDefault(); return; }
    if (e.key === 'Enter' || e.key === ' ') {
      toggleListen();
      e.preventDefault();
    }
    // D: 진단 패널 켜기/끄기
    if (e.key === 'd' || e.key === 'D') {
      $debug.classList.toggle('show');
      e.preventDefault();
      return;
    }
    // ESC: 초기화
    if (e.key === 'Escape') {
      stopListen();
      $orig.textContent = '';
      $trans.textContent = '중국어를 말하면 번역됩니다';
      $trans.classList.add('empty');
      $prev.textContent = '';
      lastTranslated = '';
      lines = []; inFlight = 0; lastCommitAt = 0;
      liveText = ''; previewSrc = ''; liveSeq++;
      pendingLines = []; clearTimeout(revealTimer); revealTimer = null;
      finishedText = ''; renderLines();
      hideCurrency();
      $terms.classList.remove('show');
      e.preventDefault();
    }
  });
</script>
</body>
</html>
