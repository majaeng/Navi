<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>KO-Navi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 600px; height: 600px;
      overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .screen { width: 600px; height: 600px; display: none; flex-direction: column; }
    .screen.active { display: flex; }

    /* ── 홈 ── */
    #screen-home { padding: 28px 24px; gap: 12px; background: #000; }
    .title { font-size: 22px; font-weight: 700; color: #fff; text-align: center; letter-spacing: -0.5px; }
    .title span { color: #4a9eff; }

    .location-box {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 10px 14px;
    }
    .location-box .label { font-size: 10px; color: #555; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
    .location-box .value { color: #4a9eff; font-size: 12px; }

    .search-btn {
      background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 12px; padding: 13px 16px;
      cursor: pointer; display: flex; align-items: center; gap: 10px;
      color: #666; font-size: 14px; transition: all 150ms;
    }
    .search-btn:focus, .search-btn.focused {
      border-color: #4a9eff; background: rgba(74,158,255,0.08);
      box-shadow: 0 0 0 1px rgba(74,158,255,0.3); outline: none; color: #fff;
    }

    .dest-list { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow: hidden; }
    .dest-item {
      background: rgba(255,255,255,0.04); border: 1.5px solid transparent;
      border-radius: 12px; padding: 11px 14px; cursor: pointer;
      transition: all 150ms; display: flex; align-items: center; gap: 10px; min-height: 50px;
    }
    .dest-item:focus, .dest-item.focused {
      outline: none; border-color: #4a9eff; background: rgba(74,158,255,0.08);
      box-shadow: 0 0 0 1px rgba(74,158,255,0.2);
    }
    .dest-item .icon { font-size: 15px; }
    .dest-item .name { font-size: 13px; font-weight: 600; }
    .dest-item .addr { font-size: 10px; color: #555; margin-top: 1px; }
    .hint { font-size: 10px; color: #333; text-align: center; }
    .mode-btn {
      flex: 1; background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.10);
      border-radius: 12px; padding: 11px 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; color: #555; transition: all 150ms; display: flex;
      align-items: center; justify-content: center; gap: 6px;
    }
    .mode-btn:focus, .mode-btn.focused {
      border-color: #4a9eff; background: rgba(74,158,255,0.08); outline: none; color: #fff;
    }
    .mode-btn.active-mode {
      border-color: rgba(74,158,255,0.6); background: rgba(74,158,255,0.15); color: #fff;
    }
    .mode-btn.active-mode.focused {
      box-shadow: 0 0 0 1px rgba(74,158,255,0.4);
    }
    .section-label { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 0.8px; padding: 0 2px; }

    /* ── 검색 ── */
    #screen-search-input { padding: 20px; gap: 12px; background: #000; }
    .search-header { display: flex; align-items: center; gap: 10px; }
    .search-back { background: none; border: none; color: #4a9eff; font-size: 20px; cursor: pointer; padding: 4px 8px; }
    .search-input-box {
      flex: 1; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 10px 14px;
      color: #fff; font-size: 15px; outline: none;
    }
    .search-input-box:focus { border-color: #4a9eff; }
    .search-results { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-y: auto; }
    .search-result-item {
      background: rgba(255,255,255,0.04); border: 1.5px solid transparent;
      border-radius: 12px; padding: 11px 14px; cursor: pointer;
      transition: all 150ms;
    }
    .search-result-item:focus, .search-result-item.focused {
      outline: none; border-color: #4a9eff; background: rgba(74,158,255,0.08);
    }
    .search-result-item .r-name { font-size: 13px; font-weight: 600; }
    .search-result-item .r-addr { font-size: 10px; color: #555; margin-top: 2px; }
    .search-result-item .r-dist { font-size: 10px; color: #4a9eff; margin-top: 2px; }
    .search-empty { color: #444; font-size: 12px; text-align: center; padding: 30px 0; }
    .search-loading { color: #4a9eff; font-size: 12px; text-align: center; padding: 30px 0; }

    /* ── AR 네비 ── */
    #screen-nav { position: relative; background: #000; }
    #ar-canvas { position: absolute; top: 0; left: 0; width: 600px; height: 600px; }

    /* Meta 스타일 턴 배너 - 상단 중앙, 컴팩트 */
    .turn-banner {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 50px; padding: 8px 16px 8px 8px;
      display: flex; align-items: center; gap: 10px; z-index: 10;
      white-space: nowrap;
    }
    .turn-arrow-box {
      width: 32px; height: 32px;
      background: rgba(74,158,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .turn-info .turn-dist { font-size: 22px; color: #fff; font-weight: 800; line-height: 1; }
    .turn-info .turn-text { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }

    /* Meta 스타일 하단 카드 - 보라/파랑 frosted glass */
    .nav-card {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(90,50,180,0.72), rgba(30,70,200,0.65));
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 20px; padding: 14px 22px;
      min-width: 260px;
      z-index: 10;
    }
    .nav-card-dest {
      font-size: 18px; font-weight: 700; color: #fff;
      margin-bottom: 6px;
    }
    .nav-card-row {
      display: flex; align-items: center; gap: 6px;
    }
    .nav-stat {
      display: flex; align-items: baseline; gap: 3px;
    }
    .nav-stat .stat-val { font-size: 14px; font-weight: 600; color: #7dff9a; }
    .nav-stat .stat-label { font-size: 12px; color: rgba(255,255,255,0.75); }
    .nav-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.2); margin: 0 4px; }

    /* 중앙 조준점 */
    .compass-dot {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 8px; height: 8px;
      border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      z-index: 5; pointer-events: none;
    }
    .compass-dot::after {
      content: ''; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 3px; height: 3px;
      background: #4a9eff; border-radius: 50%;
    }

    /* 닫기 버튼 - 우상단, 매우 작고 투명 */
    .back-btn {
      position: absolute; top: 18px; right: 14px;
      width: 28px; height: 28px;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%; color: rgba(255,255,255,0.5); font-size: 12px;
      cursor: pointer; z-index: 20; opacity: 0.6;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 200ms;
    }
    .back-btn:hover, .back-btn:focus { opacity: 1; outline: none; }

    /* 로딩 */
    .loading-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; z-index: 30;
    }
    .loading-overlay.hidden { display: none; }
    .spinner {
      width: 32px; height: 32px; border: 2.5px solid rgba(255,255,255,0.1);
      border-top-color: #4a9eff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 12px; color: #666; }

    /* 현재위치 펄스 애니메이션 */
    @keyframes pulse {
      0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
      100% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- 홈 -->
<div id="screen-home" class="screen active">
  <div class="title">KO-<span>Navi</span></div>
  <div class="location-box">
    <div class="label">현재 위치</div>
    <div class="value" id="current-location">위치 확인 중...</div>
  </div>
  <button class="search-btn focusable" id="search-open-btn" tabindex="0">
    <span>🔍</span><span>장소 검색...</span>
  </button>
  <div style="display:flex;gap:8px">
    <button class="mode-btn focusable active-mode" id="btn-foot" tabindex="0">🚶 도보</button>
    <button class="mode-btn focusable" id="btn-drive" tabindex="0">🚗 드라이브</button>
  </div>
  <div id="recent-section" style="display:none">
    <div class="section-label">최근 목적지</div>
    <div class="dest-list" id="recent-list"></div>
  </div>
  <div class="section-label" id="preset-label">즐겨찾기</div>
  <div class="dest-list" id="dest-list"></div>
  <div class="hint">↑↓ 방향키 · Enter 선택</div>
</div>

<!-- 검색 -->
<div id="screen-search-input" class="screen">
  <div class="search-header">
    <button class="search-back focusable" id="search-back-btn">←</button>
    <input class="search-input-box" id="search-input" type="text" placeholder="장소명 입력..." autocomplete="off">
  </div>
  <div id="search-status" class="search-empty">검색어를 입력하세요</div>
  <div class="search-results" id="search-results"></div>
</div>

<!-- AR 네비 -->
<div id="screen-nav" class="screen">
  <canvas id="ar-canvas" width="600" height="600"></canvas>

  <!-- 중앙 고정점 -->
  <div class="compass-dot"></div>

  <!-- 턴 안내 (상단) -->
  <div class="turn-banner" id="turn-banner">
    <div class="turn-arrow-box" id="turn-arrow">↑</div>
    <div class="turn-info">
      <div class="turn-dist" id="turn-dist">--</div>
      <div class="turn-text" id="turn-text">경로 계산 중...</div>
    </div>
  </div>

  <!-- 하단 정보 카드 -->
  <div class="nav-card">
    <div class="nav-card-dest" id="nav-dest-name"></div>
    <div class="nav-card-row">
      <span style="font-size:13px">🚶</span>
      <div class="nav-stat">
        <span class="stat-val" id="nav-eta">--</span>
        <span class="stat-label">분</span>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-stat">
        <span class="stat-val" id="nav-dist">--</span>
        <span class="stat-label">km</span>
      </div>
    </div>
  </div>

  <!-- 오프라인 인디케이터 -->
  <div id="offline-indicator" style="display:none;position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(255,150,0,0.8);border-radius:20px;padding:4px 12px;font-size:11px;color:#fff;z-index:15;align-items:center;gap:5px;">
    <span>⚠</span><span>오프라인 - 캐시 경로 사용 중</span>
  </div>

  <!-- 뒤로 (Escape 키로도 동작, 버튼은 최소화) -->
  <button class="back-btn focusable" id="back-btn">✕</button>

  <!-- 로딩 -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">경로 계산 중...</div>
  </div>
</div>

<script>
  const KAKAO_JS_KEY = '14b2d81032a1fb85494844643078aadc';
  const MAPBOX_TOKEN = 'pk.eyJ1IjoibWFqYWVuZyIsImEiOiJjbXNlNTk5eWwwNWgyMnhzOGUxdG5vM3RoIn0.AqqL86GG17pLS0MaSkN4ig';
  // 국내 도보 경로 (SK TMAP)
  const TMAP_KEY = 'XKa6vUNY752zXMhjUt3iA53CwCaXU8S73lMXAiZj';

  // 폰에서 보낸 목적지를 받아오는 릴레이
  const DEST_RELAY = 'https://dest-relay.majaeng.workers.dev';

  const TENCENT_KEY = 'VHLBZ-H7XCB-ZKJUJ-NDVGG-6C4OH-FDFOX';

  // 중국 영역 판단 (한국/일본 제외)
  function isInChina(lat, lng) {

    // 대만 제외
    if (lat >= 21 && lat <= 26 && lng >= 119 && lng <= 123) return false;
    return lat >= 18 && lat <= 53 && lng >= 73 && lng <= 135;
  }
  function currentCountry() {
    return (currentPos && isInChina(currentPos.lat, currentPos.lng)) ? 'cn' : 'kr';
  }

  const KR_PRESETS = [
    { name: '강남역',     addr: '서울 강남구 강남대로 396',   lat: 37.4979, lng: 127.0276, icon: '🚇' },
    { name: '홍대입구역', addr: '서울 마포구 양화로 160',     lat: 37.5573, lng: 126.9248, icon: '🚇' },
    { name: '명동',       addr: '서울 중구 명동길 14',        lat: 37.5636, lng: 126.9869, icon: '🛍' },
    { name: '경복궁',     addr: '서울 종로구 사직로 161',     lat: 37.5796, lng: 126.9770, icon: '🏯' },
    { name: '인천공항',   addr: '인천 중구 공항로 272',       lat: 37.4602, lng: 126.4407, icon: '✈️' },
  ];
  const CN_PRESETS = [
    { name: '天安门广场', addr: '北京市东城区',               lat: 39.9055, lng: 116.3976, icon: '🏛' },
    { name: '外滩',       addr: '上海市黄浦区中山东一路',     lat: 31.2397, lng: 121.4901, icon: '🌃' },
    { name: '西湖',       addr: '浙江省杭州市西湖区',         lat: 30.2590, lng: 120.1452, icon: '🌊' },
    { name: '故宫',       addr: '北京市东城区景山前街4号',     lat: 39.9163, lng: 116.3972, icon: '🏯' },
    { name: '上海浦东机场', addr: '上海市浦东新区迎宾大道',   lat: 31.1443, lng: 121.8083, icon: '✈️' },
  ];

  let currentPos = null;
  let currentHeading = null;
  let focusIndex = 0;
  let homeFocusables = [];
  let watchId = null;
  let routeSteps = [];
  let routeCoords = [];
  let currentStepIndex = 0;
  let selectedDest = null;
  let searchResults = [];
  let searchFocusIndex = 0;
  let rerouteTimer = null;
  let isOffline = false;
  let navProfile = 'foot'; // 'foot' | 'driving'
  let pulsePhase = 0;
  let animFrame = null;
  const POS_X = 300, POS_Y = 420;

  // ── 최근 목적지 ──
  function loadRecentDests() {
    try { return JSON.parse(localStorage.getItem('ko_navi_recent') || '[]'); } catch { return []; }
  }
  function saveRecentDest(dest) {
    let list = loadRecentDests().filter(d => d.name !== dest.name);
    list.unshift({ name: dest.name, addr: dest.addr, lat: dest.lat, lng: dest.lng, icon: '🕐' });
    if (list.length > 5) list = list.slice(0, 5);
    try { localStorage.setItem('ko_navi_recent', JSON.stringify(list)); } catch {}
  }

  // ── 오프라인 캐시 ──
  function cacheRoute(dest, coords, steps) {
    try {
      localStorage.setItem('ko_navi_cache', JSON.stringify({ dest, coords, steps, ts: Date.now() }));
    } catch {}
  }
  function loadCachedRoute() {
    try { return JSON.parse(localStorage.getItem('ko_navi_cache') || 'null'); } catch { return null; }
  }
  function setOffline(v) {
    isOffline = v;
    const el = document.getElementById('offline-indicator');
    if (el) el.style.display = v ? 'flex' : 'none';
  }

  const canvas = document.getElementById('ar-canvas');
  const ctx = canvas.getContext('2d');

  let voiceOn = true;               // 음성 안내 on/off
  let spokenDistBucket = null;      // 현재 스텝에서 안내한 거리 구간
  let isRerouting = false;          // 재경로 계산 중 플래그
  let mapView = { centerLat: 0, centerLng: 0, zoom: 16, pitch: 0 };
  let pitchTarget = 0;              // 0 = 탑뷰, 1 = 쿼터뷰
  const PITCH_K = 0.0022;           // 원근 압축 강도
  const ZOOM_MIN = 13, ZOOM_MAX = 18;
  const TILE_SIZE = 256;
  const vtCache = {};       // key -> [{props, geom}] 도로 피처 배열
  const vtLoading = new Set();

  // ── 인라인 MVT 파서 (Protocol Buffer, 외부 라이브러리 없음) ──
  function parseMVT(buffer) {
    const buf = new Uint8Array(buffer);
    const dec = new TextDecoder();

    function varint(p) {
      let shift = 0, val = 0, b;
      do { b = buf[p++]; val += (b & 0x7f) * (2 ** shift); shift += 7; } while (b & 0x80);
      return { val, pos: p };
    }
    function packedU32(s, e) {
      const a = []; let p = s;
      while (p < e) { const r = varint(p); a.push(r.val); p = r.pos; }
      return a;
    }
    function zz(n) { return (n >>> 1) ^ -(n & 1); }

    function decodeGeom(ints) {
      const rings = []; let ring, x = 0, y = 0, i = 0;
      while (i < ints.length) {
        const cl = ints[i++], cmd = cl & 7, cnt = cl >> 3;
        if (cmd === 1) {
          for (let j = 0; j < cnt; j++) {
            x += zz(ints[i++]); y += zz(ints[i++]);
            ring = [{x, y}]; rings.push(ring);
          }
        } else if (cmd === 2) {
          for (let j = 0; j < cnt; j++) {
            x += zz(ints[i++]); y += zz(ints[i++]);
            ring && ring.push({x, y});
          }
        }
        // cmd 7 = ClosePath, params 없음
      }
      return rings;
    }

    function layerVal(s, e) {
      let p = s, v = null;
      while (p < e) {
        const r = varint(p); p = r.pos;
        const fn = r.val >> 3, wt = r.val & 7;
        const dv = new DataView(buf.buffer);
        if (wt === 2) { const l = varint(p); p = l.pos; if (fn===1) v = dec.decode(buf.slice(p, p+l.val)); p += l.val; }
        else if (wt === 0) { const l = varint(p); p = l.pos; if (fn===6) v = zz(l.val); else if (fn===4||fn===5) v = l.val; else if (fn===7) v = !!l.val; }
        else if (wt === 5) { if (fn===2) v = dv.getFloat32(p,true); p+=4; }
        else if (wt === 1) { if (fn===3) v = dv.getFloat64(p,true); p+=8; }
      }
      return v;
    }

    function readLayer(s, e) {
      let p = s, name = '';
      const keys = [], vals = [], rawFeats = [];
      while (p < e) {
        const r = varint(p); p = r.pos;
        const fn = r.val >> 3, wt = r.val & 7;
        if (wt === 0) { const l = varint(p); p = l.pos; } // extent 등 무시해도 됨 (기본 4096)
        else if (wt === 2) {
          const l = varint(p); p = l.pos;
          const ds = p, de = p + l.val; p = de;
          if (fn===1) name = dec.decode(buf.slice(ds, de));
          else if (fn===3) keys.push(dec.decode(buf.slice(ds, de)));
          else if (fn===4) vals.push(layerVal(ds, de));
          else if (fn===2) rawFeats.push([ds, de]);
        } else if (wt===1) p+=8; else if (wt===5) p+=4;
      }
      const features = rawFeats.map(([fs, fe]) => {
        let fp = fs, type = 0, tags = [], geomInts = [];
        while (fp < fe) {
          const r = varint(fp); fp = r.pos;
          const fn = r.val >> 3, wt = r.val & 7;
          if (wt===0) { const l = varint(fp); fp = l.pos; if (fn===3) type = l.val; }
          else if (wt===2) { const l = varint(fp); fp = l.pos; if (fn===2) tags = packedU32(fp, fp+l.val); else if (fn===4) geomInts = packedU32(fp, fp+l.val); fp += l.val; }
          else if (wt===1) fp+=8; else if (wt===5) fp+=4;
        }
        if (type !== 2) return null; // LineString만 (도로)
        const props = {};
        for (let i = 0; i < tags.length-1; i+=2) props[keys[tags[i]]] = vals[tags[i+1]];
        return { props, geom: decodeGeom(geomInts) };
      }).filter(Boolean);
      return { name, features };
    }

    const layers = {}; let pos = 0;
    while (pos < buf.length) {
      const r = varint(pos); pos = r.pos;
      const fn = r.val >> 3, wt = r.val & 7;
      if (wt===2) { const l = varint(pos); pos = l.pos; const e = pos + l.val; if (fn===3) { const lay = readLayer(pos, e); if (lay.name) layers[lay.name] = lay; } pos = e; }
      else if (wt===0) { const l = varint(pos); pos = l.pos; }
      else if (wt===1) pos+=8; else if (wt===5) pos+=4;
    }
    return layers;
  }

  // ── 벡터 타일 로드 ──
  async function loadVectorTile(z, tx, ty) {
    const key = `${z}/${tx}/${ty}`;
    if (key in vtCache || vtLoading.has(key)) return;
    vtLoading.add(key);
    try {
      const url = `https://api.mapbox.com/v4/mapbox.mapbox-streets-v8/${z}/${tx}/${ty}.mvt?access_token=${MAPBOX_TOKEN}`;
      const resp = await fetch(url);
      if (!resp.ok) throw 0;
      const layers = parseMVT(await resp.arrayBuffer());
      vtCache[key] = (layers['road'] || { features: [] }).features;
    } catch { vtCache[key] = []; }
    vtLoading.delete(key);
  }

  // ── 도로 벡터선 그리기 ──
  function drawRoads(cx, cy) {
    const z = mapView.zoom;
    const EXTENT = 4096;
    const tilesNeeded = Math.ceil(300 / TILE_SIZE) + 1;

    for (let tx = Math.floor(cx) - tilesNeeded; tx <= Math.floor(cx) + tilesNeeded; tx++) {
      for (let ty = Math.floor(cy) - tilesNeeded; ty <= Math.floor(cy) + tilesNeeded; ty++) {
        const key = `${z}/${tx}/${ty}`;
        if (!(key in vtCache)) { loadVectorTile(z, tx, ty); continue; }
        const roads = vtCache[key];
        if (!roads.length) continue;

        for (const { props, geom } of roads) {
          const cls = props.class || '';
          let lw, alpha;
          const z = mapView.zoom;
          // 줌 낮을 때 세부 도로 숨김 (건물 외곽처럼 보이는 현상 방지)
          if (['path','footway','pedestrian','steps','track'].includes(cls)) {
            if (z < 17) continue; // 줌 17 미만이면 보행로 숨김
            lw = 0.6; alpha = 0.20;
          } else if (['service','alley'].includes(cls)) {
            if (z < 16) continue;
            lw = 0.8; alpha = 0.28;
          } else if (['motorway','trunk'].includes(cls))       { lw = 2.2; alpha = 0.90; }
          else if (['primary','secondary'].includes(cls))      { lw = 1.6; alpha = 0.72; }
          else if (['tertiary','street','street_limited'].includes(cls)) { lw = 1.1; alpha = 0.50; }
          else { lw = 0.9; alpha = 0.38; }

          ctx.beginPath();
          ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
          ctx.lineWidth = lw;
          ctx.lineJoin = 'round'; ctx.lineCap = 'round';

          for (const ring of geom) {
            let first = true;
            for (const {x, y} of ring) {
              const fx = (tx + x / EXTENT - cx) * TILE_SIZE + POS_X;
              const fy = (ty + y / EXTENT - cy) * TILE_SIZE + POS_Y;
              const p = proj(fx, fy);
              if (!p.ok) { first = true; continue; }   // 지평선 너머는 끊기
              first ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
              first = false;
            }
          }
          ctx.stroke();
        }
      }
    }
  }

  // ── 중국 좌표계 변환 ──
  //  중국은 GPS 좌표(WGS-84)를 그대로 쓰지 않고 의도적으로 틀어놓은
  //  GCJ-02를 쓴다. 변환하지 않으면 300~500m 어긋난다.
  function gcjDelta(lat, lng) {
    const a = 6378245.0, ee = 0.00669342162296594323;
    function tLat(x, y) {
      let r = -100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
      r += (20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
      r += (20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
      r += (160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
      return r;
    }
    function tLng(x, y) {
      let r = 300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
      r += (20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
      r += (20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
      r += (150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
      return r;
    }
    const radlat = lat/180*Math.PI;
    let magic = Math.sin(radlat);
    magic = 1 - ee*magic*magic;
    const sq = Math.sqrt(magic);
    const dLat = (tLat(lng-105, lat-35)*180) / ((a*(1-ee))/(magic*sq)*Math.PI);
    const dLng = (tLng(lng-105, lat-35)*180) / (a/sq*Math.cos(radlat)*Math.PI);
    return { dLat, dLng };
  }
  function gcj02ToWgs84(lat, lng) {   // 텐센트 결과 → GPS 좌표
    const d = gcjDelta(lat, lng);
    return { lat: lat - d.dLat, lng: lng - d.dLng };
  }
  function wgs84ToGcj02(lat, lng) {   // GPS 좌표 → 텐센트 요청용
    const d = gcjDelta(lat, lng);
    return { lat: lat + d.dLat, lng: lng + d.dLng };
  }

  // ── JSONP 헬퍼 (텐센트 API CORS 우회) ──
  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = '_tmap_' + (jsonp.n = (jsonp.n || 0) + 1) + '_' + Date.now();
      window[cb] = data => { delete window[cb]; document.head.removeChild(s); resolve(data); };
      const s = document.createElement('script');
      s.src = url + `&output=jsonp&callback=${cb}`;
      s.onerror = () => { delete window[cb]; reject(); };
      document.head.appendChild(s);
    });
  }

  function doSearch(q) {
    if (currentCountry() === 'cn') {
      doTencentSearch(q);
    } else {
      doKakaoSearch(q);

  function doKakaoSearch(q) {
    loadKakaoSDK().then(() => {
      const ps = new kakao.maps.services.Places();
      const opts = currentPos
        ? { location: new kakao.maps.LatLng(currentPos.lat, currentPos.lng), sort: kakao.maps.services.SortBy.DISTANCE }
        : {};
      ps.keywordSearch(q, (data, status) => {
        const el = document.getElementById('search-status');
        if (status === kakao.maps.services.Status.OK) {
          const normalized = data.map(p => ({
            name: p.place_name,
            addr: p.road_address_name || p.address_name,
            lat: parseFloat(p.y), lng: parseFloat(p.x),
            dist: p.distance
          }));
          renderSearchResults(normalized);
        } else {
          el.className = 'search-empty'; el.textContent = '검색 결과가 없습니다';
          document.getElementById('search-results').innerHTML = '';
        }
      }, opts);
    });
  }

  function doTencentSearch(q) {
    // 현재위치 기준 5km 반경 검색, 없으면 중국 전역
    const boundary = currentPos
      ? `nearby(${currentPos.lat},${currentPos.lng},5000,1)`
      : 'region(中国,0)';
    const url = `https://apis.map.qq.com/ws/place/v1/search?keyword=${encodeURIComponent(q)}&boundary=${boundary}&page_size=8&key=${TENCENT_KEY}`;
    jsonp(url).then(data => {
      const el = document.getElementById('search-status');
      if (data.status === 0 && data.data && data.data.length > 0) {
        const normalized = data.data.map(p => {
          // GCJ-02 → WGS-84 변환 (GPS/OSRM용)
          const wgs = gcj02ToWgs84(p.location.lat, p.location.lng);
          return { name: p.title, addr: p.address, lat: wgs.lat, lng: wgs.lng, dist: null };
        });
        renderSearchResults(normalized);
      } else {
        el.className = 'search-empty'; el.textContent = '검색 결과가 없습니다';
        document.getElementById('search-results').innerHTML = '';
      }
    }).catch(() => {
      document.getElementById('search-status').className = 'search-empty';
      document.getElementById('search-status').textContent = '검색 오류가 발생했습니다';

  // ── 네비 시작 ──

      startRenderLoop();

    }).catch(() => {
      // 네트워크 실패 시 캐시 경로 복원
      const cached = loadCachedRoute();
      if (cached && cached.dest.name === dest.name) {
        routeCoords = cached.coords;
        routeSteps = cached.steps;
        currentStepIndex = 0;

      startRenderLoop();

  // 네비 시작 시 현재위치 중심, 줌 16 고정 (Meta 스타일: 주변 도로만 보임)
  function fitRouteBounds() {
    if (!currentPos) return;
    mapView.centerLat = currentPos.lat;
    mapView.centerLng = currentPos.lng;
    mapView.zoom = 16; // 고정 줌 - 목적지가 멀어도 현재 주변만 표시
  }

  // ══════════════════════════════════════════
  //  텐센트 경로 안내 (중국 도로 데이터)
  //  OSRM 공개 서버는 OpenStreetMap 기반이라 중국 도로가 부실하고
  //  중국에서 접속도 불안정하다. 중국에서는 텐센트를 쓴다.
  // ══════════════════════════════════════════

  // 텐센트의 회전 설명(중국어) → OSRM 형식으로.
  // ※ 순서 중요: '좌회전'보다 '좌전방'을 먼저 봐야 한다.
  const TENCENT_ACT = [
    [/掉头/,            'turn', 'uturn'],
    [/左前方|靠左/,      'turn', 'slight left'],
    [/右前方|靠右/,      'turn', 'slight right'],
    [/左后方/,          'turn', 'sharp left'],
    [/右后方/,          'turn', 'sharp right'],
    [/左转|向左/,        'turn', 'left'],
    [/右转|向右/,        'turn', 'right'],
  ];

  function fetchTencentRoute(from, dest) {
    const mode = navProfile === 'driving' ? 'driving' : 'walking';
    const f = wgs84ToGcj02(from.lat, from.lng);
    const t = wgs84ToGcj02(dest.lat, dest.lng);
    const url = `https://apis.map.qq.com/ws/direction/v1/${mode}/`
              + `?from=${f.lat},${f.lng}&to=${t.lat},${t.lng}&key=${TENCENT_KEY}`;

    return jsonp(url).then(d => {
      if (d.status !== 0) throw new Error(d.message || '텐센트 경로 실패');
      const r = d.result && d.result.routes && d.result.routes[0];
      if (!r) throw new Error('경로 없음');

      // 폴리라인은 차분 압축돼 온다 — 앞 값에 더해가며 복원
      const pl = r.polyline.slice();
      for (let i = 2; i < pl.length; i++) pl[i] = pl[i - 2] + pl[i] / 1000000;
      const pts = [];
      for (let i = 0; i + 1 < pl.length; i += 2) {
        const w = gcj02ToWgs84(pl[i], pl[i + 1]);
        pts.push([w.lng, w.lat]);          // OSRM과 같은 [경도, 위도] 순서
      }
      if (pts.length < 2) throw new Error('경로 좌표 부족');

      const steps = (r.steps || []).map(st => {
        const i0 = Array.isArray(st.polyline_idx) ? st.polyline_idx[0] : 0;
        const loc = pts[Math.min(i0, pts.length - 1)];
        const desc = (st.act_desc || '') + (st.dir_desc || '') + (st.instruction || '');
        let type = 'turn', mod = 'straight';
        for (const [re, ty, md] of TENCENT_ACT) {
          if (re.test(desc)) { type = ty; mod = md; break; }
        }
        return {
          distance: st.distance || 0,
          duration: (st.duration || 0) * 60,   // 텐센트는 '분' 단위
          name: st.road_name || '',
          maneuver: { type, modifier: mod, location: loc },
        };
      });
      steps.push({
        distance: 0, duration: 0, name: '',
        maneuver: { type: 'arrive', modifier: '', location: pts[pts.length - 1] },
      });

      return {
        distance: r.distance,
        duration: (r.duration || 0) * 60,     // 분 → 초
        geometry: { coordinates: pts },
        legs: [{ steps }],
      };
    });
  }

  // ══════════════════════════════════════════
  //  국내 도보 경로 (TMAP 보행자 경로안내)
  //  OSRM은 오픈스트리트맵 기반이라 국내 보도 데이터가 부실하다.
  //  TMAP은 횡단보도·육교·지하보도까지 반영된 실제 보행 경로를 준다.
  // ══════════════════════════════════════════

  // TMAP 회전 코드 → OSRM 형식
  const TMAP_TURN = {
    11: ['turn', 'straight'],  12: ['turn', 'left'],        13: ['turn', 'right'],
    14: ['turn', 'uturn'],     16: ['turn', 'sharp left'],  17: ['turn', 'slight left'],
    18: ['turn', 'slight right'], 19: ['turn', 'sharp right'],
    200: ['depart', ''],       201: ['arrive', ''],
  };

  function fetchTmapRoute(from, dest) {
    // 자동차 모드는 TMAP 보행자 API 대상이 아니다
    if (navProfile === 'driving') return fetchOSRMRoute(from, dest);

    return fetch('https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&format=json', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'appKey': TMAP_KEY },
      body: JSON.stringify({
        startX: from.lng, startY: from.lat,
        endX: dest.lng,   endY: dest.lat,
        reqCoordType: 'WGS84GEO', resCoordType: 'WGS84GEO',
        startName: '출발', endName: '도착',
      }),
    }).then(r => r.json()).then(d => {
      const feats = d.features || [];
      if (!feats.length) throw new Error(d.error && d.error.message || 'TMAP 경로 없음');

      const head = (feats[0] && feats[0].properties) || {};
      const pts = [];
      const steps = [];

      for (const f of feats) {
        const pr = f.properties || {}, g = f.geometry || {};
        if (g.type === 'LineString') {
          // 경로선 — 중복 좌표는 건너뛴다
          for (const c of g.coordinates) {
            const last = pts[pts.length - 1];
            if (!last || last[0] !== c[0] || last[1] !== c[1]) pts.push(c);
          }
        } else if (g.type === 'Point') {
          const [type, mod] = TMAP_TURN[pr.turnType] || ['turn', 'straight'];
          steps.push({
            distance: 0,        // 아래에서 다음 지점까지 거리로 채운다
            duration: 0,
            name: (pr.description || '').replace(/^,\s*/, '').trim(),
            maneuver: { type, modifier: mod, location: g.coordinates },
          });
        }
      }
      if (pts.length < 2) throw new Error('TMAP 경로 좌표 부족');

      // 각 안내 지점 사이 거리 채우기
      for (let i = 0; i < steps.length - 1; i++) {
        const a = steps[i].maneuver.location, b = steps[i + 1].maneuver.location;
        steps[i].distance = Math.round(
          Math.hypot((b[1] - a[1]) * 111320, (b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180))
        );
      }
      if (!steps.length || steps[steps.length - 1].maneuver.type !== 'arrive') {
        steps.push({ distance: 0, duration: 0, name: '',
          maneuver: { type: 'arrive', modifier: '', location: pts[pts.length - 1] } });
      }

      return {
        distance: head.totalDistance || 0,
        duration: head.totalTime || 0,      // TMAP은 초 단위
        geometry: { coordinates: pts },
        legs: [{ steps }],
      };
    });
  }

  // 나라에 따라 경로 엔진을 고른다. 실패하면 OSRM으로 넘어간다.
  function fetchRoute(from, dest) {
    if (currentCountry() === 'cn') {
      return fetchTencentRoute(from, dest).catch(e => {
        console.warn('텐센트 경로 실패, OSRM으로 대체:', e && e.message);
        return fetchOSRMRoute(from, dest);
      });
    }
    return fetchTmapRoute(from, dest).catch(e => {
      console.warn('TMAP 경로 실패, OSRM으로 대체:', e && e.message);
      return fetchOSRMRoute(from, dest);
    });
  }

  // ── OSRM (한국·그 외 / 텐센트 실패 시 대체) ──
  function fetchOSRMRoute(from, dest) {
    const url = `https://router.project-osrm.org/route/v1/${navProfile}/${from.lng},${from.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson&steps=true`;
    return fetch(url).then(r => r.json()).then(d => d.routes?.[0] || null);
  }

  // ── 이동 수단 선택 ──
  function setProfile(mode) {
    navProfile = mode;
    document.getElementById('btn-foot').classList.toggle('active-mode', mode === 'foot');
    document.getElementById('btn-drive').classList.toggle('active-mode', mode === 'driving');
    // 네비 카드 아이콘 업데이트
    const icon = document.querySelector('.nav-card-row span');
    if (icon) icon.textContent = mode === 'foot' ? '🚶' : '🚗';
  }
  document.getElementById('btn-foot').addEventListener('click', () => setProfile('foot'));
  document.getElementById('btn-drive').addEventListener('click', () => setProfile('driving'));

  // ── 타일 수학 ──
  function latLngToTilePixel(lat, lng, z) {
    const n = Math.pow(2, z);
    const tx = (lng + 180) / 360 * n;
    const latRad = lat * Math.PI / 180;
    const ty = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
    return { tx, ty };
  }

  // ── 원근 투영 (탑뷰 → 쿼터뷰) ──
  // 현재 위치(POS_X, POS_Y)를 기준점으로, 앞쪽(위)일수록 압축·수렴
  function proj(x, y) {
    const p = mapView.pitch;
    if (p < 0.005) return { x, y, ok: true };
    const d = POS_Y - y;                  // 앞쪽 거리 (양수 = 전방)
    const denom = 1 + d * PITCH_K * p;
    if (denom < 0.15) return { x, y, ok: false };  // 지평선 너머 = 클립
    return {
      x: POS_X + (x - POS_X) / denom,
      y: POS_Y - d / denom,
      ok: true,
    };
  }

  function latLngToPixel(lat, lng) {
    const { tx: cx, ty: cy } = latLngToTilePixel(mapView.centerLat, mapView.centerLng, mapView.zoom);
    const { tx, ty } = latLngToTilePixel(lat, lng, mapView.zoom);
    // 현재위치가 POS_X, POS_Y (하단 1/3)에 오도록 오프셋
    const fx = (tx - cx) * TILE_SIZE + POS_X;
    const fy = (ty - cy) * TILE_SIZE + POS_Y;
    return proj(fx, fy);
  }

  // ── 렌더 루프 ──
  function startRenderLoop() {
    if (animFrame) cancelAnimationFrame(animFrame);
    function loop() {
      pulsePhase = (pulsePhase + 0.025) % 1;
      // 카메라 각도 부드럽게 전환 (탑뷰 → 쿼터뷰)
      if (Math.abs(mapView.pitch - pitchTarget) > 0.001) {
        mapView.pitch += (pitchTarget - mapView.pitch) * 0.045;
      } else {
        mapView.pitch = pitchTarget;
      }
      renderMap();
      animFrame = requestAnimationFrame(loop);
    }
    loop();
  }
  function stopRenderLoop() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  }

  // ── Canvas 렌더링 ──
  function renderMap() {
    ctx.clearRect(0, 0, 600, 600);

    const z = mapView.zoom;
    const { tx: cx, ty: cy } = latLngToTilePixel(mapView.centerLat, mapView.centerLng, z);

    // 벡터 도로선 (Mapbox Streets MVT → 흰 선, 검정=투명)
    drawRoads(cx, cy);

    // 경로선 (Meta 스타일 - 얇고 선명한 파란선)
    if (routeCoords.length > 1) {
      // 외곽 글로우
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(74,158,255,0.18)';
      ctx.lineWidth = 9; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      let started = false;
      routeCoords.forEach(pt => {
        const p = latLngToPixel(pt.lat, pt.lng);
        if (!p.ok) { started = false; return; }
        started ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
        started = true;
      });
      ctx.stroke();

      // 메인선 (얇고 선명)
      ctx.beginPath();
      ctx.strokeStyle = '#4a9eff';
      ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(74,158,255,0.9)'; ctx.shadowBlur = 8;
      started = false;
      routeCoords.forEach(pt => {
        const p = latLngToPixel(pt.lat, pt.lng);
        if (!p.ok) { started = false; return; }
        started ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
        started = true;
      });
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // 목적지 핀 or 화면 밖이면 가장자리 방향 인디케이터
    if (selectedDest) {
      const { x, y } = latLngToPixel(selectedDest.lat, selectedDest.lng);
      const margin = 24;
      const onScreen = x > margin && x < 600-margin && y > margin && y < 600-margin;
      if (onScreen) {
        drawDestPin(x, y);
      } else {
        drawDestEdgeIndicator(x, y);
      }
    }

    // 현재 위치 (펄스 애니메이션)
    if (currentPos) {
      const { x, y } = latLngToPixel(currentPos.lat, currentPos.lng);
      drawCurrentPos(x, y);
    }
  }

  function drawDestPin(x, y) {
    // 물방울 핀 (구글맵 스타일)
    ctx.save();
    ctx.translate(x, y);
    // 그림자
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
    // 핀 몸통 (원)
    ctx.beginPath(); ctx.arc(0, -14, 11, 0, Math.PI*2);
    ctx.fillStyle = '#e8333a'; ctx.fill();
    // 핀 꼭지
    ctx.beginPath();
    ctx.moveTo(-7, -5); ctx.lineTo(7, -5); ctx.lineTo(0, 6);
    ctx.closePath(); ctx.fillStyle = '#e8333a'; ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    // 핀 내부 흰 원
    ctx.beginPath(); ctx.arc(0, -14, 5, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
  }

  // 목적지가 화면 밖일 때 가장자리 방향 인디케이터
  function drawDestEdgeIndicator(destX, destY) {
    const cx = 300, cy = 300; // 화면 중심
    const pad = 20; // 가장자리 여백
    const W = 600, H = 600;

    // 화면 중심 → 목적지 방향 각도
    const angle = Math.atan2(destY - cy, destX - cx);
    const cos = Math.cos(angle), sin = Math.sin(angle);

    // 화면 가장자리 교차점 계산
    let ex, ey;
    const tx = cos > 0 ? (W - pad - cx) / cos : cos < 0 ? -(cx - pad) / cos : Infinity;
    const ty = sin > 0 ? (H - pad - cy) / sin : sin < 0 ? -(cy - pad) / sin : Infinity;
    const t = Math.min(Math.abs(tx), Math.abs(ty));
    ex = cx + cos * t;
    ey = cy + sin * t;

    // 클램프
    ex = Math.max(pad, Math.min(W - pad, ex));
    ey = Math.max(pad, Math.min(H - pad, ey));

    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(angle);

    // 삼각형 화살표
    const sz = 11;
    ctx.beginPath();
    ctx.moveTo(sz, 0);
    ctx.lineTo(-sz * 0.7, -sz * 0.6);
    ctx.lineTo(-sz * 0.7,  sz * 0.6);
    ctx.closePath();
    ctx.fillStyle = '#e8333a';
    ctx.shadowColor = 'rgba(232,51,58,0.7)';
    ctx.shadowBlur = 8;
    ctx.fill();

    // 흰 테두리
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  function drawCurrentPos(x, y) {
    // 외부 펄스 링
    const pulseR = 14 + pulsePhase * 22;
    const pulseAlpha = (1 - pulsePhase) * 0.3;
    ctx.beginPath(); ctx.arc(x, y, pulseR, 0, Math.PI*2);
    ctx.fillStyle = `rgba(74,158,255,${pulseAlpha})`; ctx.fill();

    // 중간 링 (흰색)
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(255,255,255,0.4)'; ctx.shadowBlur = 6;
    ctx.fill(); ctx.shadowBlur = 0;

    // 내부 파란/보라 그라디언트 원 (Meta 스타일)
    const grad = ctx.createRadialGradient(x-2, y-2, 1, x, y, 9);
    grad.addColorStop(0, '#a78bfa');
    grad.addColorStop(1, '#3b82f6');
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI*2);
    ctx.fillStyle = grad; ctx.fill();
  }

  // ── 줌 (키보드 전용) ──
  function zoomIn()  { if (mapView.zoom < ZOOM_MAX) mapView.zoom++; }
  function zoomOut() { if (mapView.zoom > ZOOM_MIN) mapView.zoom--; }

  // ── 경로 이탈 감지 ──
  function distToRoute(lat, lng) {
    if (routeCoords.length < 2) return Infinity;
    let minD = Infinity;
    for (let i = 0; i < routeCoords.length - 1; i++) {
      const d = pointToSegmentDist(lat, lng, routeCoords[i], routeCoords[i+1]);
      if (d < minD) minD = d;
    }
    return minD;
  }
  function pointToSegmentDist(lat, lng, a, b) {
    // 단순 거리 근사 (km)
    const dx = b.lng - a.lng, dy = b.lat - a.lat;
    if (dx === 0 && dy === 0) return getDistanceKm(lat, lng, a.lat, a.lng);
    const t = Math.max(0, Math.min(1, ((lng - a.lng)*dx + (lat - a.lat)*dy) / (dx*dx + dy*dy)));
    return getDistanceKm(lat, lng, a.lat + t*dy, a.lng + t*dx);
  }

  // ── GPS 추적 ──
  function startTracking(dest) {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(pos => {
      currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (pos.coords.heading != null) currentHeading = pos.coords.heading;
      mapView.centerLat = currentPos.lat;
      mapView.centerLng = currentPos.lng;
      // 마지막 위치 캐시
      try { localStorage.setItem('ko_navi_last_pos', JSON.stringify(currentPos)); } catch {}
      setOffline(false);

      const remaining = getDistanceKm(currentPos.lat, currentPos.lng, dest.lat, dest.lng);
      if (remaining < 0.03) {
        navigator.geolocation.clearWatch(watchId);
        speak('목적지에 도착했습니다');
        document.getElementById('turn-arrow').textContent = '🏁';
        document.getElementById('turn-dist').textContent = '도착!';
        document.getElementById('turn-text').textContent = dest.name;
        document.getElementById('nav-eta').textContent = '도착';
        return;
      }

      const etaMin = Math.round(remaining / 0.067);
      document.getElementById('nav-eta').textContent = etaMin;
      document.getElementById('nav-dist').textContent = remaining.toFixed(1);

      // 턴 스텝 업데이트
      if (routeSteps.length > 0 && currentStepIndex < routeSteps.length - 1) {
        const next = routeSteps[currentStepIndex + 1];
        const loc = next.maneuver.location;
        const d = getDistanceKm(currentPos.lat, currentPos.lng, loc[1], loc[0]);
        if (d < 0.025) {
          currentStepIndex++;
          updateStepUI(routeSteps[currentStepIndex]);
        } else {
          document.getElementById('turn-dist').textContent =
            d < 1 ? `${Math.round(d*1000)}m` : `${d.toFixed(1)}km`;
          announceTurn(next, d);   // 200m / 50m / 즉시 음성 안내
        }
      }

      // 경로 이탈 감지 (30m 이상 벗어나면 즉시 재경로)
      const offRoute = distToRoute(currentPos.lat, currentPos.lng);
      if (offRoute > 0.03 && routeCoords.length > 1 && !isRerouting) {
        isRerouting = true;
        document.getElementById('turn-dist').textContent = '재경로...';
        speak('경로를 다시 탐색합니다');
        fetchRoute(currentPos, dest).then(route => {
          if (route) {
            routeCoords = route.geometry.coordinates.map(([lng, lat]) => ({ lat, lng }));
            routeSteps = route.legs[0].steps;
            currentStepIndex = 0;
            spokenDistBucket = null;
            updateStepUI(routeSteps[0]);
          }
          isRerouting = false;
        }).catch(() => { isRerouting = false; });
      }
    }, err => {
      console.warn(err.message);
      setOffline(true);
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 });
  }

  function stopNav() {
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    clearTimeout(rerouteTimer);
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    stopRenderLoop();
    isRerouting = false; spokenDistBucket = null;
    mapView.pitch = 0; pitchTarget = 0;
    routeCoords = []; routeSteps = []; selectedDest = null; currentHeading = null;
  }

  // ── 턴 안내 ──
  function updateStepUI(step) {
    if (!step) return;
    document.getElementById('turn-arrow').textContent = getStepArrow(step);
    document.getElementById('turn-text').textContent = getStepText(step);
    document.getElementById('turn-dist').textContent = '--';
    spokenDistBucket = null;   // 새 스텝 → 안내 버킷 초기화
  }

  // ── 음성 안내 (TTS) ──
  function speak(text) {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 1.05;
      u.volume = 1;
      speechSynthesis.speak(u);
    } catch(e) {}
  }

  // 회전 동작을 음성용 문구로
  function getStepVoice(step) {
    const type = step.maneuver.type, mod = step.maneuver.modifier || '';
    if (type === 'arrive') return '목적지에 도착했습니다';
    if (type === 'depart') return '안내를 시작합니다';
    if (mod === 'left') return '좌회전하세요';
    if (mod === 'right') return '우회전하세요';
    if (mod === 'slight left') return '좌측 방향입니다';
    if (mod === 'slight right') return '우측 방향입니다';
    if (mod === 'sharp left') return '왼쪽으로 크게 도세요';
    if (mod === 'sharp right') return '오른쪽으로 크게 도세요';
    if (mod === 'uturn') return '유턴하세요';
    return '직진하세요';
  }

  // 거리별 사전 안내 (200m / 50m / 즉시)
  function announceTurn(step, distKm) {
    if (!step) return;
    const m = distKm * 1000;
    let bucket = null;
    if (m <= 20) bucket = 'now';
    else if (m <= 50) bucket = '50';
    else if (m <= 200) bucket = '200';
    if (!bucket || bucket === spokenDistBucket) return;
    spokenDistBucket = bucket;

    const action = getStepVoice(step);
    if (bucket === 'now')      speak(action);
    else if (bucket === '50')  speak('50미터 앞 ' + action);
    else                       speak('200미터 앞 ' + action);
  }
  function getStepText(step) {
    const type = step.maneuver.type, mod = step.maneuver.modifier || '', name = step.name || '';
    if (type === 'depart') return '출발';
    if (type === 'arrive') return '목적지 도착';
    if (mod === 'left') return `좌회전${name ? ' · '+name : ''}`;
    if (mod === 'right') return `우회전${name ? ' · '+name : ''}`;
    if (mod === 'slight left') return `좌측 방향${name ? ' · '+name : ''}`;
    if (mod === 'slight right') return `우측 방향${name ? ' · '+name : ''}`;
    if (mod === 'uturn') return 'U턴';
    return name || '직진';
  }
  function getStepArrow(step) {
    const type = step.maneuver.type, mod = step.maneuver.modifier || '';
    if (type === 'arrive') return '🏁';
    if (mod === 'left') return '←'; if (mod === 'right') return '→';
    if (mod === 'slight left') return '↖'; if (mod === 'slight right') return '↗';
    if (mod === 'uturn') return '↩';
    return '↑';
  }

  // ── 로딩 ──
  function showLoading(t) { document.getElementById('loading-text').textContent = t; document.getElementById('loading-overlay').classList.remove('hidden'); }
  function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

  // ── 유틸 ──
  function getDistanceKm(lat1, lng1, lat2, lng2) {
    const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // ── 키보드 ──
  document.addEventListener('keydown', e => {
    const active = document.querySelector('.screen.active')?.id;

    if (active === 'screen-home') {
      if (e.key === 'ArrowDown') { focusHome(Math.min(focusIndex+1, homeFocusables.length-1)); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { focusHome(Math.max(focusIndex-1, 0)); e.preventDefault(); }
      else if (e.key === 'Enter') {
        if (focusIndex === 0) openSearch();
        else if (focusIndex === 1) setProfile('foot');
        else if (focusIndex === 2) setProfile('driving');
        else homeFocusables[focusIndex].click();
        e.preventDefault();
      }
    }

    if (active === 'screen-search-input') {
      const items = document.querySelectorAll('.search-result-item');
      if (e.key === 'ArrowDown') { focusSearchResult(Math.min(searchFocusIndex+1, items.length-1)); e.preventDefault(); }
      else if (e.key === 'ArrowUp') {
        if (searchFocusIndex === 0) document.getElementById('search-input').focus();
        else focusSearchResult(searchFocusIndex-1);
        e.preventDefault();
      }
      else if (e.key === 'Enter' && searchResults[searchFocusIndex]) {
        selectSearchResult(searchResults[searchFocusIndex]); e.preventDefault();
      }
      else if (e.key === 'Escape') { closeSearch(); e.preventDefault(); }
    }

    if (active === 'screen-nav') {
      if (e.key === 'Escape' || e.key === 'ArrowLeft') { stopNav(); showScreen('screen-home'); focusHome(focusIndex); e.preventDefault(); }
      else if (e.key === '+' || e.key === '=') { zoomIn(); e.preventDefault(); }
      else if (e.key === '-') { zoomOut(); e.preventDefault(); }
      // 시점 전환: 탑뷰 ↔ 쿼터뷰
      else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Enter') {
        pitchTarget = pitchTarget > 0.5 ? 0 : 1;
        e.preventDefault();
      }
      // 음성 안내 on/off
      else if (e.key === 'ArrowRight') {
        voiceOn = !voiceOn;
        if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
        document.getElementById('turn-text').textContent = voiceOn ? '🔊 음성 안내 켜짐' : '🔇 음성 안내 꺼짐';
        if (voiceOn) speak('음성 안내를 켭니다');
        setTimeout(() => {
          if (routeSteps[currentStepIndex]) updateStepUI(routeSteps[currentStepIndex]);
        }, 1500);
        e.preventDefault();
      }
    }
  });

  // ── 검색 화면 ──
  function openSearch() {
    showScreen('screen-search-input');
    setTimeout(() => document.getElementById('search-input').focus(), 50);
  }
  function closeSearch() {
    showScreen('screen-home');
    focusHome(0);
  }

  document.getElementById('search-open-btn').addEventListener('click', openSearch);
  document.getElementById('search-back-btn').addEventListener('click', closeSearch);
  document.getElementById('back-btn').addEventListener('click', () => { stopNav(); showScreen('screen-home'); buildHome(); focusHome(0); });

  // ══════════════════════════════════════════
  //  폰에서 보낸 목적지 받기
  //  · 앱이 켜질 때 한 번 확인하고, 대기 중에는 5초마다 다시 본다.
  //  · 안내 중에는 확인하지 않는다 (경로가 중간에 바뀌면 곤란하다).
  //  · 같은 목적지를 두 번 시작하지 않도록 보낸 시각으로 구분한다.
  // ══════════════════════════════════════════
  let lastDestAt = 0;
  try { lastDestAt = parseInt(localStorage.getItem('navi.destAt')) || 0; } catch (e) {}

  function checkRelay() {
    // 안내 중이거나 검색 중이면 건드리지 않는다
    const home = document.getElementById('screen-home');
    if (!home || !home.classList.contains('active')) return;

    fetch(DEST_RELAY + '/dest', { cache: 'no-store' })
      .then(r => r.json())
      .then(d => {
        const dest = d && d.dest;
        if (!dest || !dest.at || dest.at <= lastDestAt) return;
        lastDestAt = dest.at;
        try { localStorage.setItem('navi.destAt', String(dest.at)); } catch (e) {}
        startNav({
          name: dest.name || '목적지',
          addr: dest.addr || '',
          lat: dest.lat, lng: dest.lng,
          icon: '📲',
        });
      })
      .catch(() => {});   // 릴레이가 없어도 앱은 평소대로 동작해야 한다
  }

  // ── 시작 ──
  buildHome();
  getLocation();
  checkRelay();
  setInterval(checkRelay, 5000);
</script>
</body>
</html>
