<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>KO-Navi</title>
  <link rel="icon" href="navi-icon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="navi-icon-96.png" sizes="96x96" type="image/png">
  <link rel="apple-touch-icon" href="navi-icon-192.png" sizes="192x192">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 600px; height: 600px; background: #000; color: #fff; overflow: hidden;
      font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    .msg { font-size: 24px; font-weight: 700; text-align: center; padding: 0 40px; }
    .sub { font-size: 18px; color: #9fb0c0; text-align: center; padding: 0 40px; }
    .btn {
      margin-top: 8px; padding: 12px 28px; font-size: 22px; font-weight: 700;
      color: #fff; background: none; border: 3px solid #fff; border-radius: 40px; cursor: pointer;
    }
    .btn:focus { outline: none; border-color: #5cc8ff; color: #5cc8ff; }
  </style>
</head>
<body>
  <div class="msg" id="m">불러오는 중…</div>
  <div class="sub" id="s"></div>

<script>
/*  ══════════════════════════════════════════
     이 파일은 **앱이 아니다.** 앱을 불러오는 문지기다.
    ══════════════════════════════════════════

  ★★ 왜 이렇게 만들었나 (2026-08-27, 반나절을 여기서 버렸다)

    고친 파일을 올렸는데 안경에는 **옛 화면이 계속 떴다.**
    사파리에서는 새 판이 잘 떴다 — 그래서 코드가 잘못된 줄 알고
    멀쩡한 곳을 다시 팠다. 원인은 캐시였다.

    급한 대로 주소에 ?v=3 을 붙였더니 되긴 했다.
    그런데 그건 고친 게 아니다 — 안 될 때마다 v4, v5 를 붙여야 하고
    그때마다 안경에 앱을 다시 등록해야 한다.

  ★ 그래서 **주소를 고정하고, 내용을 매번 새로 받는다.**

    · 이 문지기 파일은 **앞으로 바뀌지 않는다.** 캐시돼도 상관없다.
    · 앱 본체(app.html)는 열 때마다 t=(지금시각) 을 붙여 받는다.
      주소가 매번 다르니 캐시가 낄 자리가 없다.
    · 즉 **app.html 만 올리면 다음에 열 때 바로 반영된다.**

  ★ 그리고 받은 걸 저장해둔다.
    청두에서는 VPN 이 끊기거나 느릴 수 있다.
    못 받으면 마지막으로 받아둔 판으로 연다 — 길찾기 앱이
    인터넷 없다고 아예 안 켜지면 그게 제일 곤란하다.
*/
(function () {
  var KEY = 'navi.app.html';
  var m = document.getElementById('m'), sub = document.getElementById('s');

  function run(html, stale) {
    try {
      document.open();
      document.write(html);
      document.close();
      //  ※ 저장해둔 판으로 열었으면 그렇다고 알린다.
      //    새 판인 줄 알고 "고친 게 안 먹는다" 고 또 헤매면 안 된다.
      if (stale) setTimeout(function () {
        try {
          var t = document.getElementById('build-tag');
          if (t) { t.textContent += ' · 저장본'; t.style.color = '#ffd27a'; }
        } catch (e) {}
      }, 300);
    } catch (e) {
      m.textContent = '앱을 여는 데 실패했습니다';
      sub.textContent = String(e && e.message || e);
    }
  }

  function fallback(why) {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved) { run(saved, true); return; }
    m.textContent = '앱을 못 불러왔습니다';
    sub.textContent = why + ' · 인터넷을 확인하고 다시 시도하십시오';
    var b = document.createElement('button');
    b.className = 'btn'; b.textContent = '다시 시도';
    b.onclick = function () { location.reload(); };
    document.body.appendChild(b);
    b.focus();
  }

  var done = false;
  //  ★ 시간 제한을 둔다. 이게 없으면 느린 망에서 '불러오는 중…' 이 영영 남는다.
  var timer = setTimeout(function () {
    if (!done) { done = true; fallback('시간 초과'); }
  }, 10000);

  fetch('app.html?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      if (done) return;
      done = true; clearTimeout(timer);
      if (html.indexOf('<script') < 0) throw new Error('내용이 이상합니다');
      try { localStorage.setItem(KEY, html); } catch (e) {}   // 용량이 넘쳐도 여는 건 계속한다
      run(html, false);
    })
    .catch(function (e) {
      if (done) return;
      done = true; clearTimeout(timer);
      fallback(String(e && e.message || e));
    });
})();
</script>
</body>
</html>
